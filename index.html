  // ===== 대결 모드 엔진 =====
  let shooter = "me";                 // 지금 공을 던진 쪽
  let checkT = 0;                     // 공격권 리셋 대기
  const CHECK_F = 50;

  const cpuState = () => ({
    x: cpu.x, z: cpu.z, lift: cpu.lift + shotLift(cpu.shotJumpT),
    hang: cpu.hang, dunkMode: cpu.dunking,
    armsUp: cpu.armsUp, dribbling: possession === "cpu" && cpu.state === "drive",
    dribPhase: cpu.dribPhase, dribSide: cpu.dribSide, data: foe(),
    runAmt: cpu.runAmt, runPhase: cpu.runPhase, leanX: cpu.leanX,
    headYaw: cpu.headYaw, bodyYaw: cpu.bodyYaw
  });

  function fireShot(sx, sz, speed) {
    const D = Math.max(0.4, Math.hypot(sx, sz - HOOP_Z));
    ball.dx = sx / D; ball.dz = (sz - HOOP_Z) / D;
    ball.p = D; ball.y = RELEASE_H;
    ball.vp = -Math.cos(SHOT_ANGLE) * speed;
    ball.vy = Math.sin(SHOT_ANGLE) * speed;
    ball.rot = 0; ball.live = true; ball.scored = false;
    ball.boardOn = boardReachable(sx, sz);
    settleTimer = 0; shotTimer = 0;
  }

  function vsReset(full) {
    if (full) {
      myScore = 0; cpuScore = 0; vsOver = false; vsWinner = null;
      possession = "me"; gameOver = false;
    }
    doCheck();
  }

  // 공격권 세팅 (탑에서 시작)
  const CHECK_Z = HOOP_Z + THREE_R + 0.35;      // 정면 3점 라인 바로 뒤
  function doCheck() {
    const off = possession === "me" ? player : cpu;
    const def = possession === "me" ? cpu : player;
    off.x = 0; off.z = CHECK_Z;
    def.x = 0; def.z = CHECK_Z - 1.6;
    cpu.lift = 0; cpu.hang = 0; cpu.dunking = false; cpu.armsUp = 0;
    cpu.state = possession === "cpu" ? "drive" : "guard";
    cpu.timer = 40 + Math.round(Math.random() * 40);
    pickCpuSpot();
    dunk.active = false; dunk.lift = 0;
    defense.blockT = 0; defense.stealT = 0; defense.blockLift = 0;
    charging = false; power = 0;
    newBall(); bandDirty = true;
    checkT = CHECK_F;
    // 방금 뜬 메시지(BLOCK!·리바운드·득점)를 덮지 않는다
    if (vsMsgTimer < 12) say("CHECK", "#9aa3b2", CHECK_F);
  }

  // CPU 가 노릴 슛 지점 — 능력치에 따라 3점/골밑 취향이 갈린다
  function pickCpuSpot() {
    const f = foe();
    const wantThree = Math.random() * 100 < f.three_pt * 0.7;
    const wantDunk = !wantThree && Math.random() * 100 < f.dunk * 0.45;
    const ang = (Math.random() - 0.5) * 1.5;
    if (wantDunk) { cpu.targetX = Math.sin(ang) * 0.6; cpu.targetZ = HOOP_Z + 1.0; }
    else if (wantThree) {
      const r = THREE_R + 0.35 + Math.random() * 0.6;
      cpu.targetX = Math.sin(ang) * r * 0.9; cpu.targetZ = HOOP_Z + Math.cos(ang) * r;
    } else {
      const r = 3.0 + Math.random() * 2.8;
      cpu.targetX = Math.sin(ang) * r * 0.9; cpu.targetZ = HOOP_Z + Math.cos(ang) * r;
    }
    cpu.targetX = Math.max(PLAYER_MIN_X, Math.min(PLAYER_MAX_X, cpu.targetX));
    cpu.targetZ = Math.max(PLAYER_MIN_Z, Math.min(PLAYER_MAX_Z, cpu.targetZ));
  }

  const cpuSpeed = () => BASE_MOVE_SPEED * (foe().speed / 100) * diff().spd;

  // 몸싸움: 겹치면 파워가 높은 쪽이 밀어내고 낮은 쪽이 더 많이 밀려난다
  const BODY_R = 0.62;
  function bodyCollide() {
    const dx = player.x - cpu.x, dz = player.z - cpu.z;
    let d = Math.hypot(dx, dz);
    if (d >= BODY_R) return;
    if (d < 1e-4) { d = 1e-4; }
    const ux = dx / d, uz = dz / d;
    const push = BODY_R - d;
    const pm = me().power, pc = foe().power;
    const shareMe = pc / (pm + pc);      // 상대 파워가 셀수록 내가 많이 밀린다
    const shareCpu = pm / (pm + pc);
    player.x = Math.max(PLAYER_MIN_X, Math.min(PLAYER_MAX_X, player.x + ux * push * shareMe));
    player.z = Math.max(PLAYER_MIN_Z, Math.min(PLAYER_MAX_Z, player.z + uz * push * shareMe));
    cpu.x = Math.max(PLAYER_MIN_X, Math.min(PLAYER_MAX_X, cpu.x - ux * push * shareCpu));
    cpu.z = Math.max(PLAYER_MIN_Z, Math.min(PLAYER_MAX_Z, cpu.z - uz * push * shareCpu));
    bandDirty = true;
  }

  function moveToward(e, tx, tz, sp) {
    const dx = tx - e.x, dz = tz - e.z;
    const d = Math.hypot(dx, dz);
    if (d < sp) { e.x = tx; e.z = tz; e.moving = false; return true; }
    e.moving = true; e.dirX = dx / d; e.dirZ = dz / d;
    e.x += dx / d * sp; e.z += dz / d * sp;
    e.x = Math.max(PLAYER_MIN_X, Math.min(PLAYER_MAX_X, e.x));
    e.z = Math.max(PLAYER_MIN_Z, Math.min(PLAYER_MAX_Z, e.z));
    return false;
  }

  function cpuShoot() {
    // 내가 타이밍 맞춰 뛰어 있으면 블락 판정
    if (tryBlockNow()) { turnover("me", "BLOCK!", "#4ade80"); return; }

    const d = hoopDist(cpu.x, cpu.z);
    const three = isThreeAt(cpu.x, cpu.z);
    const f = foe();

    // 내가 가까이 붙어 있으면 성공률이 떨어진다
    const guard = Math.hypot(player.x - cpu.x, player.z - cpu.z);
    const contest = guard < 1.8 ? 1 - 0.40 * (1 - guard / 1.8) : 1;

    if (d < DUNK_RANGE + 0.5) {                       // 덩크
      cpu.dunking = true; cpu.timer = RISE_F;
      cpu.shotWillMake = Math.random() * 100 < f.dunk * diff().aim * contest;
      cpu.state = "dunk";
      return;
    }
    const stat = three ? f.three_pt : f.two_pt;
    const p = (stat / 100) * diff().aim * contest * (1 - Math.min(0.25, d * 0.02));
    const make = Math.random() < p;
    const b = findBand(d, boardReachable(cpu.x, cpu.z));
    let speed;
    if (b) speed = make ? (b.lo + b.hi) / 2 : b.hi + (b.hi - b.lo) * (0.8 + Math.random() * 0.6);
    else speed = 0.17;
    cpu.shotWillMake = make;
    shooter = "cpu"; shotIsDunk = false;
    shotValue = three ? 3 : 2;
    cpu.armsUp = 1;
    cpu.shotJumpT = SHOT_JUMP_F;          // CPU 도 점프슛
    fireShot(cpu.x, cpu.z, speed);
    cpu.state = "watch";
  }

  // 내가 블락 시도 — 점프 중 CPU 가 쏘면 판정
  function tryBlockNow() {
    if (defense.blockT < 6 || defense.blockT > 20) return false;
    const d = Math.hypot(player.x - cpu.x, player.z - cpu.z);
    if (d > 1.9) return false;
    const m = me();
    const reach = (m.block * 0.7 + m.jump * 0.3) / 100;
    const p = reach * (1 - d / 1.9) * 1.15;
    return Math.random() < p;
  }

  function trySteal(byMe) {
    const a = byMe ? me() : foe();
    const b = byMe ? foe() : me();
    const d = Math.hypot(player.x - cpu.x, player.z - cpu.z);
    const range = 1.4;
    if (d > range) return false;
    const p = (a.steal / 100) * (1 - b.power / 230) * (1 - d / range) * 0.95;
    return Math.random() < p;
  }

  function turnover(to, msg, col) {
    ball.live = false; dunk.active = false; cpu.dunking = false;
    possession = to;
    say(msg, col || "#60a5fa", 90);
    doCheck();
  }

  function addScore(who, val) {
    if (who === "me") myScore += val; else cpuScore += val;
    if (myScore >= TARGET_SCORE || cpuScore >= TARGET_SCORE) {
      vsOver = true; gameOver = true;
      vsWinner = myScore >= TARGET_SCORE ? "me" : "cpu";
      ball.live = false; dunk.active = false; cpu.dunking = false;
      return true;
    }
    return false;
  }

  function vsStep() {
    if (vsMsgTimer > 0) vsMsgTimer--;
    if (vsOver) return;
    if (checkT > 0) { checkT--; return; }
    if (!dunk.active && !cpu.dunking) bodyCollide();   // 공중에 뜬 동안은 제외

    // --- CPU 공격 ---
    if (possession === "cpu") {
      if (cpu.state === "drive") {
        const reached = moveToward(cpu, cpu.targetX, cpu.targetZ, cpuSpeed());
        cpu.dribPhase = (cpu.dribPhase + 1 / DRIB_PERIOD) % 1;
        if (Math.abs(cpu.targetX - cpu.x) > 0.05) cpu.dribSide = cpu.targetX > cpu.x ? 1 : -1;
        cpu.timer--;
        if (reached && cpu.timer <= 0) cpuShoot();
        else if (cpu.timer < -90) cpuShoot();        // 너무 끌면 그냥 쏜다
      } else if (cpu.state === "dunk") {
        cpu.timer--;
        const p = 1 - Math.max(0, cpu.timer) / RISE_F;
        cpu.lift = dunkApex(foe(), cpu.shotWillMake) * Math.sin(p * Math.PI / 2);
        if (cpu.timer <= 0) {
          shooter = "cpu"; shotIsDunk = true; shotValue = 2;
          if (cpu.shotWillMake) { ball.dx = 0; ball.dz = 1; ball.p = 0.06; ball.y = RIM_H + BALL_R + 0.06;
            ball.vp = -0.012; ball.vy = -0.08; }
          else { ball.dx = 0; ball.dz = 1; ball.p = RIM_R + BALL_R * 0.5; ball.y = RIM_H + BALL_R * 1.2;
            ball.vp = 0.028; ball.vy = -0.03; }
          ball.rot = 0; ball.live = true; ball.scored = false;
          settleTimer = 0; shotTimer = 0;
          cpu.state = "watch";
        }
      } else if (cpu.state === "watch") {
        cpu.lift *= 0.86; cpu.armsUp *= 0.92;
      }

      // 내 수비 액션
      if (defense.stealT > 0) {
        defense.stealT--;
        if (defense.stealT === 10 && cpu.state === "drive") {
          if (trySteal(true)) { turnover("me", "STEAL!", "#4ade80"); return; }
        }
      }
      if (defense.blockT > 0) {
        defense.blockT--;
        defense.blockLift = 0.9 * Math.sin((1 - defense.blockT / 24) * Math.PI) * (me().jump / 100);
      } else defense.blockLift = 0;

    // --- 내 공격 ---
    } else {
      cpu.armsUp = 0; cpu.lift *= 0.86;
      if (!ball.live && !dunk.active) {
        // 수비 위치: 나와 골대 사이
        const tx = player.x * 0.72, tz = HOOP_Z + (player.z - HOOP_Z) * 0.72;
        moveToward(cpu, tx, tz, cpuSpeed() * 0.95);
        cpu.state = "guard";
        // CPU 스틸 시도
        cpu.timer--;
        if (cpu.timer <= 0) {
          cpu.timer = Math.round(70 + Math.random() * 90 / Math.max(0.3, diff().aggr));
          if (moving && trySteal(false)) { turnover("cpu", "스틸 당했다!", "#ff7a7a"); return; }
        }
      }
    }
  }

  // 대결 모드에서 슛이 끝났을 때
  function vsEndShot() {
    const who = shooter;
    if (ball.scored) {
      say(shotIsDunk ? "DUNK! +2" : (shotValue === 3 ? "3점!" : "+2"),
          who === "me" ? "#4ade80" : "#ff9a5c", 80);
      if (addScore(who, shotIsDunk ? 2 : shotValue)) return;
      possession = who;                 // 넣은 쪽이 계속 공격
      doCheck();
    } else {
      // 리바운드 없음 — 빗나가면 공격권이 바로 넘어간다
      possession = who === "me" ? "cpu" : "me";
      say(possession === "me" ? "공격권 획득!" : "공격권 넘어감",
          possession === "me" ? "#4ade80" : "#ff9a5c", 75);
      doCheck();
    }
  }

  // ---- 얼굴 (선택 화면 전용. 경기 중에는 뒷모습이라 얼굴이 안 보인다) ----
  // 일러스트풍: 긴 얼굴 + 광대/턱 음영 + 왼쪽 림라이트
  function drawFace(cx, cy, r, p) {
    const SK = p.skin || "#8a5a3b";
    const sk = SK;
    const skDk = shade(SK, 0.74);          // 그늘
    const skDk2 = shade(SK, 0.58);         // 깊은 그늘
    const skLt = shade(SK, 1.14);          // 광대 하이라이트
    const skRim = shade(SK, 1.38);         // 림라이트
    const hairCol = p.hair || "#1d1510";
    const hairLt = shade(hairCol, 1.55);

    // 윤곽선 경로 (긴 달걀 + 각진 턱)
    function facePath() {
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.84, cy - r * 0.26);
      ctx.bezierCurveTo(cx - r * 0.86, cy - r * 0.86, cx - r * 0.50, cy - r * 1.10, cx, cy - r * 1.10);
      ctx.bezierCurveTo(cx + r * 0.50, cy - r * 1.10, cx + r * 0.86, cy - r * 0.86, cx + r * 0.84, cy - r * 0.26);
      ctx.bezierCurveTo(cx + r * 0.82, cy + r * 0.26, cx + r * 0.68, cy + r * 0.60, cx + r * 0.46, cy + r * 0.82);
      ctx.bezierCurveTo(cx + r * 0.28, cy + r * 1.00, cx - r * 0.28, cy + r * 1.00, cx - r * 0.46, cy + r * 0.82);
      ctx.bezierCurveTo(cx - r * 0.68, cy + r * 0.60, cx - r * 0.82, cy + r * 0.26, cx - r * 0.84, cy - r * 0.26);
      ctx.closePath();
    }

    // 목 + 승모근
    ctx.fillStyle = skDk2;
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.34, cy + r * 0.66);
    ctx.lineTo(cx + r * 0.34, cy + r * 0.66);
    ctx.lineTo(cx + r * 0.42, cy + r * 1.40);
    ctx.lineTo(cx - r * 0.42, cy + r * 1.40);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = skDk;
    ctx.beginPath();
    ctx.ellipse(cx, cy + r * 0.80, r * 0.32, r * 0.30, 0, 0, Math.PI * 2); ctx.fill();

    // 귀
    for (const sg of [-1, 1]) {
      ctx.fillStyle = sg < 0 ? skDk : skDk2;
      ctx.beginPath();
      ctx.ellipse(cx + sg * r * 0.86, cy + r * 0.02, r * 0.15, r * 0.26, sg * 0.12, 0, Math.PI * 2);
      ctx.fill();
    }

    // 얼굴 바탕
    facePath();
    ctx.fillStyle = sk; ctx.fill();

    // ----- 음영 (얼굴 안쪽에만) -----
    ctx.save();
    facePath(); ctx.clip();

    // 오른쪽 전체 그늘
    const sg1 = ctx.createLinearGradient(cx - r * 0.5, 0, cx + r * 0.9, 0);
    sg1.addColorStop(0, "rgba(0,0,0,0)");
    sg1.addColorStop(1, "rgba(0,0,0,.30)");
    ctx.fillStyle = sg1;
    ctx.fillRect(cx - r * 1.1, cy - r * 1.2, r * 2.2, r * 2.4);

    // 이마 아래 브로우 그늘
    ctx.fillStyle = skDk;
    ctx.globalAlpha = 0.45;
    ctx.beginPath();
    ctx.ellipse(cx, cy - r * 0.26, r * 0.80, r * 0.22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // 광대 하이라이트
    ctx.fillStyle = skLt;
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.ellipse(cx - r * 0.42, cy + r * 0.10, r * 0.30, r * 0.20, -0.35, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.30;
    ctx.beginPath();
    ctx.ellipse(cx + r * 0.42, cy + r * 0.10, r * 0.26, r * 0.17, 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // 볼 아래 꺼진 면
    ctx.fillStyle = skDk;
    ctx.globalAlpha = 0.38;
    for (const sg of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(cx + sg * r * 0.58, cy + r * 0.40, r * 0.22, r * 0.30, sg * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 턱 밑 그늘
    ctx.fillStyle = skDk2;
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.ellipse(cx, cy + r * 1.02, r * 0.50, r * 0.22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // 이마 하이라이트
    ctx.fillStyle = skLt;
    ctx.globalAlpha = 0.34;
    ctx.beginPath();
    ctx.ellipse(cx - r * 0.18, cy - r * 0.68, r * 0.40, r * 0.20, -0.15, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // 왼쪽 림라이트
    ctx.strokeStyle = skRim;
    ctx.globalAlpha = 0.75;
    ctx.lineWidth = Math.max(1.2, r * 0.075);
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.80, cy - r * 0.52);
    ctx.bezierCurveTo(cx - r * 0.90, cy + r * 0.10, cx - r * 0.74, cy + r * 0.56, cx - r * 0.44, cy + r * 0.84);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();

    // ----- 머리 -----
    const browY = cy - r * 0.26, eyeY = cy - r * 0.05, eyeX = r * 0.36;

    if (p.hairStyle === "bald") {
      ctx.save(); facePath(); ctx.clip();
      ctx.fillStyle = skLt; ctx.globalAlpha = 0.40;
      ctx.beginPath();
      ctx.ellipse(cx - r * 0.20, cy - r * 0.82, r * 0.38, r * 0.16, -0.25, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1; ctx.restore();
    } else if (p.hairStyle === "curly") {              // 크고 둥근 아프로
      ctx.fillStyle = hairCol;
      ctx.beginPath();
      ctx.ellipse(cx, cy - r * 0.60, r * 1.22, r * 1.00, 0, Math.PI * 0.92, Math.PI * 2.08);
      ctx.fill();
      for (let i = 0; i < 11; i++) {
        const a = Math.PI * 0.92 + (i + 0.5) / 11 * Math.PI * 1.16;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * r * 1.14, cy - r * 0.60 + Math.sin(a) * r * 0.94, r * 0.26, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = hairLt; ctx.globalAlpha = 0.28;
      ctx.beginPath();
      ctx.ellipse(cx - r * 0.52, cy - r * 1.02, r * 0.40, r * 0.22, -0.5, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.hairStyle === "shaggy") {             // 층진 장발
      ctx.fillStyle = hairCol;
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.96, cy - r * 0.20);
      ctx.bezierCurveTo(cx - r * 1.10, cy - r * 1.00, cx - r * 0.40, cy - r * 1.32, cx, cy - r * 1.30);
      ctx.bezierCurveTo(cx + r * 0.40, cy - r * 1.32, cx + r * 1.10, cy - r * 1.00, cx + r * 0.96, cy - r * 0.20);
      ctx.lineTo(cx + r * 0.98, cy + r * 0.28);
      ctx.bezierCurveTo(cx + r * 0.80, cy - r * 0.10, cx + r * 0.86, cy - r * 0.46, cx + r * 0.72, cy - r * 0.56);
      ctx.bezierCurveTo(cx + r * 0.30, cy - r * 0.30, cx - r * 0.30, cy - r * 0.30, cx - r * 0.72, cy - r * 0.56);
      ctx.bezierCurveTo(cx - r * 0.86, cy - r * 0.46, cx - r * 0.80, cy - r * 0.10, cx - r * 0.98, cy + r * 0.28);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = hairLt; ctx.globalAlpha = 0.35;
      ctx.beginPath();
      ctx.ellipse(cx - r * 0.42, cy - r * 0.94, r * 0.36, r * 0.18, -0.4, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else {                                           // 짧은 머리 / 페이드
      ctx.fillStyle = hairCol;
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.86, cy - r * 0.34);
      ctx.bezierCurveTo(cx - r * 0.92, cy - r * 0.96, cx - r * 0.50, cy - r * 1.20, cx, cy - r * 1.20);
      ctx.bezierCurveTo(cx + r * 0.50, cy - r * 1.20, cx + r * 0.92, cy - r * 0.96, cx + r * 0.86, cy - r * 0.34);
      ctx.lineTo(cx + r * 0.80, cy - r * 0.44);
      ctx.bezierCurveTo(cx + r * 0.40, cy - r * 0.70, cx - r * 0.40, cy - r * 0.70, cx - r * 0.80, cy - r * 0.44);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = hairLt; ctx.globalAlpha = 0.30;
      ctx.beginPath();
      ctx.ellipse(cx - r * 0.34, cy - r * 0.92, r * 0.34, r * 0.14, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // 헤드밴드
    if (p.headband) {
      ctx.strokeStyle = shade(p.uniform, 1.25);
      ctx.lineWidth = r * 0.27;
      ctx.beginPath();
      ctx.ellipse(cx, cy - r * 0.40, r * 0.84, r * 0.56, 0, Math.PI * 1.06, Math.PI * 1.94);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,.20)";
      ctx.lineWidth = r * 0.07;
      ctx.beginPath();
      ctx.ellipse(cx, cy - r * 0.47, r * 0.84, r * 0.56, 0, Math.PI * 1.10, Math.PI * 1.90);
      ctx.stroke();
    }

    // ----- 눈썹 -----
    ctx.strokeStyle = p.hairStyle === "bald" ? "#241a12" : shade(hairCol, 0.85);
    ctx.lineWidth = Math.max(1.3, r * 0.125);
    ctx.lineCap = "round";
    const angry = p.mood === "intense" ? r * 0.10 : 0;
    for (const sg of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + sg * (eyeX + r * 0.26), browY - r * 0.06);
      ctx.quadraticCurveTo(cx + sg * eyeX, browY - r * 0.13,
                           cx + sg * (eyeX - r * 0.22), browY + angry);
      ctx.stroke();
    }

    // ----- 눈 -----
    for (const sg of [-1, 1]) {
      const ex = cx + sg * eyeX;
      ctx.fillStyle = "#e4d9c9";
      ctx.beginPath(); ctx.ellipse(ex, eyeY, r * 0.19, r * 0.115, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,.18)";                 // 위쪽 그늘
      ctx.beginPath(); ctx.ellipse(ex, eyeY - r * 0.06, r * 0.21, r * 0.07, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#4a3524";                          // 홍채
      ctx.beginPath(); ctx.arc(ex, eyeY, r * 0.088, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#241a12";                          // 동공
      ctx.beginPath(); ctx.arc(ex, eyeY, r * 0.040, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.9)";
      ctx.beginPath(); ctx.arc(ex - r * 0.045, eyeY - r * 0.045, r * 0.032, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(25,15,8,.85)";              // 윗꺼풀
      ctx.lineWidth = Math.max(1, r * 0.055);
      ctx.beginPath();
      ctx.moveTo(ex - r * 0.21, eyeY - r * 0.03);
      ctx.quadraticCurveTo(ex, eyeY - r * 0.16, ex + r * 0.21, eyeY - r * 0.03);
      ctx.stroke();
    }

    // ----- 코 (선이 아니라 면 음영) -----
    ctx.fillStyle = skDk;
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.moveTo(cx + r * 0.055, eyeY + r * 0.02);
    ctx.quadraticCurveTo(cx + r * 0.16, cy + r * 0.20, cx + r * 0.13, cy + r * 0.32);
    ctx.quadraticCurveTo(cx, cy + r * 0.40, cx - r * 0.13, cy + r * 0.32);
    ctx.quadraticCurveTo(cx - r * 0.04, cy + r * 0.18, cx - r * 0.03, eyeY + r * 0.02);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = skLt; ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.ellipse(cx - r * 0.035, cy + r * 0.12, r * 0.05, r * 0.16, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = skDk2;
    for (const sg of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(cx + sg * r * 0.11, cy + r * 0.31, r * 0.045, r * 0.030, 0, 0, Math.PI * 2); ctx.fill();
    }

    // ----- 입 -----
    const mouthY = cy + r * 0.60;
    const lipDk = shade(SK, 0.52);
    if (p.mood === "smile") {
      ctx.fillStyle = "#3a2018";
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.34, mouthY - r * 0.05);
      ctx.quadraticCurveTo(cx, mouthY + r * 0.30, cx + r * 0.34, mouthY - r * 0.05);
      ctx.quadraticCurveTo(cx, mouthY + r * 0.08, cx - r * 0.34, mouthY - r * 0.05);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#f2ece2";                       // 이
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.29, mouthY - r * 0.02);
      ctx.quadraticCurveTo(cx, mouthY + r * 0.13, cx + r * 0.29, mouthY - r * 0.02);
      ctx.quadraticCurveTo(cx, mouthY + r * 0.05, cx - r * 0.29, mouthY - r * 0.02);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = lipDk;
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.28, mouthY);
      ctx.quadraticCurveTo(cx - r * 0.12, mouthY - r * 0.10, cx, mouthY - r * 0.03);
      ctx.quadraticCurveTo(cx + r * 0.12, mouthY - r * 0.10, cx + r * 0.28, mouthY);
      ctx.quadraticCurveTo(cx, mouthY + r * (p.mood === "intense" ? 0.10 : 0.16), cx - r * 0.28, mouthY);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(30,15,10,.6)";
      ctx.lineWidth = Math.max(1, r * 0.045);
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.27, mouthY);
      ctx.quadraticCurveTo(cx, mouthY + r * 0.04, cx + r * 0.27, mouthY);
      ctx.stroke();
    }

    // ----- 수염 -----
    const beardCol = p.hairStyle === "bald" ? "#241a12" : shade(hairCol, 0.92);
    ctx.fillStyle = beardCol;
    if (p.facial === "mustache") {
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.32, mouthY - r * 0.16);
      ctx.quadraticCurveTo(cx, mouthY - r * 0.34, cx + r * 0.32, mouthY - r * 0.16);
      ctx.quadraticCurveTo(cx, mouthY - r * 0.10, cx - r * 0.32, mouthY - r * 0.16);
      ctx.closePath(); ctx.fill();
    } else if (p.facial === "goatee") {
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.30, mouthY - r * 0.16);
      ctx.quadraticCurveTo(cx, mouthY - r * 0.32, cx + r * 0.30, mouthY - r * 0.16);
      ctx.quadraticCurveTo(cx, mouthY - r * 0.10, cx - r * 0.30, mouthY - r * 0.16);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx, mouthY + r * 0.17, r * 0.09, r * 0.08, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx, mouthY + r * 0.36, r * 0.17, r * 0.14, 0, 0, Math.PI * 2); ctx.fill();
    } else if (p.facial === "beard") {
      ctx.save(); facePath(); ctx.clip();
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.84, cy - r * 0.06);
      ctx.bezierCurveTo(cx - r * 0.80, cy + r * 0.76, cx - r * 0.34, cy + r * 1.08, cx, cy + r * 1.08);
      ctx.bezierCurveTo(cx + r * 0.34, cy + r * 1.08, cx + r * 0.80, cy + r * 0.76, cx + r * 0.84, cy - r * 0.06);
      ctx.bezierCurveTo(cx + r * 0.62, cy + r * 0.34, cx + r * 0.34, cy + r * 0.40, cx, cy + r * 0.40);
      ctx.bezierCurveTo(cx - r * 0.34, cy + r * 0.40, cx - r * 0.62, cy + r * 0.34, cx - r * 0.84, cy - r * 0.06);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.32, mouthY - r * 0.16);
      ctx.quadraticCurveTo(cx, mouthY - r * 0.34, cx + r * 0.32, mouthY - r * 0.16);
      ctx.quadraticCurveTo(cx, mouthY - r * 0.10, cx - r * 0.32, mouthY - r * 0.16);
      ctx.closePath(); ctx.fill();
    }

    // ----- 고글 -----
    if (p.goggles) {
      ctx.fillStyle = "rgba(185,210,240,.22)";
      for (const sg of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(cx + sg * eyeX, eyeY, r * 0.31, r * 0.25, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.strokeStyle = "rgba(235,243,255,.95)";
      ctx.lineWidth = Math.max(1.4, r * 0.085);
      for (const sg of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(cx + sg * eyeX, eyeY, r * 0.31, r * 0.25, 0, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.06, eyeY - r * 0.02); ctx.lineTo(cx + r * 0.06, eyeY - r * 0.02); ctx.stroke();
      for (const sg of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(cx + sg * (eyeX + r * 0.31), eyeY);
        ctx.lineTo(cx + sg * r * 0.98, eyeY - r * 0.08);
        ctx.stroke();
      }
      ctx.strokeStyle = "rgba(255,255,255,.55)";        // 렌즈 반사
      ctx.lineWidth = Math.max(1, r * 0.05);
      for (const sg of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(cx + sg * eyeX - r * 0.17, eyeY - r * 0.10);
        ctx.lineTo(cx + sg * eyeX - r * 0.02, eyeY - r * 0.17);
        ctx.stroke();
      }
    }
    ctx.lineCap = "butt";
  }

  // ===== 캐릭터 선택 화면 =====
  function cardBox(i) {
    const margin = 46, gap = 14;
    const cw = (W - margin * 2 - gap * 6) / 7;
    return { x: margin + i * (cw + gap), y: 176, w: cw, h: 428 };
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSelect() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#1a1f2b"); g.addColorStop(1, "#0e1116");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.fillStyle = "#e9ecf1"; ctx.font = "bold 42px sans-serif";
    ctx.fillText("선수를 고르세요", W / 2, 96);
    ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.font = "17px sans-serif";
    ctx.fillText(touchUI ? "카드를 누르면 선택 · 한 번 더 누르면 시작"
                         : "← → 로 고르고  Enter 로 시작", W / 2, 132);

    const STATS = [["3점", "three_pt"], ["2점", "two_pt"], ["덩크", "dunk"], ["속도", "speed"],
                   ["파워", "power"], ["점프", "jump"], ["블락", "block"], ["스틸", "steal"]];

    for (let i = 0; i < PLAYER_KEYS.length; i++) {
      const p = PLAYERS[PLAYER_KEYS[i]];
      const b = cardBox(i);
      const on = i === pick;

      ctx.fillStyle = on ? "rgba(255,255,255,.10)" : "rgba(255,255,255,.045)";
      roundRect(b.x, b.y, b.w, b.h, 14); ctx.fill();
      ctx.strokeStyle = on ? p.uniform : "rgba(255,255,255,.12)";
      ctx.lineWidth = on ? 4 : 1.5;
      roundRect(b.x, b.y, b.w, b.h, 14); ctx.stroke();

      const mx = b.x + b.w / 2;

      // 유니폼 (어깨) + 등번호
      const bw = b.w * 0.62, bh = 44;
      const bx = b.x + (b.w - bw) / 2, by = b.y + 104;
      ctx.fillStyle = shade(p.uniform, 0.82);
      roundRect(bx, by, bw, bh, 9); ctx.fill();
      ctx.fillStyle = p.uniform;
      roundRect(bx + 3, by, bw - 6, bh - 5, 8); ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,.30)"; ctx.font = "bold 24px sans-serif";
      ctx.fillText(String(p.number), mx + 1, by + 32);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(p.number), mx, by + 31);

      // 얼굴
      const fr = Math.min(31, b.w * 0.235);
      drawFace(mx, b.y + 60, fr, p);

      // 운동화
      ctx.fillStyle = p.shoe;
      roundRect(mx - 26, by + bh + 7, 22, 9, 4); ctx.fill();
      roundRect(mx + 4, by + bh + 7, 22, 9, 4); ctx.fill();
      ctx.fillStyle = p.shoeAccent;
      ctx.fillRect(mx - 26, by + bh + 14, 22, 3);
      ctx.fillRect(mx + 4, by + bh + 14, 22, 3);

      // 이름
      ctx.fillStyle = on ? "#ffffff" : "rgba(255,255,255,.75)";
      ctx.font = "bold 14px sans-serif";
      ctx.fillText(p.name, b.x + b.w / 2, b.y + 181);

      // 능력치 8개 (공격 4 + 수비·신체 4)
      const barW = b.w - 30;
      for (let k = 0; k < STATS.length; k++) {
        const v = p[STATS[k][1]];
        const yy = b.y + 199 + k * 29;
        if (k === 4) {                       // 공격 / 수비 구분선
          ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(b.x + 15, yy - 15); ctx.lineTo(b.x + b.w - 15, yy - 15); ctx.stroke();
        }
        ctx.textAlign = "left";
        ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.font = "11px sans-serif";
        ctx.fillText(STATS[k][0], b.x + 15, yy - 3);
        ctx.textAlign = "right";
        ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.font = "bold 11px sans-serif";
        ctx.fillText(String(v), b.x + b.w - 15, yy - 3);
        ctx.fillStyle = "rgba(255,255,255,.12)";
        ctx.fillRect(b.x + 15, yy, barW, 6);
        ctx.fillStyle = v >= 90 ? "#4ade80" : (v >= 70 ? "#f3c542" : "#e06c5a");
        ctx.fillRect(b.x + 15, yy, barW * v / 100, 6);
        ctx.textAlign = "center";
      }
    }

    // 상대 선수 안내
    ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.font = "16px sans-serif";
    ctx.fillText("상대 선수는 남은 선수 중에서 자동 배정됩니다", W / 2, H - 52);
    ctx.textAlign = "left";
  }

  function confirmPick() {
    myKey = PLAYER_KEYS[pick];
    const rest = PLAYER_KEYS.filter((k) => k !== myKey);
    rivalKey = rest[Math.floor(Math.random() * rest.length)];
    scene = "play";
    if (vsMode) { gameOver = false; vsReset(true); }
    else reset();
  }

  // ===== 모드 / 난이도 선택 화면 =====
  function modeBox(i) {
    const w = Math.min(560, W * 0.45), h = 150;
    return { x: (W - w) / 2, y: 190 + i * 178, w: w, h: h };
  }
  function diffBox(i) {
    const b = modeBox(1), w = (b.w - 24) / 3;
    return { x: b.x + i * (w + 12), y: b.y + b.h + 16, w: w, h: 52 };
  }

  function drawMode() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#1a1f2b"); g.addColorStop(1, "#0e1116");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.fillStyle = "#e9ecf1"; ctx.font = "bold 46px sans-serif";
    ctx.fillText("🏀  모드를 고르세요", W / 2, 110);
    ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.font = "16px sans-serif";
    ctx.fillText(touchUI ? "눌러서 선택 · 한 번 더 누르면 시작" : "↑ ↓ 모드   ← → 난이도   Enter 시작", W / 2, 146);

    const titles = ["혼자 슛 연습", "CPU 대결 (21점 선취)"];
    const descs = ["10구 던져서 점수 내기", "1대1 · 수비 · 블락 · 스틸"];
    for (let i = 0; i < 2; i++) {
      const b = modeBox(i), on = modePick === i;
      ctx.fillStyle = on ? "rgba(255,255,255,.10)" : "rgba(255,255,255,.04)";
      roundRect(b.x, b.y, b.w, b.h, 16); ctx.fill();
      ctx.strokeStyle = on ? "#f3c542" : "rgba(255,255,255,.12)";
      ctx.lineWidth = on ? 4 : 1.5;
      roundRect(b.x, b.y, b.w, b.h, 16); ctx.stroke();
      ctx.fillStyle = on ? "#ffffff" : "rgba(255,255,255,.7)";
      ctx.font = "bold 30px sans-serif";
      ctx.fillText(titles[i], W / 2, b.y + 58);
      ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.font = "17px sans-serif";
      ctx.fillText(descs[i], W / 2, b.y + 94);
    }

    // 난이도 (대결 모드일 때만)
    if (modePick === 1) {
      ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.font = "15px sans-serif";
      const b0 = diffBox(0);
      ctx.textAlign = "left";
      ctx.fillText("난이도", b0.x, b0.y - 10);
      ctx.textAlign = "center";
      for (let i = 0; i < 3; i++) {
        const b = diffBox(i), on = diffPick === i;
        ctx.fillStyle = on ? "rgba(243,197,66,.22)" : "rgba(255,255,255,.05)";
        roundRect(b.x, b.y, b.w, b.h, 10); ctx.fill();
        ctx.strokeStyle = on ? "#f3c542" : "rgba(255,255,255,.12)";
        ctx.lineWidth = on ? 3 : 1.5;
        roundRect(b.x, b.y, b.w, b.h, 10); ctx.stroke();
        ctx.fillStyle = on ? "#ffffff" : "rgba(255,255,255,.6)";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText(DIFFS[i].name, b.x + b.w / 2, b.y + 34);
      }
    }
    ctx.textAlign = "left";
  }

  // 상대 선수의 10구를 능력치로 시뮬레이션 (간단 모델)
  function simulateRival() {
    const p = PLAYERS[rivalKey];
    let pts = 0;
    for (let i = 0; i < TOTAL_SHOTS; i++) {
      const r = Math.random();
      if (r < 0.15) { if (Math.random() * 100 < p.dunk) pts += 2; }
      else if (r < 0.60) { if (Math.random() * 100 < p.two_pt * 0.75) pts += 2; }
      else { if (Math.random() * 100 < p.three_pt * 0.70) pts += 3; }
    }
    return pts;
  }

  // 연출 갱신
  function tickFx() {
    if (fx.shake > 0) fx.shake--;
    if (fx.flash > 0) fx.flash--;

    if (ball.live) {
      const b = ballPos();
      fx.trail.push({ x: b.x, y: b.y, z: b.z });
      if (fx.trail.length > 14) fx.trail.shift();
    } else if (fx.trail.length) fx.trail.shift();

    for (let i = fx.pops.length - 1; i >= 0; i--) {
      const p = fx.pops[i]; p.t++; p.y += 0.022;
      if (p.t > p.life) fx.pops.splice(i, 1);
    }
    for (let i = fx.sparks.length - 1; i >= 0; i--) {
      const s = fx.sparks[i];
      s.t++; s.x += s.vx; s.z += s.vz; s.y += s.vy; s.vy -= 0.0035;
      if (s.t > s.life || s.y < 0.1) fx.sparks.splice(i, 1);
    }
  }

  function drawFx() {
    // 불꽃
    for (const s of fx.sparks) {
      const q = proj(s.x, s.y, s.z);
      const a = 1 - s.t / s.life;
      ctx.fillStyle = s.color.replace("#", "rgba(").length ? s.color : s.color;
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(1, q.s * 0.035 * a), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // 득점 숫자
    for (const p of fx.pops) {
      const q = proj(p.x, p.y, p.z);
      const a = 1 - p.t / p.life;
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = p.color;
      ctx.font = "bold " + Math.round(26 + 22 * (1 - a)) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(p.text, q.x, q.y);
      ctx.textAlign = "left";
      ctx.globalAlpha = 1;
    }
  }

  function tickTimers() {
    tickFx();
    if (messageTimer > 0) messageTimer--;
    if (rimFlash > 0) rimFlash--;
    if (charging) {
      power += powerDir * CHARGE_RATE;
      if (power >= 100) { power = 100; powerDir = -1; }
      if (power <= 0) { power = 0; powerDir = 1; }
    }

    // 슛 준비/릴리스 때만 팔을 든다
    const wantUp = (charging || (ball.live && !shotIsDunk && shotTimer < 25)) ? 1 : 0;
    armsUp += (wantUp - armsUp) * 0.3;

    // 머리 방향: 움직이면 가는 쪽, 아니면 골대 쪽
    {
      let tx, tz;
      const shooting = charging || dunk.active || (ball.live && shooter === "me");
      if (vsMode && possession === "cpu" && !vsOver) {
        tx = cpu.x - player.x; tz = cpu.z - player.z;      // 수비 — 공 잡은 쪽을 본다
      } else if (moving && !shooting) { tx = moveDirX; tz = moveDirZ; }
      else { tx = 0 - player.x; tz = HOOP_Z - player.z; }
      const n = Math.hypot(tx, tz) || 1;
      headYaw = easeAngle(headYaw, Math.atan2(tx / n, tz / n), 0.16);
      bodyYaw = easeAngle(bodyYaw, headYaw, 0.11);   // 몸은 고개를 조금 늦게 따라온다
    }

    // 달리기 — 발이 땅에 붙어 보이도록 속도에 맞춰 걸음 주기를 정한다
    const myRate = 1 / (RUN_CYCLE * FPS) * (me().speed / 100);
    if (moving) runPhase = (runPhase + myRate) % 1;
    runAmt += ((moving ? 1 : 0) - runAmt) * (moving ? 0.18 : 0.30);
    leanX += ((moving ? moveDirX : 0) - leanX) * 0.15;
    if (!moving && runAmt < 0.05) { runAmt = 0; runPhase = 0; }   // 서면 바로 멈춘다
    if (shotJumpT > 0) shotJumpT--;

    // CPU 도 같은 방식
    if (vsMode) {
      const cRate = 1 / (RUN_CYCLE * FPS) * (foe().speed / 100);
      if (cpu.moving) cpu.runPhase = (cpu.runPhase + cRate) % 1;
      cpu.runAmt += ((cpu.moving ? 1 : 0) - cpu.runAmt) * (cpu.moving ? 0.18 : 0.30);
      cpu.leanX += ((cpu.moving ? cpu.dirX : 0) - cpu.leanX) * 0.15;
      if (!cpu.moving && cpu.runAmt < 0.05) { cpu.runAmt = 0; cpu.runPhase = 0; }
      if (cpu.shotJumpT > 0) cpu.shotJumpT--;

      let ctx_, ctz;
      if (possession === "me" && !vsOver) {
        ctx_ = player.x - cpu.x; ctz = player.z - cpu.z;   // 수비 — 나를 본다
      } else if (cpu.moving && cpu.state === "drive") {
        ctx_ = cpu.dirX; ctz = cpu.dirZ || 0;
      } else { ctx_ = 0 - cpu.x; ctz = HOOP_Z - cpu.z; }
      const cn = Math.hypot(ctx_, ctz) || 1;
      cpu.headYaw = easeAngle(cpu.headYaw, Math.atan2(ctx_ / cn, ctz / cn), 0.16);
      cpu.bodyYaw = easeAngle(cpu.bodyYaw, cpu.headYaw, 0.11);
    }

    // 드리블: 움직이기 시작하면 튀고, 멈추면 그 한 번을 마치고 손에 잡힌다
    if (moving) dribbling = true;
    if (dribbling && !charging && !ball.live && !dunk.active) {
      dribPhase += 1 / DRIB_PERIOD;
      if (dribPhase >= 1) { dribPhase = 0; if (!moving) dribbling = false; }
    } else if (!moving) {
      dribbling = false; dribPhase = 0;
    }
  }

  // CPU 가 공을 들고 있을 때의 위치
  function cpuHeldBallPos() {
    const bx = cpu.x + 0.34 * (cpu.dribSide || 1);
    const bz = cpu.z - 0.05;
    const driving = cpu.state === "drive";
    const by = driving
      ? BALL_R + (DRIB_HAND_H - BALL_R) * Math.abs(Math.cos(Math.PI * cpu.dribPhase))
      : DRIB_HAND_H;
    return { x: bx, y: by, z: bz };
  }

  // 손에 들고 있을 때(드리블 포함) 공의 3D 위치
  function heldBallPos() {
    const bx = player.x + 0.34 * dribSide;
    const bz = player.z - 0.05;
    const by = dribbling
      ? BALL_R + (DRIB_HAND_H - BALL_R) * Math.abs(Math.cos(Math.PI * dribPhase))
      : DRIB_HAND_H;
    const u = armsUp;                      // 슛 준비하면 머리 위로 올라간다
    return {
      x: bx + (player.x - bx) * u,
      y: by + (RELEASE_H - by) * u,
      z: bz + ((player.z - 0.15) - bz) * u
    };
  }

  // ---- 터치 조작 UI ----
  function drawTouchUI() {
    if (!touchUI) return;

    // 왼쪽 조이스틱
    const base = joy.active ? { x: joy.ox, y: joy.oy } : joyHome();
    ctx.strokeStyle = "rgba(255,255,255,.22)";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(base.x, base.y, JOY_MAX, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.07)";
    ctx.fill();

    const kx = base.x + joy.x * JOY_MAX, ky = base.y + joy.z * JOY_MAX;
    ctx.fillStyle = joy.active ? "rgba(255,255,255,.55)" : "rgba(255,255,255,.3)";
    ctx.beginPath(); ctx.arc(kx, ky, 44, 0, Math.PI * 2); ctx.fill();

    if (!joy.active) {
      ctx.fillStyle = "rgba(255,255,255,.4)";
      ctx.font = "16px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("이동", base.x, base.y + JOY_MAX + 28);
      ctx.textAlign = "left";
    }

    // 오른쪽 슛 / 덩크 버튼
    const s = shootHome();
    const dunkMode = inDunkRange();
    const held = shootId !== null;
    ctx.fillStyle = dunkMode ? "rgba(243,197,66,.26)" : "rgba(74,222,128,.22)";
    if (held) ctx.fillStyle = dunkMode ? "rgba(243,197,66,.5)" : "rgba(74,222,128,.45)";
    ctx.beginPath(); ctx.arc(s.x, s.y, 92, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = dunkMode ? "rgba(243,197,66,.8)" : "rgba(74,222,128,.7)";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(s.x, s.y, 92, 0, Math.PI * 2); ctx.stroke();

    const defMode = vsMode && possession === "cpu" && !vsOver;
    ctx.fillStyle = "#e9ecf1";
    ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(defMode ? "블락" : (dunkMode ? "덩크" : "슛"), s.x, s.y + 9);

    // 수비 중에만 뜨는 스틸 버튼
    if (defMode) {
      const sb = stealHome();
      const hot = defense.stealT > 0;
      ctx.fillStyle = hot ? "rgba(96,165,250,.5)" : "rgba(96,165,250,.22)";
      ctx.beginPath(); ctx.arc(sb.x, sb.y, 66, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(96,165,250,.8)"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(sb.x, sb.y, 66, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "#e9ecf1"; ctx.font = "bold 21px sans-serif";
      ctx.fillText("스틸", sb.x, sb.y + 8);
    }
    ctx.textAlign = "left";
  }

  function drawRotateNotice() {
    if (!touchUI || window.innerHeight <= window.innerWidth) return;
    ctx.fillStyle = "rgba(8,10,14,.93)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#e9ecf1";
    ctx.font = "bold 44px sans-serif";
    ctx.fillText("📱  가로로 돌려주세요", W / 2, H / 2 - 10);
    ctx.fillStyle = "rgba(255,255,255,.6)";
    ctx.font = "22px sans-serif";
    ctx.fillText("가로 화면에서 플레이할 수 있습니다", W / 2, H / 2 + 40);
    ctx.textAlign = "left";
  }

  function draw() {
    if (scene === "mode") { drawMode(); drawRotateNotice(); return; }
    if (scene === "select") { drawSelect(); drawRotateNotice(); return; }

    // 덩크 임팩트 — 화면 흔들림
    ctx.save();
    if (fx.shake > 0) {
      const k = fx.shake / 16;
      ctx.translate((Math.random() - 0.5) * 16 * k, (Math.random() - 0.5) * 12 * k);
    }
    drawCourt();

    // 먼 선수부터 그린다 (z 가 작을수록 멀다)
    const myState = {
      x: dunk.active ? dunk.x : player.x, z: dunk.active ? dunk.z : player.z,
      lift: (dunk.active ? dunk.lift : 0) + (vsMode ? defense.blockLift : 0)
            + shotLift(shotJumpT),
      hang: dunk.active ? dunk.hang : 0, dunkMode: dunk.active,
      armsUp: Math.max(armsUp, vsMode && defense.blockT > 0 ? 1 : 0),
      dribbling: dribbling, dribPhase: dribPhase, dribSide: dribSide, data: me(),
      runAmt: runAmt, runPhase: runPhase, leanX: leanX,
      headYaw: headYaw, bodyYaw: bodyYaw
    };
    const figs = vsMode ? [myState, cpuState()] : [myState];
    figs.sort((a, b) => a.z - b.z);

    let drewHoop = false;
    for (const f of figs) {
      if (!drewHoop && f.z >= HOOP_Z) { drawHoop(); drewHoop = true; }
      drawPlayer(f);
    }
    if (!drewHoop) drawHoop();

    drawBall();
    drawFx();
    ctx.restore();

    // 득점 순간 화면이 살짝 번쩍
    if (fx.flash > 0) {
      ctx.fillStyle = "rgba(255,255,255," + (0.10 * fx.flash / 12) + ")";
      ctx.fillRect(0, 0, W, PANEL_Y);
    }

    ctx.fillStyle = "#0f1115";
    ctx.fillRect(0, PANEL_Y, W, H - PANEL_Y);
    drawGauge();
    drawHUD();
    drawTouchUI();
    if (gameOver) drawGameOver();
    drawRotateNotice();
  }

  let acc = 0, last = 0;
  function loop(now) {
    if (!last) last = now;
    acc += Math.min(now - last, 200);
    last = now;
    while (acc >= STEP_MS) { if (scene === "play") { step(); tickTimers(); } acc -= STEP_MS; }
    draw();
    requestAnimationFrame(loop);
  }

  fitCanvas();
  newBall();
  refreshBand();
  requestAnimationFrame(loop);
})();
</script>
</body>
