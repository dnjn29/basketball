<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>농구 슛 게임</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; height: 100dvh;
    background: #0f1115;
    color: #e9ecf1;
    font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  /* 모바일 브라우저 툴바 뒤로 숨지 않도록 보이는 영역에 고정 */
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: #11141a;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    touch-action: none;
    max-width: 100%; max-height: 100%;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1200" height="750"></canvas></div>
<script>
(function () {
  "use strict";

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W = canvas.width;
  const H = canvas.height;              // 세로는 고정 — 코트 투시가 이 값에 맞춰져 있다

  // ===== 코트 (FIBA 하프코트, 단위 m) =====
  // x: 좌우(0 = 중앙),  z: 베이스라인에서의 거리,  y: 높이
  const COURT_W = 15, COURT_L = 10;      // 3점 라인이 모두 들어오는 득점 지역
  const HOOP_Z = 1.575, RIM_H = 3.05, RIM_R = 0.225, TUBE_R = 0.02;
  const BOARD_Z = 1.2, BOARD_W = 1.8, BOARD_BOT = 2.9, BOARD_TOP = 3.95;
  const SQ_W = 0.59, SQ_H = 0.45;
  const THREE_R = 6.75, CORNER_X = 6.6;
  const KEY_W = 4.9, FT_Z = 5.8, FT_R = 1.8, RESTRICT_R = 1.25;
  const BALL_R = 0.1195;

  // ===== 선수 데이터 =====
  // three_pt / two_pt / dunk / speed 는 0~100
  const PLAYERS = {
    jordan: { name: "마이클 조던",      number: 23, three_pt: 75,  two_pt: 97, dunk: 95, speed: 95,
              power: 80, jump: 98, block: 75, steal: 95,
              height: 1.98, build: 0.98, headband: false, goggles: false,
              skin: "#8a5a3b", hairStyle: "bald",   facial: "mustache", mood: "calm",
              uniform: "#c8102e", hair: null,      bald: true,  shoe: "#15161a", shoeAccent: "#e03131" },
    lebron: { name: "르브론 제임스",    number: 23, three_pt: 80,  two_pt: 95, dunk: 97, speed: 90,
              power: 98, jump: 92, block: 85, steal: 80,
              height: 2.06, build: 1.18, headband: true,  goggles: false,
              skin: "#7a4e32", hairStyle: "fade",   facial: "beard",    mood: "intense",
              uniform: "#552583", hair: "#1a1a1a", bald: false, shoe: "#552583", shoeAccent: "#fdb927" },
    kobe:   { name: "코비 브라이언트",  number: 24, three_pt: 82,  two_pt: 96, dunk: 90, speed: 88,
              power: 78, jump: 90, block: 60, steal: 88,
              height: 1.98, build: 1.00, headband: false, goggles: false,
              skin: "#8f5f3e", hairStyle: "short",  facial: "goatee",   mood: "intense",
              uniform: "#f3c542", hair: "#1a1a1a", bald: false, shoe: "#15161a", shoeAccent: "#8a4fd0" },
    curry:  { name: "스테픈 커리",      number: 30, three_pt: 100, two_pt: 85, dunk: 55, speed: 85,
              power: 55, jump: 65, block: 30, steal: 82,
              height: 1.88, build: 0.82, headband: false, goggles: false,
              skin: "#a9734a", hairStyle: "short",  facial: "none",     mood: "smile",
              uniform: "#1d428a", hair: "#6b4423", bald: false, shoe: "#2b63c9", shoeAccent: "#ffd93d" },
    magic:  { name: "매직 존슨",        number: 32, three_pt: 60,  two_pt: 88, dunk: 70, speed: 80,
              power: 85, jump: 75, block: 55, steal: 85,
              height: 2.06, build: 1.10, headband: false, goggles: false,
              skin: "#7e5236", hairStyle: "curly",  facial: "none",     mood: "smile",
              uniform: "#ffd93d", hair: "#1a1a1a", bald: false, shoe: "#f2f4f8", shoeAccent: "#8a4fd0" },
    bird:   { name: "래리 버드",        number: 33, three_pt: 92,  two_pt: 94, dunk: 50, speed: 65,
              power: 80, jump: 60, block: 60, steal: 85,
              height: 2.06, build: 1.02, headband: false, goggles: false,
              skin: "#e8bf97", hairStyle: "shaggy", facial: "mustache", mood: "calm",
              uniform: "#007a33", hair: "#d9b45b", bald: false, shoe: "#f2f4f8", shoeAccent: "#2aa84a" },
    kareem: { name: "카림 압둘-자바",   number: 33, three_pt: 20,  two_pt: 98, dunk: 88, speed: 55,
              power: 92, jump: 85, block: 98, steal: 45,
              height: 2.18, build: 1.02, headband: false, goggles: true,
              skin: "#6f4529", hairStyle: "bald",   facial: "goatee",   mood: "calm",
              uniform: "#552583", hair: null,      bald: true,  shoe: "#f2f4f8", shoeAccent: "#15161a" }
  };
  const PLAYER_KEYS = ["jordan", "lebron", "kobe", "curry", "magic", "bird", "kareem"];

  let scene = "mode";                   // "mode" → "select" → "play"
  let myKey = "jordan", rivalKey = "lebron";
  let pick = 0;                         // 선수 선택 커서
  let rivalScore = 0;
  const me = () => PLAYERS[myKey];
  const foe = () => PLAYERS[rivalKey];

  // ===== 대결 모드 =====
  let vsMode = false;                   // false = 혼자 10구 연습
  let modePick = 0;                     // 0 연습 / 1 대결
  let diffPick = 1;                     // 0 쉬움 / 1 보통 / 2 어려움
  const DIFFS = [
    { name: "쉬움",   aim: 0.62, react: 0.55, aggr: 0.45, spd: 0.80 },
    { name: "보통",   aim: 0.80, react: 0.78, aggr: 0.70, spd: 0.92 },
    { name: "어려움", aim: 0.97, react: 1.00, aggr: 1.00, spd: 1.00 }
  ];
  const diff = () => DIFFS[diffPick];

  const TARGET_SCORE = 21;              // 21점 선취
  let myScore = 0, cpuScore = 0;
  let possession = "me";                // "me" | "cpu"
  let vsOver = false, vsWinner = null;

  // CPU 선수
  const cpu = { x: 0, z: 4.0, lift: 0, hang: 0, dribPhase: 0, dribSide: 1,
                armsUp: 0, state: "idle", timer: 0, targetX: 0, targetZ: 6.5,
                dunking: false, shotWillMake: false,
                moving: false, runPhase: 0, runAmt: 0, dirX: 0, dirZ: 0, leanX: 0,
                headYaw: Math.PI, bodyYaw: Math.PI, shotJumpT: 0 };

  // 수비 액션
  const defense = { blockT: 0, stealT: 0, blockLift: 0 };
  let vsMsg = "", vsMsgTimer = 0, vsMsgColor = "#e9ecf1";

  // ===== 연출 =====
  const fx = { trail: [], pops: [], sparks: [], shake: 0, flash: 0 };

  // 관중 (한 번만 생성 — 매 프레임 흔들리지 않게)
  const crowd = [];
  (function () {
    let seed = 20261027;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    for (let i = 0; i < 1100; i++) crowd.push({ u: rnd(), v: rnd(), c: rnd(), s: 0.6 + rnd() * 0.8 });
  })();
  const CROWD_COLORS = ["#2f3646", "#3b4252", "#454d60", "#2a3140", "#51596b",
                        "#6b4a3a", "#4a5a6b", "#5c4a6b"];

  function spawnPop(text, color, x, z, y) {
    fx.pops.push({ text: text, color: color, x: x, z: z, y: y || RIM_H, t: 0, life: 70 });
  }
  function spawnSparks(n, color) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 0.02 + Math.random() * 0.06;
      fx.sparks.push({ x: 0 + Math.cos(a) * 0.1, z: HOOP_Z + Math.sin(a) * 0.1,
                       y: RIM_H - 0.1, vx: Math.cos(a) * sp, vz: Math.sin(a) * sp,
                       vy: 0.02 + Math.random() * 0.05, t: 0, life: 40 + Math.random() * 25,
                       color: color });
    }
  }
  function say(t, c, f) { vsMsg = t; vsMsgColor = c || "#e9ecf1"; vsMsgTimer = f || 90; }

  // ===== 카메라 (하프코트 전체가 들어오는 방송 중계 앵글) =====
  // 베이스라인(z=0)이 화면 y=250·반폭 330px, 코트 앞단(z=10)이 y=600·반폭 580px 이 되도록 역산
  const CAM_Z = 23.2, CAM_Y = 10.5, FOCAL = 1020.8, HORIZON = -212;
  let CX = W / 2;
  const PANEL_Y = 655;

  // 실제로 보이는 영역(주소창·하단바 제외)에 맞춰 캔버스를 맞춘다
  function fitCanvas() {
    const vv = window.visualViewport;
    const vw = Math.round((vv ? vv.width : window.innerWidth) || 0) || W;
    const vh = Math.round((vv ? vv.height : window.innerHeight) || 0) || H;

    W = Math.round(Math.max(1200, Math.min(1900, H * (vw / vh))));
    canvas.width = W;
    canvas.height = H;
    CX = W / 2;

    // 정렬 박스를 "보이는 영역"에 그대로 맞춘다 (툴바 뒤로 밀려나지 않게)
    const wrap = document.getElementById("wrap");
    if (wrap) {
      wrap.style.left = Math.round(vv ? vv.offsetLeft : 0) + "px";
      wrap.style.top = Math.round(vv ? vv.offsetTop : 0) + "px";
      wrap.style.width = vw + "px";
      wrap.style.height = vh + "px";
    }

    // 표시 크기를 직접 계산 — 어느 쪽도 잘리지 않게
    const scale = Math.min(vw / W, vh / H);
    canvas.style.width = Math.floor(W * scale) + "px";
    canvas.style.height = Math.floor(H * scale) + "px";
  }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", () => setTimeout(fitCanvas, 150));
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fitCanvas);
    window.visualViewport.addEventListener("scroll", fitCanvas);
  }

  function proj(x, y, z) {
    const s = FOCAL / (CAM_Z - z);
    return { x: CX + s * x, y: HORIZON + s * (CAM_Y - y), s: s };
  }

  // ===== 선수 =====
  const RELEASE_H = 2.5;                 // 점프슛 릴리스 높이
  const REACH = 2.30;                    // 스탠딩 리치
  const PLAYER_MIN_X = -7, PLAYER_MAX_X = 7;
  const PLAYER_MIN_Z = 0.5, PLAYER_MAX_Z = 9.5;
  const BASE_MOVE_SPEED = 4.2 / 60;      // speed 100 기준 초당 4.2m
  // speed 100 = 기본 속도, 50 = 그 절반
  const moveSpeed = () => BASE_MOVE_SPEED * (me().speed / 100);
  const DUNK_RANGE = 1.7;
  const DUNK_SPOT = { x: 0, z: HOOP_Z + RIM_R };   // 림 앞쪽 가장자리 바로 아래
  const GRAB_H = RIM_H - REACH;          // 림을 잡으려면 필요한 점프 높이

  // ===== 물리 =====
  const FPS = 60, STEP_MS = 1000 / FPS;
  const G = 9.8 / (FPS * FPS);           // m/frame²
  const AIR = 0.999;
  const BOUNCE = 0.55, RIM_BOUNCE = 0.62;
  const SHOT_ANGLE = 54 * Math.PI / 180;
  const TOTAL_SHOTS = 10;
  const SHOT_TIMEOUT = FPS * 7;

  // ===== 게이지 =====
  const CHARGE_RATE = 170 / FPS;         // 초당 170% — 짧게 눌러도 찬다
  const BAND_CENTER = 0.55;              // 성공 구간 중심이 놓일 게이지 위치
  const SPEED_LO = 0.05, SPEED_HI = 0.36; // 탐색 범위 (m/frame)

  // 성공 구간 폭 = 거리(멀수록 좁음) × 능력치(높을수록 넓음)
  // 3점 라인 밖이면 three_pt, 안이면 two_pt 를 쓴다
  function bandFrac(d, three) {
    const base = Math.max(0.17, Math.min(0.34, 0.34 - 0.014 * d));
    const stat = three ? me().three_pt : me().two_pt;
    return Math.max(0.09, Math.min(0.45, base * (0.40 + 0.009 * stat)));
  }

  const RISE_F = 22, DROP_F = 26, HANG_MAX = 150, HANG_AFTER_SCORE = 26;

  // ===== 상태 =====
  const player = { x: 0, z: FT_Z };
  // 공은 "슛 라인 위의 부호 있는 거리 p" + 높이 y 로 움직인다 (방향은 항상 림)
  const ball = { p: 0, y: 0, vp: 0, vy: 0, dx: 0, dz: 1, rot: 0, live: false, scored: false };

  let shots = 0, score = 0, makes = 0;
  let shotValue = 2, shotIsDunk = false;
  let message = "", messageColor = "#ff7a7a", messageTimer = 0;
  let rimFlash = 0, settleTimer = 0, shotTimer = 0;
  let gameOver = false;

  let charging = false, power = 0, powerDir = 1, lastPower = null;
  const keys = { L: false, R: false, U: false, D: false };

  // 드리블 / 팔 자세
  const DRIB_PERIOD = 26;                // 한 번 튀는 데 걸리는 프레임
  const DRIB_HAND_H = 0.95;              // 드리블하는 손 높이
  let armsUp = 0;                        // 0 = 팔 내림, 1 = 슛 자세
  let dribPhase = 0, dribSide = 1, dribbling = false, moving = false;

  // 달리기
  const RUN_CYCLE = 0.52;                // 한 걸음 주기(초)
  let runPhase = 0, runAmt = 0, moveDirX = 0, moveDirZ = 0, leanX = 0;
  // 점프슛 — 쏠 때 살짝 떠오른다
  const SHOT_JUMP_F = 34, SHOT_JUMP_H = 0.30;
  let shotJumpT = 0;
  const shotLift = (tt) => tt > 0 ? SHOT_JUMP_H * Math.sin(Math.PI * (1 - tt / SHOT_JUMP_F)) : 0;
  // 머리가 바라보는 방향 (0 = 카메라 정면, ±π = 골대 쪽 뒤통수)
  let headYaw = Math.PI, bodyYaw = Math.PI;

  function easeAngle(cur, tgt, k) {
    let d = tgt - cur;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return cur + d * k;
  }

  const dunk = { active: false, phase: "rise", t: 0, fromX: 0, fromZ: 0,
                 x: 0, z: 0, lift: 0, dropFrom: 0, hang: 0, released: false, afterScore: 0 };

  const hoopDist = (x, z) => Math.hypot(x - 0, z - HOOP_Z);
  const distToRim = () => hoopDist(player.x, player.z);
  const inDunkRange = () => distToRim() < DUNK_RANGE;
  // 코너는 직선(6.6m), 그 위는 아크(6.75m) — 코트에 그려진 선과 같은 판정
  // 백보드를 맞힐 수 있는 각도 (골대 정면 기준 ±45°)
  const BOARD_COS = 0.70;
  function boardReachable(sx, sz) {
    const d = Math.hypot(sx, sz - HOOP_Z) || 1;
    return (sz - HOOP_Z) / d >= BOARD_COS;
  }

  const CORNER_Z = HOOP_Z + THREE_R * Math.cos(Math.asin(CORNER_X / THREE_R));
  const isThreeAt = (x, z) => z <= CORNER_Z
    ? Math.abs(x) >= CORNER_X
    : hoopDist(x, z) >= THREE_R;
  const isThree = () => isThreeAt(player.x, player.z);

  // ===== 물리: 슛 평면 (p, y) 에서 한 스텝 =====
  function advance(o) {
    const prevY = o.y, prevP = o.p;

    o.vy -= G;
    o.vp *= AIR; o.vy *= AIR;
    o.p += o.vp;
    o.y += o.vy;
    o.rot += 0.06;

    // 득점: 림 높이를 위에서 아래로 통과 + 림 안쪽
    if (!o.scored && o.vy < 0 && prevY >= RIM_H && o.y < RIM_H && Math.abs(o.p) < RIM_R) {
      o.scored = true;
    }

    // 림 링과의 충돌 (링까지의 최단거리로 판정)
    const sgn = o.p >= 0 ? 1 : -1;
    const dh = Math.abs(o.p) - RIM_R, dy = o.y - RIM_H;
    const len = Math.hypot(dh, dy), min = BALL_R + TUBE_R;
    if (len > 0 && len < min) {
      const np = sgn * dh / len, ny = dy / len;
      o.p = sgn * RIM_R + np * min;
      o.y = RIM_H + ny * min;
      const dot = o.vp * np + o.vy * ny;
      o.vp = (o.vp - 2 * dot * np) * RIM_BOUNCE;
      o.vy = (o.vy - 2 * dot * ny) * RIM_BOUNCE;
    }

    // 백보드 앞면 (림 중심에서 뒤로 0.375m).
    // 정면에서 들어온 슛만 맞는다 — 옆에서 쏘면 보드가 비스듬해 맞지 않는다
    const boardP = -(HOOP_Z - BOARD_Z);
    if (o.boardOn !== false && o.y > BOARD_BOT && o.y < BOARD_TOP &&
        o.p - BALL_R <= boardP && prevP - BALL_R > boardP) {
      o.p = boardP + BALL_R;
      o.vp = Math.abs(o.vp) * BOUNCE;
    }

    // 바닥
    if (o.y - BALL_R < 0) {
      o.y = BALL_R;
      o.vy = -o.vy * BOUNCE;
      o.vp *= 0.82;
      if (Math.abs(o.vy) < 0.02) o.vy = 0;
    }
  }

  // ===== 성공 강도 구간 탐색 =====
  function simulate(speed, D, boardOn) {
    const o = { p: D, y: RELEASE_H, vp: -Math.cos(SHOT_ANGLE) * speed,
                vy: Math.sin(SHOT_ANGLE) * speed, rot: 0, scored: false,
                boardOn: boardOn !== false };
    for (let f = 0; f < 300; f++) {
      advance(o);
      if (o.scored) return true;
      if (o.y - BALL_R <= 0.001) return false;
    }
    return false;
  }

  function findBand(D, boardOn) {
    const STEP = 0.0015;
    let best = null, cur = null;
    for (let sp = SPEED_LO; sp <= SPEED_HI; sp += STEP) {
      if (simulate(sp, D, boardOn)) {
        if (cur) cur.hi = sp; else cur = { lo: sp, hi: sp };
      } else if (cur) {
        if (!best || cur.hi - cur.lo > best.hi - best.lo) best = cur;
        cur = null;
      }
    }
    if (cur && (!best || cur.hi - cur.lo > best.hi - best.lo)) best = cur;
    return best;
  }

  // 게이지는 매 위치마다 성공 구간이 정해진 자리에 오도록 자동 보정된다
  let gauge = { lo: 0.1, hi: 0.3, bandLo: 45, bandHi: 65 };
  let bandDirty = true;

  function refreshBand() {
    bandDirty = false;
    if (inDunkRange()) { gauge = null; return; }
    const D = distToRim();
    const b = findBand(D, boardReachable(player.x, player.z));
    if (!b) { gauge = null; return; }
    const frac = bandFrac(D, isThree());
    const mid = (b.lo + b.hi) / 2;
    const span = (b.hi - b.lo) / frac;
    const lo = mid - span * BAND_CENTER;
    gauge = {
      lo: lo, hi: lo + span,
      bandLo: (b.lo - lo) / span * 100,
      bandHi: (b.hi - lo) / span * 100
    };
  }

  const speedOf = (p) => gauge.lo + (gauge.hi - gauge.lo) * (p / 100);

  // ===== 입력 =====
  function keyOf(e) {
    const c = e.code, k = (e.key || "").toLowerCase();
    if (c === "ArrowLeft" || k === "a") return "L";
    if (c === "ArrowRight" || k === "d") return "R";
    if (c === "ArrowUp" || k === "w") return "U";
    if (c === "ArrowDown" || k === "s") return "D";
    return null;
  }
  const isSpace = (e) => e.code === "Space" || e.key === " ";
  const busy = () => ball.live || charging || dunk.active;

  // 키보드와 터치가 같은 함수를 쓴다
  function pressShoot() {
    if (gameOver) { scene = "mode"; return; }     // 끝나면 처음 화면으로
    // 대결 모드 수비 중이면 블락 점프 (판정은 CPU 가 슛하는 순간)
    if (vsMode && possession === "cpu" && checkT <= 0) { pressBlock(); return; }
    if (vsMode && (checkT > 0 || possession !== "me")) return;
    if (busy()) return;
    if (inDunkRange()) { launch(null); return; }   // 덩크는 누르는 즉시
    if (!gauge) return;
    charging = true; power = 0; powerDir = 1;
  }
  // 스틸 시도 (수비 중에만)
  // 블락 점프 (수비 중에만)
  function pressBlock() {
    if (!vsMode || possession !== "cpu" || checkT > 0 || vsOver) return;
    if (defense.blockT > 0) return;
    defense.blockT = 24;
  }

  function pressSteal() {
    if (!vsMode || possession !== "cpu" || checkT > 0 || vsOver) return;
    if (defense.stealT > 0) return;               // 연타 방지
    defense.stealT = 26;
  }

  function releaseShoot() {
    if (!charging) return;
    charging = false;
    if (power < 4) return;
    launch(power);
  }

  window.addEventListener("keydown", (e) => {
    // 모드 / 난이도 화면
    if (scene === "mode") {
      const mk = keyOf(e);
      if (mk === "L" || mk === "R") {
        e.preventDefault();
        if (modePick === 1) diffPick = Math.max(0, Math.min(2, diffPick + (mk === "R" ? 1 : -1)));
        return;
      }
      if (mk === "U") { e.preventDefault(); modePick = 0; return; }
      if (mk === "D") { e.preventDefault(); modePick = 1; return; }
      if (isSpace(e) || e.key === "Enter") {
        e.preventDefault(); vsMode = modePick === 1; scene = "select";
      }
      return;
    }
    // 경기 중 단축키
    if (scene === "play") {
      if (e.code === "Escape" || e.key === "Escape") { e.preventDefault(); goMenu(); return; }
      if (e.code === "KeyR" || e.key === "r" || e.key === "R") { e.preventDefault(); restartGame(); return; }
      if (e.code === "KeyX" || e.key === "x" || e.key === "X" ||
          e.key === "Shift" || e.code === "ShiftLeft" || e.code === "ShiftRight") {
        e.preventDefault(); pressSteal(); return;        // 스틸 = X (Shift 도 됨)
      }
      if (e.code === "KeyZ" || e.key === "z" || e.key === "Z") {
        e.preventDefault(); pressBlock(); return;        // 블럭 = Z
      }
    }
    // 선수 선택 화면
    if (scene === "select") {
      const mk = keyOf(e);
      if (mk === "L") { e.preventDefault(); pick = (pick + PLAYER_KEYS.length - 1) % PLAYER_KEYS.length; return; }
      if (mk === "R") { e.preventDefault(); pick = (pick + 1) % PLAYER_KEYS.length; return; }
      if (isSpace(e) || e.key === "Enter") { e.preventDefault(); confirmPick(); }
      return;
    }
    const mk = keyOf(e);
    if (mk) { e.preventDefault(); if (!busy() && !gameOver) keys[mk] = true; return; }
    if (!isSpace(e)) return;
    e.preventDefault();
    if (e.repeat) return;
    pressShoot();
  });

  window.addEventListener("keyup", (e) => {
    const mk = keyOf(e);
    if (mk) { keys[mk] = false; return; }
    if (!isSpace(e)) return;
    e.preventDefault();
    releaseShoot();
  });

  // ===== 터치 조작 (왼쪽 조이스틱 / 오른쪽 슛 버튼) =====
  // 터치 기기면 누르기 전부터 조작 UI를 보여준다
  let touchUI = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
  const JOY_MAX = 110;
  const joy = { id: null, ox: 0, oy: 0, x: 0, z: 0, active: false };
  let shootId = null;

  const joyHome = () => ({ x: 185, y: H - 120 });
  const shootHome = () => ({ x: W - 175, y: H - 120 });
  const stealHome = () => ({ x: W - 330, y: H - 150 });

  // 경기 중 메뉴 / 다시 시작 버튼 (아래 패널 왼쪽)
  const menuBtn = () => ({ x: 26, y: PANEL_Y + 20, w: 92, h: 38 });
  const restartBtn = () => ({ x: 126, y: PANEL_Y + 20, w: 92, h: 38 });
  const inBox = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;

  function goMenu() {
    charging = false; power = 0;
    ball.live = false; dunk.active = false; cpu.dunking = false;
    joy.id = null; joy.active = false; joy.x = 0; joy.z = 0; shootId = null;
    scene = "mode";
  }
  function restartGame() {
    charging = false; power = 0;
    joy.id = null; joy.active = false; joy.x = 0; joy.z = 0; shootId = null;
    if (vsMode) { gameOver = false; vsReset(true); }
    else reset();
  }

  function canvasPt(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width),
             y: (e.clientY - r.top) * (H / r.height) };
  }

  canvas.addEventListener("pointerdown", (e) => {
    touchUI = true;            // 한 번이라도 화면을 누르면 조작 UI를 띄운다
    e.preventDefault();
    const p = canvasPt(e);

    // 모드 화면
    if (scene === "mode") {
      for (let i = 0; i < 2; i++) {
        const b = modeBox(i);
        if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
          if (modePick === i) { vsMode = i === 1; scene = "select"; } else modePick = i;
          return;
        }
      }
      if (modePick === 1) for (let i = 0; i < 3; i++) {
        const b = diffBox(i);
        if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { diffPick = i; return; }
      }
      return;
    }

    // 선수 선택 화면: 카드를 누르면 선택, 고른 카드를 한 번 더 누르면 시작
    if (scene === "select") {
      for (let i = 0; i < PLAYER_KEYS.length; i++) {
        const b = cardBox(i);
        if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
          if (pick === i) confirmPick(); else pick = i;
          return;
        }
      }
      return;
    }

    // 메뉴 / 다시 버튼이 가장 우선
    if (inBox(p, menuBtn())) { goMenu(); return; }
    if (inBox(p, restartBtn())) { restartGame(); return; }

    if (gameOver) { scene = "mode"; return; }

    // 수비 중에는 오른쪽 아래 작은 버튼이 스틸
    if (vsMode && possession === "cpu" && !vsOver) {
      const sb = stealHome();
      if (Math.hypot(p.x - sb.x, p.y - sb.y) < 74) { pressSteal(); return; }
    }

    if (p.x > W / 2) {                       // 오른쪽 절반 = 슛 / 블락
      if (shootId === null) { shootId = e.pointerId; pressShoot(); }
    } else if (joy.id === null) {            // 왼쪽 절반 = 이동
      joy.id = e.pointerId; joy.ox = p.x; joy.oy = p.y;
      joy.x = 0; joy.z = 0; joy.active = true;
    }
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
  });

  canvas.addEventListener("pointermove", (e) => {
    if (e.pointerId !== joy.id) return;
    const p = canvasPt(e);
    let dx = p.x - joy.ox, dy = p.y - joy.oy;
    const len = Math.hypot(dx, dy);
    if (len > JOY_MAX) { dx = dx / len * JOY_MAX; dy = dy / len * JOY_MAX; }
    if (len < 16) { dx = 0; dy = 0; }
    joy.x = dx / JOY_MAX;                    // 화면 오른쪽 = +x
    joy.z = dy / JOY_MAX;                    // 화면 아래 = z 증가(림에서 멀어짐)
  });

  function endPointer(e) {
    if (e.pointerId === joy.id) { joy.id = null; joy.active = false; joy.x = 0; joy.z = 0; }
    if (e.pointerId === shootId) { shootId = null; releaseShoot(); }
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  // ===== 발사 =====
  function launch(p) {
    shots++;
    shooter = "me";                        // 대결 모드에서 득점 주체
    shotIsDunk = inDunkRange();
    if (!shotIsDunk) lastPower = p;
    shotValue = shotIsDunk ? 2 : (isThree() ? 3 : 2);

    if (shotIsDunk) {
      dunk.active = true; dunk.phase = "rise"; dunk.t = 0;
      dunk.fromX = player.x; dunk.fromZ = player.z;
      dunk.x = player.x; dunk.z = player.z;
      dunk.lift = 0; dunk.hang = 0; dunk.released = false; dunk.afterScore = 0;
      dunk.success = Math.random() * 100 < me().dunk;   // 덩크 능력치 = 성공 확률
      player.x = DUNK_SPOT.x; player.z = DUNK_SPOT.z;
      bandDirty = true;
      ball.live = false; ball.scored = false;
      settleTimer = 0; shotTimer = 0;
      return;
    }

    // 방향은 항상 림을 향한다 — 플레이어는 강도만 맞추면 된다
    const D = distToRim();
    ball.dx = (player.x - 0) / D;
    ball.dz = (player.z - HOOP_Z) / D;
    ball.p = D;
    ball.y = RELEASE_H;
    const speed = speedOf(p);
    ball.vp = -Math.cos(SHOT_ANGLE) * speed;
    ball.vy = Math.sin(SHOT_ANGLE) * speed;
    ball.rot = 0;
    ball.live = true; ball.scored = false;
    ball.boardOn = boardReachable(player.x, player.z);
    settleTimer = 0; shotTimer = 0;
    shotJumpT = SHOT_JUMP_F;              // 점프슛
  }

  // 덩크 점프 정점 — 점프 스탯이 높을수록 림 위로 더 뜬다.
  // 실패한 덩크는 림에 손이 닿지 않는 높이까지만 뛴다.
  function dunkApex(p, success) {
    if (!success) return GRAB_H * (0.50 + 0.40 * (p.jump / 100));
    return GRAB_H + 0.05 + 0.28 * (p.jump / 100);
  }

  function dunkHand() {       // drawPlayer 의 오른손 위치와 같은 값
    return { x: dunk.x + 0.14, y: REACH + dunk.lift, z: dunk.z };
  }

  function slam() {
    dunk.released = true;
    ball.dx = 0; ball.dz = 1;
    ball.rot = 0; ball.live = true; ball.scored = false;
    ball.boardOn = false;
    settleTimer = 0; shotTimer = 0;

    if (dunk.success) {
      ball.p = 0.06; ball.y = RIM_H + BALL_R + 0.06;
      ball.vp = -0.012; ball.vy = -0.08;
      message = "DUNK!"; messageColor = "#4ade80"; messageTimer = 110;
    } else {
      // 림에 튕겨 나온다
      ball.p = RIM_R + BALL_R * 0.5; ball.y = RIM_H + BALL_R * 1.2;
      ball.vp = 0.028; ball.vy = -0.03;
    }
  }

  function reset() {
    shots = 0; score = 0; makes = 0; gameOver = false;
    message = ""; messageTimer = 0; rimFlash = 0; lastPower = null;
    rivalScore = simulateRival();
    player.x = 0; player.z = FT_Z;
    dunk.active = false; dunk.lift = 0; dunk.hang = 0;
    bandDirty = true;
    newBall();
  }

  function newBall() {
    ball.live = false; ball.scored = false;
    ball.p = 0; ball.y = RELEASE_H; ball.vp = 0; ball.vy = 0; ball.rot = 0;
    settleTimer = 0; shotTimer = 0;
  }

  function endShot() {
    if (vsMode) { vsEndShot(); return; }
    if (ball.scored) {
      makes++; score += shotValue;
    } else if (shotIsDunk) {
      message = "덩크 실패!"; messageColor = "#ff9a5c"; messageTimer = 75;
    } else if (gauge) {
      const mid = (gauge.bandLo + gauge.bandHi) / 2;
      const diff = lastPower - mid;
      message = (Math.abs(diff) < 14 ? "아깝다! 조금 " : "너무 ") + (diff < 0 ? "약해요" : "강해요");
      messageColor = "#ff9a5c"; messageTimer = 75;
    } else {
      message = "MISS"; messageColor = "#ff7a7a"; messageTimer = 70;
    }

    if (shots >= TOTAL_SHOTS) { gameOver = true; ball.live = false; }
    else newBall();
  }

  function stepDunk() {
    dunk.t++;
    if (dunk.phase === "rise") {
      const p = Math.min(1, dunk.t / RISE_F);
      const ease = 1 - Math.pow(1 - p, 2);
      dunk.x = dunk.fromX + (DUNK_SPOT.x - dunk.fromX) * ease;
      dunk.z = dunk.fromZ + (DUNK_SPOT.z - dunk.fromZ) * ease;
      // 점프 스탯이 높을수록 더 높이 뜬다. 실패하면 림에 손이 못 닿는다
      dunk.lift = dunkApex(me(), dunk.success) * Math.sin(p * Math.PI / 2);
      if (dunk.t >= RISE_F) {
        slam();
        dunk.phase = dunk.success ? "hang" : "drop";   // 실패하면 매달리지 않는다
        dunk.dropFrom = dunk.lift; dunk.t = 0;
      }
      return;
    }
    if (dunk.phase === "hang") {
      dunk.x = DUNK_SPOT.x; dunk.z = DUNK_SPOT.z;
      dunk.lift += (GRAB_H - dunk.lift) * 0.25;
      dunk.hang += (1 - dunk.hang) * 0.12;
      if (ball.scored) dunk.afterScore++;
      if (dunk.afterScore > HANG_AFTER_SCORE || dunk.t > HANG_MAX) {
        dunk.phase = "drop"; dunk.dropFrom = dunk.lift; dunk.t = 0;
      }
      return;
    }
    const p = Math.min(1, dunk.t / DROP_F);
    dunk.lift = dunk.dropFrom * (1 - p * p);
    dunk.hang += (0 - dunk.hang) * 0.2;
    if (dunk.t >= DROP_F) { dunk.active = false; dunk.lift = 0; dunk.hang = 0; }
  }

  function step() {
    moving = false;
    if (vsMode) vsStep();
    if (!busy() && !gameOver) {
      // 조이스틱이 잡혀 있으면 그쪽이 우선 (기울인 만큼 속도도 비례)
      let mx = joy.active ? joy.x : (keys.R ? 1 : 0) - (keys.L ? 1 : 0);
      let mz = joy.active ? joy.z : (keys.D ? 1 : 0) - (keys.U ? 1 : 0);
      const mag = Math.hypot(mx, mz);
      if (mag > 0.02) {
        const sp = moveSpeed() * Math.min(1, mag);
        const ux = mx / mag, uz = mz / mag;
        player.x = Math.max(PLAYER_MIN_X, Math.min(PLAYER_MAX_X, player.x + ux * sp));
        player.z = Math.max(PLAYER_MIN_Z, Math.min(PLAYER_MAX_Z, player.z + uz * sp));
        bandDirty = true;
        moving = true;
        moveDirX = ux; moveDirZ = uz;
        if (Math.abs(ux) > 0.25) dribSide = ux > 0 ? 1 : -1;   // 오른쪽=오른손, 왼쪽=왼손
      }
    }
    if (bandDirty && !keys.L && !keys.R && !keys.U && !keys.D && !dunk.active) refreshBand();

    if (dunk.active) stepDunk();
    if (!ball.live) return;

    const was = ball.scored;
    advance(ball);
    shotTimer++;

    if (ball.scored && !was) {
      if (!shotIsDunk) {
        message = shotValue === 3 ? "3 POINTS!" : "GOAL!";
        messageColor = shotValue === 3 ? "#60a5fa" : "#4ade80";
        messageTimer = 75;
      }
      rimFlash = 45;
      const val = shotIsDunk ? 2 : shotValue;
      const col = val === 3 ? "#60a5fa" : "#4ade80";
      spawnPop("+" + val, col, 0, HOOP_Z, RIM_H + 0.2);
      spawnSparks(val === 3 ? 26 : 18, col);
      fx.flash = 12;
      if (shotIsDunk) fx.shake = 16;
    }

    const resting = ball.y - BALL_R <= 0.01 && Math.abs(ball.vy) < 0.025 && Math.abs(ball.vp) < 0.015;
    settleTimer = resting ? settleTimer + 1 : 0;
    if (settleTimer > 25 || shotTimer > SHOT_TIMEOUT) { ball.live = false; endShot(); }
  }

  // 공의 3D 위치 (그리기용)
  function ballPos() {
    return { x: ball.dx * ball.p, y: ball.y, z: HOOP_Z + ball.dz * ball.p };
  }

  // ===== 그리기 =====
  const RIM_ORANGE = [255, 107, 44], RIM_GREEN = [52, 230, 120];
  const SKIN = "#d9a273", SKIN_DK = "#b8835a";
  const JERSEY = "#f3c542", JERSEY_DK = "#c99c22", TRIM = "#5b2d8e";
  const mix = (a, b, t) => "rgb(" + Math.round(a[0] + (b[0] - a[0]) * t) + "," +
    Math.round(a[1] + (b[1] - a[1]) * t) + "," + Math.round(a[2] + (b[2] - a[2]) * t) + ")";
  const lerpPt = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });

  // "#rrggbb" 를 밝기 k 배로
  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.min(255, Math.round((n >> 16 & 255) * k));
    const g = Math.min(255, Math.round((n >> 8 & 255) * k));
    const b = Math.min(255, Math.round((n & 255) * k));
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  function pathPts(pts, close) {
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const q = proj(pts[i][0], pts[i][2] || 0, pts[i][1]);
      if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
    }
    if (close) ctx.closePath();
  }
  function arcPts(cx, cz, r, a0, a1, n) {
    const out = [];
    for (let i = 0; i <= n; i++) {
      const t = a0 + (a1 - a0) * i / n;
      out.push([cx + r * Math.sin(t), cz + r * Math.cos(t)]);
    }
    return out;
  }

  // 코트 뒤 관중석 · LED 보드 · 조명
  function drawArena() {
    const far = proj(0, 0, 0).y;                  // 베이스라인 화면 높이 (≈250)
    const farL = proj(-COURT_W / 2, 0, 0).x, farR = proj(COURT_W / 2, 0, 0).x;
    const top = Math.max(0, far - 210);

    // 어두운 천장
    const cg = ctx.createLinearGradient(0, 0, 0, far);
    cg.addColorStop(0, "#05070b");
    cg.addColorStop(1, "#11151d");
    ctx.fillStyle = cg; ctx.fillRect(0, 0, W, far);

    // 관중석 — 화면 끝까지 퍼지게 해서 잘린 느낌을 없앤다
    const edgeL = (k) => (farL - 10) * k + (-60) * (1 - k);   // k=1 아래(코트) ~ k=0 위
    const edgeR = (k) => (farR + 10) * k + (W + 60) * (1 - k);

    ctx.beginPath();
    ctx.moveTo(edgeL(1), far); ctx.lineTo(edgeR(1), far);
    ctx.lineTo(edgeR(0), top); ctx.lineTo(edgeL(0), top);
    ctx.closePath();
    const sg = ctx.createLinearGradient(0, top, 0, far);
    sg.addColorStop(0, "#0d111a");
    sg.addColorStop(0.45, "#1a2130");
    sg.addColorStop(1, "#28313f");
    ctx.fillStyle = sg; ctx.fill();

    ctx.save();
    ctx.clip();

    // 좌석 줄
    const ROWS = 11;
    for (let i = 1; i < ROWS; i++) {
      const k = i / ROWS, y = top + (far - top) * k;
      ctx.strokeStyle = "rgba(0,0,0," + (0.10 + 0.14 * k) + ")";
      ctx.lineWidth = 1 + 1.6 * k;
      ctx.beginPath(); ctx.moveTo(edgeL(k), y); ctx.lineTo(edgeR(k), y); ctx.stroke();
    }

    // 관중 (아래쪽일수록 크고 또렷)
    for (let i = 0; i < crowd.length; i++) {
      const c = crowd[i];
      const k = c.v;
      const y = top + k * (far - top - 14);
      const x = edgeL(k) + c.u * (edgeR(k) - edgeL(k));
      const rad = (1.1 + 2.3 * k) * c.s;
      ctx.globalAlpha = 0.35 + 0.65 * k;
      ctx.fillStyle = CROWD_COLORS[Math.floor(c.c * CROWD_COLORS.length)];
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 위쪽은 어둠에 묻히게
    const fade = ctx.createLinearGradient(0, top, 0, top + (far - top) * 0.55);
    fade.addColorStop(0, "rgba(5,7,11,.95)");
    fade.addColorStop(1, "rgba(5,7,11,0)");
    ctx.fillStyle = fade; ctx.fillRect(0, top, W, (far - top) * 0.55);
    ctx.restore();

    // 코트 앞 난간
    ctx.fillStyle = "rgba(10,13,19,.85)";
    ctx.fillRect(edgeL(1) - 4, far - 26, (edgeR(1) - edgeL(1)) + 8, 11);

    // 베이스라인 LED 보드 (천천히 흐르는 색)
    const t = (Date.now() % 6000) / 6000;
    const lg = ctx.createLinearGradient(farL - 10, 0, farR + 10, 0);
    lg.addColorStop(Math.max(0, t - 0.25), "rgba(243,197,66,.15)");
    lg.addColorStop(t, "rgba(243,197,66,.55)");
    lg.addColorStop(Math.min(1, t + 0.25), "rgba(96,165,250,.18)");
    ctx.fillStyle = lg;
    ctx.fillRect(farL - 10, far - 15, (farR - farL) + 20, 13);
    ctx.fillStyle = "rgba(0,0,0,.5)";
    ctx.fillRect(farL - 10, far - 3, (farR - farL) + 20, 3);
  }

  function drawCourt() {
    const g = ctx.createLinearGradient(0, 0, 0, PANEL_Y);
    g.addColorStop(0, "#161a23");
    g.addColorStop(1, "#0f1218");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, PANEL_Y);

    drawArena();

    // 마루
    pathPts([[-COURT_W / 2, 0], [COURT_W / 2, 0], [COURT_W / 2, COURT_L], [-COURT_W / 2, COURT_L]], true);
    const fg = ctx.createLinearGradient(0, 250, 0, 610);
    fg.addColorStop(0, "#b07a3c");
    fg.addColorStop(0.45, "#96612d");
    fg.addColorStop(1, "#6f4520");
    ctx.fillStyle = fg;
    ctx.fill();

    // 조명 스폿 — 골대 쪽이 밝다
    ctx.save();
    ctx.clip();
    const spot = ctx.createRadialGradient(CX, proj(0, 0, HOOP_Z).y, 20, CX, proj(0, 0, 4).y, 520);
    spot.addColorStop(0, "rgba(255,236,190,.22)");
    spot.addColorStop(1, "rgba(255,236,190,0)");
    ctx.fillStyle = spot;
    ctx.fillRect(0, 0, W, PANEL_Y);
    ctx.restore();

    ctx.lineJoin = "round";
    const LINE = "rgba(255,255,255,.8)";

    // 페인트존
    pathPts([[-KEY_W / 2, 0], [KEY_W / 2, 0], [KEY_W / 2, FT_Z], [-KEY_W / 2, FT_Z]], true);
    ctx.fillStyle = "rgba(190,110,50,.45)";
    ctx.fill();
    ctx.strokeStyle = LINE; ctx.lineWidth = 2.5; ctx.stroke();

    // 3점 라인 (코너 직선 + 아크)
    const tMax = Math.asin(CORNER_X / THREE_R);
    const cz = HOOP_Z + THREE_R * Math.cos(tMax);
    ctx.strokeStyle = "#dbe6ff"; ctx.lineWidth = 3;
    pathPts([[-CORNER_X, 0], [-CORNER_X, cz]]); ctx.stroke();
    pathPts([[CORNER_X, 0], [CORNER_X, cz]]); ctx.stroke();
    pathPts(arcPts(0, HOOP_Z, THREE_R, -tMax, tMax, 48)); ctx.stroke();

    // 자유투 서클 / 제한구역
    ctx.strokeStyle = LINE; ctx.lineWidth = 2.5;
    pathPts(arcPts(0, FT_Z, FT_R, 0, Math.PI * 2, 40), true); ctx.stroke();
    pathPts(arcPts(0, HOOP_Z, RESTRICT_R, -Math.PI / 2, Math.PI / 2, 24)); ctx.stroke();

    // 외곽선
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3;
    pathPts([[-COURT_W / 2, 0], [COURT_W / 2, 0], [COURT_W / 2, COURT_L], [-COURT_W / 2, COURT_L]], true);
    ctx.stroke();

    // 선수 발밑 표시 (2점/3점/덩크)
    if (!dunk.active) {
      const d = distToRim();
      const col = d < DUNK_RANGE ? "rgba(243,197,66,.9)"
                : (isThree() ? "rgba(96,165,250,.9)" : "rgba(255,255,255,.5)");
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      pathPts(arcPts(player.x, player.z, 0.55, 0, Math.PI * 2, 24), true);
      ctx.stroke();
    }
  }

  function drawHoop() {
    const flash = Math.min(1, rimFlash / 30);
    const sag = dunk.active && dunk.phase === "hang" ? 0.05 * dunk.hang : 0;

    // 지지대
    const base = proj(0, 0, -0.9), top = proj(0, BOARD_TOP + 0.1, -0.9);
    ctx.strokeStyle = "#5a6070"; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(top.x, top.y); ctx.stroke();
    const arm0 = proj(0, (BOARD_BOT + BOARD_TOP) / 2, -0.9);
    const arm1 = proj(0, (BOARD_BOT + BOARD_TOP) / 2, BOARD_Z);
    ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(arm0.x, arm0.y); ctx.lineTo(arm1.x, arm1.y); ctx.stroke();

    // 백보드
    pathPts([[-BOARD_W / 2, BOARD_Z, BOARD_TOP], [BOARD_W / 2, BOARD_Z, BOARD_TOP],
             [BOARD_W / 2, BOARD_Z, BOARD_BOT], [-BOARD_W / 2, BOARD_Z, BOARD_BOT]], true);
    ctx.fillStyle = "rgba(226,234,248,.92)"; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 2; ctx.stroke();

    pathPts([[-SQ_W / 2, BOARD_Z, RIM_H + SQ_H], [SQ_W / 2, BOARD_Z, RIM_H + SQ_H],
             [SQ_W / 2, BOARD_Z, RIM_H], [-SQ_W / 2, BOARD_Z, RIM_H]], true);
    ctx.strokeStyle = flash > 0 ? mix([207, 58, 58], RIM_GREEN, flash) : "#cf3a3a";
    ctx.lineWidth = 3; ctx.stroke();

    // 네트
    ctx.strokeStyle = flash > 0
      ? "rgba(" + Math.round(140 + 90 * flash) + ",255," + Math.round(170 + 50 * flash) + ",.75)"
      : "rgba(255,255,255,.5)";
    ctx.lineWidth = 1.3;
    for (let i = 0; i < 12; i++) {
      const t = i / 12 * Math.PI * 2;
      const a = proj(RIM_R * Math.sin(t), RIM_H - sag, HOOP_Z + RIM_R * Math.cos(t));
      const b = proj(RIM_R * 0.55 * Math.sin(t), RIM_H - 0.4 - sag, HOOP_Z + RIM_R * 0.55 * Math.cos(t));
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    for (let j = 1; j <= 3; j++) {
      const k = 1 - j * 0.15, hh = RIM_H - 0.4 * (j / 3) - sag;
      pathPts(arcPts(0, HOOP_Z, RIM_R * k, 0, Math.PI * 2, 20).map(p => [p[0], p[1], hh]), true);
      ctx.stroke();
    }

    // 림
    if (flash > 0) { ctx.shadowColor = "rgba(52,230,120,.9)"; ctx.shadowBlur = 20; }
    ctx.strokeStyle = flash > 0 ? mix(RIM_ORANGE, RIM_GREEN, flash) : "rgb(255,107,44)";
    ctx.lineWidth = 5;
    pathPts(arcPts(0, HOOP_Z, RIM_R, 0, Math.PI * 2, 28).map(p => [p[0], p[1], RIM_H - sag]), true);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // ---- 선수 (뒷모습) — 선이 아니라 면으로 그린다 ----
  // 내 선수와 CPU 가 같은 그리기 코드를 쓴다
  function drawPlayer(st) {
    st = st || {
      x: dunk.active ? dunk.x : player.x,
      z: dunk.active ? dunk.z : player.z,
      lift: dunk.active ? dunk.lift : 0,
      hang: dunk.active ? dunk.hang : 0,
      dunkMode: dunk.active,
      armsUp: armsUp, dribbling: dribbling, dribPhase: dribPhase, dribSide: dribSide,
      data: me(),
      runAmt: runAmt, runPhase: runPhase, leanX: leanX,
      headYaw: headYaw, bodyYaw: bodyYaw
    };
    const P0 = st.data;
    const HS = (P0.height || 1.95) / 1.95;        // 키 배율
    const BD = P0.build || 1;                     // 체격(가로) 배율

    const px = st.x, pz = st.z, lift = st.lift;
    const s = FOCAL / (CAM_Z - pz);
    // 몸이 돌아선 만큼 가로폭이 줄어 옆모습이 된다
    const bYaw = st.bodyYaw === undefined ? Math.PI : st.bodyYaw;
    const bCos = Math.cos(bYaw);
    const TW = 0.34 + 0.66 * Math.abs(bCos);
    // dx 는 체격·회전, h 는 키 배율을 받는다
    const P = (dx, h) => proj(px + dx * BD * TW, h * HS + lift, pz);
    const Pabs = (dx, h) => proj(px + dx * BD * TW, h + lift, pz);
    const w = (m) => Math.max(0.7, s * m * BD);   // 두께(m) → 화면 반폭

    const SK = P0.skin || SKIN;          // 선수별 피부색
    const SKIN_SH = shade(SK, 0.88);     // 반대쪽 팔 — 너무 어두우면 검은 막대로 보인다
    const UNI = P0.uniform, UNI_DK = shade(UNI, 0.74), UNI_SH = shade(UNI, 0.56);

    // --- 기본 도형 ---
    function taper(a, b, w1, w2, color) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const L = Math.hypot(dx, dy) || 1;
      const nx = -dy / L, ny = dx / L;
      ctx.beginPath();
      ctx.moveTo(a.x + nx * w1, a.y + ny * w1);
      ctx.lineTo(b.x + nx * w2, b.y + ny * w2);
      ctx.lineTo(b.x - nx * w2, b.y - ny * w2);
      ctx.lineTo(a.x - nx * w1, a.y - ny * w1);
      ctx.closePath();
      ctx.fillStyle = color; ctx.fill();
    }
    function blob(p, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    }
    // 굵기가 변하는 신체 부위 + 빛(왼쪽 위) 음영
    function part(a, b, m1, m2, color) {
      const w1 = w(m1), w2 = w(m2);
      const dk = shade(color, 0.66);
      taper(a, b, w1, w2, dk); blob(a, w1, dk); blob(b, w2, dk);
      const off = -Math.min(w1, w2) * 0.32;
      const a2 = { x: a.x + off, y: a.y - Math.abs(off) * 0.35 };
      const b2 = { x: b.x + off, y: b.y - Math.abs(off) * 0.35 };
      taper(a2, b2, w1 * 0.74, w2 * 0.74, color);
      blob(a2, w1 * 0.74, color); blob(b2, w2 * 0.74, color);
    }

    // --- 자세 ---
    const hang = st.hang, dunkMode = st.dunkMode;
    const footY = dunkMode ? (0.30 - 0.26 * hang) : 0.04;   // 서 있을 땐 발이 땅에 붙는다

    // 달리기: 두 다리가 번갈아 들리고, 몸이 위아래로 튀며, 가는 쪽으로 기운다
    const run = dunkMode ? 0 : (st.runAmt || 0);
    const ph = (st.runPhase || 0) * Math.PI * 2;
    const aL = Math.sin(ph), aR = Math.sin(ph + Math.PI);
    const upL = Math.max(0, aL) * run, upR = Math.max(0, aR) * run;
    const bob = Math.abs(Math.sin(ph * 2)) * 0.035 * run;      // 한 주기에 두 번 튄다
    const lean = (st.leanX || 0) * 0.08 * run;

    const hipY = 0.95 + bob, shoY = 1.56 + bob, headY = 1.79 + bob;

    const hipL = P(-0.15 + lean * 0.3, hipY), hipR = P(0.15 + lean * 0.3, hipY);
    const shoL = P(-0.23 + lean, shoY), shoR = P(0.23 + lean, shoY);
    const hd = P(0 + lean * 1.25, headY), headR = Math.max(4, s * 0.138 * HS);

    const kneeL = P(-0.17 + aL * 0.04 * run, hipY - (dunkMode ? 0.42 - 0.04 * hang : 0.45) + 0.17 * upL);
    const kneeR = P(0.17 + aR * 0.04 * run, hipY - (dunkMode ? 0.40 - 0.04 * hang : 0.43) + 0.17 * upR);
    const footL = P(-0.19 + aL * 0.085 * run, footY + 0.30 * upL);
    const footR = P(0.19 + aR * 0.085 * run, footY + 0.30 * upR);
    const ankL = P(-0.19 + aL * 0.085 * run, footY + 0.06 + 0.30 * upL);
    const ankR = P(0.19 + aR * 0.085 * run, footY + 0.06 + 0.30 * upR);

    // --- 바닥 그림자 ---
    const sh = proj(px, 0, pz);
    const shr = s * 0.44 * BD * (1 - Math.min(0.55, lift / 1.6));
    ctx.fillStyle = "rgba(0,0,0,.34)";
    ctx.beginPath(); ctx.ellipse(sh.x, sh.y, shr, shr * 0.32, 0, 0, Math.PI * 2); ctx.fill();

    // --- 다리 (허벅지 굵고 발목 가늘게) ---
    part(hipL, kneeL, 0.100, 0.066, SK);
    part(hipR, kneeR, 0.103, 0.068, SK);
    part(kneeL, ankL, 0.074, 0.044, SK);
    part(kneeR, ankR, 0.076, 0.045, SK);

    // --- 농구화 ---
    function shoe(f) {
      const bw = w(0.115), bh = w(0.062);
      ctx.fillStyle = shade(P0.shoe, 0.72);
      ctx.beginPath(); ctx.ellipse(f.x, f.y, bw, bh, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = P0.shoe;
      ctx.beginPath(); ctx.ellipse(f.x - bw * 0.12, f.y - bh * 0.22, bw * 0.86, bh * 0.72, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = P0.shoeAccent;                       // 밑창 포인트
      ctx.beginPath(); ctx.ellipse(f.x, f.y + bh * 0.55, bw * 0.92, bh * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    }
    shoe(footL); shoe(footR);

    // --- 반바지 ---
    const legTopL = { x: (hipL.x + kneeL.x) / 2, y: (hipL.y + kneeL.y) / 2 };
    const legTopR = { x: (hipR.x + kneeR.x) / 2, y: (hipR.y + kneeR.y) / 2 };
    part(hipL, legTopL, 0.135, 0.105, UNI_DK);
    part(hipR, legTopR, 0.138, 0.108, UNI_DK);
    const wL = P(-0.155, 1.16), wR = P(0.155, 1.16);
    ctx.beginPath();
    ctx.moveTo(wL.x, wL.y); ctx.lineTo(wR.x, wR.y);
    ctx.lineTo(hipR.x + w(0.02), hipR.y + w(0.04)); ctx.lineTo(hipL.x - w(0.02), hipL.y + w(0.04));
    ctx.closePath();
    ctx.fillStyle = UNI_DK; ctx.fill();

    // --- 몸통 (어깨 넓고 허리 들어간 면) ---
    const cL = P(-0.215, 1.40), cR = P(0.215, 1.40);
    ctx.beginPath();
    ctx.moveTo(shoL.x, shoL.y);
    ctx.quadraticCurveTo(cL.x, cL.y, wL.x, wL.y);
    ctx.lineTo(wR.x, wR.y);
    ctx.quadraticCurveTo(cR.x, cR.y, shoR.x, shoR.y);
    ctx.quadraticCurveTo((shoL.x + shoR.x) / 2, shoL.y - w(0.05), shoL.x, shoL.y);
    ctx.closePath();
    ctx.fillStyle = UNI; ctx.fill();
    // 오른쪽 면에 그림자
    ctx.save(); ctx.clip();
    ctx.fillStyle = UNI_SH;
    ctx.beginPath();
    ctx.moveTo(shoR.x + 1, shoR.y - 20); ctx.lineTo(shoR.x + 1, wR.y + 20);
    ctx.lineTo(shoR.x - w(0.11), wR.y + 20); ctx.lineTo(shoR.x - w(0.07), shoR.y - 20);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    // 목선 + 진동(어깨 구멍)
    ctx.strokeStyle = "rgba(0,0,0,.22)"; ctx.lineWidth = Math.max(1, w(0.012));
    ctx.beginPath();
    ctx.moveTo(shoL.x + w(0.05), shoL.y);
    ctx.quadraticCurveTo(hd.x, shoL.y + w(0.07), shoR.x - w(0.05), shoR.y);
    ctx.stroke();

    // --- 등번호 ---
    const numP = P(0, 1.30);
    const fs = Math.max(7, s * 0.27 * HS);
    const numA = Math.max(0, -bCos);          // 등을 보일 때만 번호가 보인다
    ctx.globalAlpha = numA;
    ctx.fillStyle = "rgba(0,0,0,.25)";
    ctx.font = "bold " + fs.toFixed(0) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(P0.number), numP.x + 1, numP.y + fs * 0.35 + 1);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(String(P0.number), numP.x, numP.y + fs * 0.35);
    ctx.textAlign = "left";
    ctx.globalAlpha = 1;

    // --- 팔 ---
    function arm(sho, elbow, hand, mUpper, mFore, color) {
      part(sho, elbow, mUpper, mFore * 1.05, color);
      part(elbow, hand, mFore * 1.05, mFore * 0.72, color);
      blob(hand, w(mFore * 0.95), shade(color, 0.66));
      blob({ x: hand.x - w(mFore) * 0.25, y: hand.y - w(mFore) * 0.1 }, w(mFore * 0.72), color);
    }

    if (dunkMode) {
      const elbowR = Pabs(0.20, (shoY + 0.34) * HS);
      const handR = Pabs(0.14, REACH);               // 손끝은 림 높이 고정
      const elbowL = P(-0.27, shoY - 0.18);
      const handL = P(-0.31, shoY - 0.52);
      arm(shoL, elbowL, handL, 0.070, 0.054, SKIN_SH);
      arm(shoR, elbowR, handR, 0.079, 0.060, SK);
    } else {
      const u = st.armsUp;
      const dribH = st.dribbling
        ? DRIB_HAND_H + 0.12 * Math.abs(Math.cos(Math.PI * st.dribPhase)) - 0.06
        : DRIB_HAND_H;
      const rightDrib = st.dribSide > 0;

      // 몸통에서 충분히 띄워야 팔로 보인다.
      // 달릴 때 팔은 다리와 반대로 흔들린다 (드리블하는 손은 공을 따라가므로 제외)
      const swL = aR * 0.13 * run, swR = aL * 0.13 * run;
      const dribL = !rightDrib, dribR = rightDrib;
      const downEL = P(-0.32, 1.27 + (dribL ? 0 : swL * 0.6));
      const downER = P(0.32, 1.27 + (dribR ? 0 : swR * 0.6));
      const downHL = P(rightDrib ? -0.34 : -0.38,
                       (rightDrib ? 1.02 : dribH) + (dribL ? 0 : swL));
      const downHR = P(rightDrib ? 0.38 : 0.34,
                       (rightDrib ? dribH : 1.02) + (dribR ? 0 : swR));
      const upEL = P(-0.23, shoY + 0.30), upER = P(0.23, shoY + 0.30);
      const upHL = P(-0.13, 2.18), upHR = P(0.13, 2.18);

      arm(shoL, lerpPt(downEL, upEL, u), lerpPt(downHL, upHL, u), 0.070, 0.054, SKIN_SH);
      arm(shoR, lerpPt(downER, upER, u), lerpPt(downHR, upHR, u), 0.079, 0.060, SK);
    }

    // --- 목 + 얼굴 (몸은 뒷모습, 얼굴은 이쪽을 본다) ---
    part(P(0, shoY + 0.02), P(0, headY - 0.12), 0.060, 0.053, SKIN_SH);
    drawGameHead(hd, headR, P0, SK, st.headYaw === undefined ? Math.PI : st.headYaw);
  }

  // 경기 중 얼굴 — 머리 반지름이 10px 안팎이라 크기에 따라 단계적으로 그린다.
  // yaw: 0 = 카메라 정면(얼굴 다 보임), ±π = 골대 쪽(뒤통수)
  function drawGameHead(hd, R, P0, SK, yaw) {
    // 화면에서 얼굴이 읽히도록 카메라 쪽으로 살짝 당긴다.
    // 옆으로 달릴 때(90°)는 약 66° 로 보여 두 눈이 나오고, 골대를 향하면 뒤통수 그대로.
    const vy = Math.atan2(Math.sin(yaw), Math.cos(yaw) + 0.45);
    const f = Math.cos(vy);         //  1 정면  ~ -1 뒤통수
    const sd = Math.sin(vy);        //  1 오른쪽 ~ -1 왼쪽
    // 정면~옆모습까지는 또렷하게, 등질 때만 사라진다
    const faceVis = Math.max(0, Math.min(1, (f + 0.75) / 0.75));

    const skDk = shade(SK, 0.72), skLt = shade(SK, 1.14);
    const hairCol = P0.hair || "#1d1510";
    const X = hd.x, Y = hd.y;

    // 머리통 — 돌아선 만큼 살짝 좁아진다
    const wN = 0.95 - 0.10 * Math.abs(sd);
    ctx.fillStyle = skDk;
    ctx.beginPath(); ctx.ellipse(X, Y, R * wN, R * 1.06, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = SK;
    ctx.beginPath();
    ctx.ellipse(X - R * 0.10 + sd * R * 0.06, Y - R * 0.04, R * (wN - 0.11), R * 0.98, 0, 0, Math.PI * 2);
    ctx.fill();

    // 옆모습일 때 코 실루엣
    if (faceVis > 0.05 && Math.abs(f) < 0.72 && R >= 6) {
      ctx.fillStyle = SK;
      ctx.beginPath();
      ctx.moveTo(X + sd * R * 0.80, Y - R * 0.06);
      ctx.lineTo(X + sd * R * 1.08, Y + R * 0.14);
      ctx.lineTo(X + sd * R * 0.78, Y + R * 0.26);
      ctx.closePath(); ctx.fill();
    }

    // 귀 — 반대쪽 귀는 돌아서면 가려진다
    ctx.fillStyle = skDk;
    for (const sg of [-1, 1]) {
      const vis = 1 - Math.max(0, sg * sd);
      if (vis < 0.15) continue;
      ctx.globalAlpha = vis;
      ctx.beginPath();
      ctx.ellipse(X + sg * R * 0.92, Y + R * 0.06, R * 0.14, R * 0.22, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // 머리카락 — 뒤통수일수록 아래까지 덮는다
    const back = Math.max(0, -f);
    if (P0.bald) {
      ctx.fillStyle = skLt; ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.ellipse(X - R * 0.22 + sd * R * 0.10, Y - R * 0.62, R * 0.36, R * 0.16, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      if (back > 0.3) {                       // 뒤통수 쪽 목덜미
        ctx.fillStyle = skDk; ctx.globalAlpha = 0.5 * back;
        ctx.beginPath();
        ctx.ellipse(X, Y + R * 0.52, R * 0.72, R * 0.34, 0, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    } else if (P0.hairStyle === "curly") {
      ctx.fillStyle = hairCol;
      const cyH = Y - R * (0.46 - 0.22 * back);
      ctx.beginPath();
      ctx.ellipse(X, cyH, R * 1.24, R * (0.96 + 0.30 * back), 0, Math.PI * 0.92, Math.PI * 2.08);
      ctx.fill();
      if (back > 0.4) {
        ctx.beginPath();
        ctx.ellipse(X, Y - R * 0.10, R * 1.10, R * 0.95, 0, 0, Math.PI * 2); ctx.fill();
      }
      for (let i = 0; i < 6; i++) {
        const a = Math.PI * 0.95 + (i + 0.5) / 6 * Math.PI * 1.10;
        ctx.beginPath();
        ctx.arc(X + Math.cos(a) * R * 1.14, cyH + Math.sin(a) * R * 0.88, R * 0.28, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (P0.hairStyle === "shaggy") {
      ctx.fillStyle = hairCol;
      ctx.beginPath();
      ctx.ellipse(X, Y - R * (0.40 - 0.26 * back), R * 1.08, R * (0.86 + 0.26 * back),
                  0, Math.PI * 0.94, Math.PI * 2.06);
      ctx.fill();
      if (back > 0.4) {
        ctx.beginPath();
        ctx.ellipse(X, Y - R * 0.06, R * 1.00, R * 0.92, 0, 0, Math.PI * 2); ctx.fill();
      }
      for (const sg of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(X + sg * R * 0.96, Y - R * 0.04, R * 0.22, R * 0.46, sg * 0.18, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      ctx.fillStyle = hairCol;
      ctx.beginPath();
      ctx.ellipse(X, Y - R * (0.34 - 0.30 * back), R * 0.98, R * (0.80 + 0.26 * back),
                  0, Math.PI * 0.98, Math.PI * 2.02);
      ctx.fill();
      if (back > 0.45) {
        ctx.beginPath();
        ctx.ellipse(X, Y - R * 0.08, R * 0.93, R * 0.94, 0, 0, Math.PI * 2); ctx.fill();
      }
    }

    // 헤드밴드는 어느 방향에서나 보인다
    if (P0.headband) {
      ctx.strokeStyle = shade(P0.uniform, 1.3);
      ctx.lineWidth = Math.max(1.5, R * 0.30);
      ctx.beginPath();
      ctx.ellipse(X, Y - R * 0.26, R * 0.88, R * 0.62, 0, Math.PI * 1.08, Math.PI * 1.92);
      ctx.stroke();
    }

    if (faceVis <= 0.04) return;              // 완전히 등지면 얼굴 없음

    ctx.globalAlpha = faceVis;

    const eyeY = Y - R * 0.04;
    const eyeX = R * 0.34 * Math.max(0, f);                      // 돌면 두 눈이 모인다
    const lean = sd * R * (0.30 + 0.20 * (1 - Math.abs(f)));     // 보는 쪽으로 쏠린다

    // 눈
    if (R >= 6.5) {
      for (const sg of [-1, 1]) {
        if (eyeX < R * 0.05 && sg < 0) continue;                 // 옆모습이면 한 눈만
        const ex = X + lean + sg * eyeX;
        ctx.fillStyle = "#e6dccc";                                // 흰자를 낮춰 부드럽게
        ctx.beginPath(); ctx.ellipse(ex, eyeY, R * 0.19, R * 0.125, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#3a2b1e";
        ctx.beginPath(); ctx.ellipse(ex + sd * R * 0.03, eyeY, R * 0.085, R * 0.095, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "rgba(45,30,18,.55)";                   // 윗꺼풀로 동그란 느낌을 깎는다
        ctx.lineWidth = Math.max(0.8, R * 0.05);
        ctx.beginPath();
        ctx.moveTo(ex - R * 0.19, eyeY - R * 0.05);
        ctx.quadraticCurveTo(ex, eyeY - R * 0.13, ex + R * 0.19, eyeY - R * 0.05);
        ctx.stroke();
      }
    } else {
      ctx.fillStyle = "#1e150e";
      for (const sg of [-1, 1]) {
        if (eyeX < R * 0.05 && sg < 0) continue;
        ctx.beginPath();
        ctx.arc(X + lean + sg * eyeX, eyeY, Math.max(0.9, R * 0.15), 0, Math.PI * 2); ctx.fill();
      }
    }

    // 눈썹
    if (R >= 8) {
      ctx.strokeStyle = P0.bald ? "#241a12" : shade(hairCol, 0.85);
      ctx.lineWidth = Math.max(1, R * 0.13);
      ctx.lineCap = "round";
      const ang = P0.mood === "intense" ? R * 0.10 : 0;
      for (const sg of [-1, 1]) {
        if (eyeX < R * 0.05 && sg < 0) continue;
        ctx.beginPath();
        ctx.moveTo(X + lean + sg * (eyeX + R * 0.26), eyeY - R * 0.30);
        ctx.lineTo(X + lean + sg * (eyeX - R * 0.18), eyeY - R * 0.26 + ang);
        ctx.stroke();
      }
      ctx.lineCap = "butt";
    }

    // 입
    if (R >= 6) {
      const my = Y + R * 0.52, mw = R * (0.22 + 0.06 * Math.abs(f));
      ctx.strokeStyle = "#4a2a1e";
      ctx.lineWidth = Math.max(1, R * 0.11);
      ctx.beginPath();
      if (P0.mood === "smile") {
        ctx.moveTo(X + lean - mw, my - R * 0.06);
        ctx.quadraticCurveTo(X + lean, my + R * 0.20, X + lean + mw, my - R * 0.06);
      } else {
        ctx.moveTo(X + lean - mw, my);
        ctx.lineTo(X + lean + mw, my);
      }
      ctx.stroke();
    }

    // 수염
    if (R >= 7.5 && P0.facial && P0.facial !== "none") {
      ctx.fillStyle = P0.bald ? "#241a12" : shade(hairCol, 0.92);
      const my = Y + R * 0.52;
      if (P0.facial === "beard") {
        ctx.beginPath();
        ctx.ellipse(X + lean * 0.6, Y + R * 0.56, R * 0.72, R * 0.50, 0, 0, Math.PI); ctx.fill();
      }
      ctx.beginPath();
      ctx.ellipse(X + lean, my - R * 0.17, R * (0.28 * Math.max(0.45, Math.abs(f))), R * 0.10, 0, 0, Math.PI * 2);
      ctx.fill();
      if (P0.facial === "goatee") {
        ctx.beginPath();
        ctx.ellipse(X + lean, my + R * 0.26, R * 0.16, R * 0.13, 0, 0, Math.PI * 2); ctx.fill();
      }
    }

    // 고글
    if (P0.goggles && R >= 6) {
      ctx.fillStyle = "rgba(190,215,245,.25)";
      for (const sg of [-1, 1]) {
        if (eyeX < R * 0.05 && sg < 0) continue;
        ctx.beginPath();
        ctx.ellipse(X + lean + sg * eyeX, eyeY, R * 0.32, R * 0.26, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.strokeStyle = "rgba(235,243,255,.95)";
      ctx.lineWidth = Math.max(1, R * 0.09);
      for (const sg of [-1, 1]) {
        if (eyeX < R * 0.05 && sg < 0) continue;
        ctx.beginPath();
        ctx.ellipse(X + lean + sg * eyeX, eyeY, R * 0.32, R * 0.26, 0, 0, Math.PI * 2); ctx.stroke();
      }
      if (eyeX >= R * 0.05) {
        ctx.beginPath();
        ctx.moveTo(X + lean - R * 0.05, eyeY); ctx.lineTo(X + lean + R * 0.05, eyeY); ctx.stroke();
      }
    }

    ctx.globalAlpha = 1;
  }

  function drawBall() {
    let b;
    if (dunk.active && !dunk.released) {
      const h = dunkHand();
      b = { x: h.x + 0.1, y: h.y + 0.14, z: h.z };
    } else if (vsMode && cpu.dunking && !ball.live) {
      b = { x: cpu.x + 0.18, y: REACH + cpu.lift + 0.12, z: cpu.z };
    } else if (!ball.live && !dunk.active) {
      b = (vsMode && possession === "cpu") ? cpuHeldBallPos() : heldBallPos();
    } else {
      b = ballPos();
    }

    // 바닥 그림자 — 높이에 따라 작고 옅어진다
    const gs = proj(b.x, 0, b.z);
    const hk = Math.max(0, 1 - b.y / 5);
    ctx.fillStyle = "rgba(0,0,0," + (0.30 * hk + 0.06) + ")";
    ctx.beginPath();
    ctx.ellipse(gs.x, gs.y, gs.s * BALL_R * (0.55 + 0.75 * hk),
                gs.s * BALL_R * (0.2 + 0.26 * hk), 0, 0, Math.PI * 2);
    ctx.fill();

    // 잔상
    for (let i = 0; i < fx.trail.length; i++) {
      const tp = fx.trail[i], a = (i + 1) / fx.trail.length;
      const tq = proj(tp.x, tp.y, tp.z);
      ctx.fillStyle = "rgba(240,154,74," + (0.30 * a * a) + ")";
      ctx.beginPath();
      ctx.arc(tq.x, tq.y, Math.max(1, tq.s * BALL_R * (0.35 + 0.5 * a)), 0, Math.PI * 2);
      ctx.fill();
    }

    const q = proj(b.x, b.y, b.z);
    const r = Math.max(3, q.s * BALL_R);

    if (q.y + r < 0) {
      ctx.fillStyle = "rgba(240,154,74,.9)";
      ctx.beginPath(); ctx.moveTo(q.x, 6); ctx.lineTo(q.x - 9, 22); ctx.lineTo(q.x + 9, 22);
      ctx.closePath(); ctx.fill();
      return;
    }

    ctx.save();
    ctx.translate(q.x, q.y);
    ctx.rotate(ball.rot);
    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
    g.addColorStop(0, "#f09a4a"); g.addColorStop(1, "#d2641d");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(40,20,5,.75)"; ctx.lineWidth = Math.max(0.8, r * 0.09);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.5, r, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  function drawGauge() {
    const gw = 230, gh = 24;
    const gx = (W - gw) / 2, gy = PANEL_Y + 34;

    if (inDunkRange() && !ball.live) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#f3c542";
      ctx.font = "bold 20px sans-serif";
      ctx.fillText(touchUI ? "왼쪽 끌어 이동   ·   오른쪽 버튼 누르면 바로 덩크!"
                           : "방향키 이동   ·   SPACE 누르면 바로 덩크!", W / 2, gy + 18);
      ctx.textAlign = "left";
      return;
    }

    ctx.fillStyle = "rgba(255,255,255,.12)";
    ctx.fillRect(gx, gy, gw, gh);

    if (gauge) {
      const x0 = gx + gw * gauge.bandLo / 100, x1 = gx + gw * gauge.bandHi / 100;
      ctx.fillStyle = "rgba(74,222,128,.38)";
      ctx.fillRect(x0, gy, x1 - x0, gh);
    }
    if (lastPower !== null) {
      ctx.fillStyle = "rgba(255,255,255,.75)";
      ctx.fillRect(gx + gw * lastPower / 100 - 1, gy - 3, 2, gh + 6);
    }
    if (charging && power > 0) {
      ctx.fillStyle = power > 94 ? "#ff5252" : "#e9ecf1";
      ctx.fillRect(gx, gy, gw * power / 100, gh);
    }
    ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 1;
    ctx.strokeRect(gx + .5, gy + .5, gw - 1, gh - 1);

    ctx.textAlign = "center";
    if (charging) {
      ctx.fillStyle = "#e9ecf1"; ctx.font = "bold 22px sans-serif";
      ctx.fillText(Math.round(power) + "%", W / 2, gy - 12);
    } else {
      ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.font = "15px sans-serif";
      ctx.fillText(gameOver ? (touchUI ? "화면을 누르면 다시 시작" : "SPACE 로 다시 시작")
        : (touchUI ? "왼쪽 끌어 이동   ·   오른쪽 버튼을 초록 구간에서 떼기 (조준은 자동)"
                   : "방향키 이동   ·   SPACE 눌렀다 초록 구간에서 놓기 (조준은 자동)"), W / 2, gy - 12);
    }
    ctx.textAlign = "left";
  }

  // 아래 패널의 메뉴 / 다시 버튼
  function drawMenuButtons() {
    const items = [[menuBtn(), "메뉴", "ESC"], [restartBtn(), "다시", "R"]];
    for (const [b, label, key] of items) {
      ctx.fillStyle = "rgba(255,255,255,.07)";
      roundRect(b.x, b.y, b.w, b.h, 9); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.22)";
      ctx.lineWidth = 1.5;
      roundRect(b.x, b.y, b.w, b.h, 9); ctx.stroke();
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(255,255,255,.85)";
      ctx.font = "bold 16px sans-serif";
      ctx.fillText(label, b.x + b.w / 2, b.y + (touchUI ? 25 : 20));
      if (!touchUI) {
        ctx.fillStyle = "rgba(255,255,255,.35)";
        ctx.font = "10px sans-serif";
        ctx.fillText(key, b.x + b.w / 2, b.y + 32);
      }
      ctx.textAlign = "left";
    }
  }

  function drawHUD() {
    drawMenuButtons();
    if (vsMode) { drawVsHUD(); return; }
    ctx.fillStyle = "#e9ecf1"; ctx.font = "bold 30px sans-serif"; ctx.textAlign = "left";
    ctx.fillText("SCORE  " + score, 28, 46);

    // 내 선수 / 상대 선수
    const mp = me(), rp = PLAYERS[rivalKey];
    ctx.textAlign = "right";
    ctx.font = "bold 17px sans-serif"; ctx.fillStyle = mp.uniform;
    ctx.fillText("#" + mp.number + " " + mp.name, W - 28, 40);
    ctx.font = "14px sans-serif"; ctx.fillStyle = "rgba(255,255,255,.4)";
    ctx.fillText("VS  #" + rp.number + " " + rp.name, W - 28, 64);
    ctx.textAlign = "left";

    ctx.font = "17px sans-serif"; ctx.fillStyle = "#9aa3b2";
    ctx.fillText("남은 슛  " + Math.max(0, TOTAL_SHOTS - shots) + " / " + TOTAL_SHOTS +
                 "   ·   성공  " + makes, 28, 74);

    const d = distToRim();
    const dunkMode = d < DUNK_RANGE;
    const three = isThree();
    const label = dunkMode ? "덩크 존 · 2점" : (three ? "3점" : "2점");
    const col = dunkMode ? "#f3c542" : (three ? "#60a5fa" : "#9aa3b2");
    ctx.font = "bold 17px sans-serif"; ctx.fillStyle = col;
    ctx.fillText(label + "   ·   림까지 " + d.toFixed(2) + "m", 28, 102);

    if (messageTimer > 0 && !gameOver) {
      ctx.textAlign = "center";
      ctx.globalAlpha = Math.min(1, messageTimer / 25);
      ctx.fillStyle = messageColor;
      const big = message === "DUNK!" || message === "3 POINTS!" || message === "GOAL!";
      ctx.font = (big ? "bold 54px" : "bold 32px") + " sans-serif";
      ctx.fillText(message, W / 2, 86);
      ctx.globalAlpha = 1; ctx.textAlign = "left";
    }
  }

  function drawVsHUD() {
    const m = me(), f = foe();
    const onOff = possession === "me";

    // 양쪽 점수판
    ctx.textAlign = "left";
    ctx.fillStyle = m.uniform; ctx.font = "bold 17px sans-serif";
    ctx.fillText("#" + m.number + " " + m.name, 28, 36);
    ctx.fillStyle = "#e9ecf1"; ctx.font = "bold 46px sans-serif";
    ctx.fillText(String(myScore), 28, 84);

    ctx.textAlign = "right";
    ctx.fillStyle = f.uniform; ctx.font = "bold 17px sans-serif";
    ctx.fillText(f.name + " #" + f.number, W - 28, 36);
    ctx.fillStyle = "#e9ecf1"; ctx.font = "bold 46px sans-serif";
    ctx.fillText(String(cpuScore), W - 28, 84);

    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.font = "14px sans-serif";
    ctx.fillText(TARGET_SCORE + "점 선취  ·  " + diff().name, W / 2, 34);

    // 공격 / 수비 표시
    ctx.font = "bold 20px sans-serif";
    ctx.fillStyle = onOff ? "#4ade80" : "#60a5fa";
    ctx.fillText(onOff ? "내 공격" : "수비!", W / 2, 64);

    if (!onOff && checkT <= 0 && !vsOver) {
      ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.font = "14px sans-serif";
      ctx.fillText(touchUI ? "블락 = 오른쪽 큰 버튼 · 스틸 = 파란 버튼"
                           : "블락 = Z · 스틸 = X", W / 2, 88);
    }

    if (vsMsgTimer > 0) {
      ctx.globalAlpha = Math.min(1, vsMsgTimer / 20);
      ctx.fillStyle = vsMsgColor; ctx.font = "bold 50px sans-serif";
      ctx.fillText(vsMsg, W / 2, 150);
      ctx.globalAlpha = 1;
    }

    // 지금 자리 배점
    if (onOff && !vsOver) {
      const d = distToRim();
      const lbl = d < DUNK_RANGE ? "덩크 존 · 2점" : (isThree() ? "3점" : "2점");
      ctx.fillStyle = d < DUNK_RANGE ? "#f3c542" : (isThree() ? "#60a5fa" : "rgba(255,255,255,.5)");
      ctx.font = "bold 16px sans-serif";
      ctx.fillText(lbl + "  ·  " + d.toFixed(2) + "m", W / 2, 118);
    }
    ctx.textAlign = "left";

  function drawVsOver() {
    ctx.fillStyle = "rgba(10,12,16,.86)"; ctx.fillRect(0, 0, W, H);
    const win = vsWinner === "me";
    ctx.textAlign = "center";
    ctx.fillStyle = win ? "#4ade80" : "#ff7a7a";
    ctx.font = "bold 72px sans-serif";
    ctx.fillText(win ? "WIN 🏆" : "LOSE", W / 2, H / 2 - 60);
    ctx.fillStyle = "#e9ecf1"; ctx.font = "bold 44px sans-serif";
    ctx.fillText(myScore + "  :  " + cpuScore, W / 2, H / 2 + 10);
    ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.font = "18px sans-serif";
    ctx.fillText(me().name + "   vs   " + foe().name + "  (" + diff().name + ")", W / 2, H / 2 + 52);
    ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.font = "17px sans-serif";
    ctx.fillText(touchUI ? "화면을 누르면 처음으로" : "SPACE 를 누르면 처음으로", W / 2, H / 2 + 110);
    ctx.textAlign = "left";

  function drawGameOver() {
    if (vsMode) { drawVsOver(); return; }
    ctx.fillStyle = "rgba(10,12,16,.84)"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#9aa3b2"; ctx.font = "20px sans-serif";
    ctx.fillText("GAME OVER", W / 2, H / 2 - 100);
    ctx.fillStyle = "#e9ecf1"; ctx.font = "bold 64px sans-serif";
    ctx.fillText(score + " 점", W / 2, H / 2 - 30);
    ctx.fillStyle = "#9aa3b2"; ctx.font = "19px sans-serif";

                 Math.round(makes / TOTAL_SHOTS * 100) + "%)", W / 2, H / 2 + 10);
    // 상대 선수와 비교

                         : "SPACE 를 누르면 선수 선택으로", W / 2, H / 2 + 134);
    ctx.textAlign = "left";
