<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>농구 슛 게임</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; height: 100dvh;
    background: #0f1115;
    color: #e9ecf1;
    font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  /* 모바일 브라우저 툴바 뒤로 숨지 않도록 보이는 영역에 고정 */
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: #11141a;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    touch-action: none;
    max-width: 100%; max-height: 100%;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1200" height="750"></canvas></div>
<script>
(function () {
  "use strict";

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W = canvas.width;
  const H = canvas.height;              // 세로는 고정 — 코트 투시가 이 값에 맞춰져 있다

  // ===== 코트 (FIBA 하프코트, 단위 m) =====
  // x: 좌우(0 = 중앙),  z: 베이스라인에서의 거리,  y: 높이
  const COURT_W = 15, COURT_L = 10;      // 3점 라인이 모두 들어오는 득점 지역
  const HOOP_Z = 1.575, RIM_H = 3.05, RIM_R = 0.225, TUBE_R = 0.02;
  const BOARD_Z = 1.2, BOARD_W = 1.8, BOARD_BOT = 2.9, BOARD_TOP = 3.95;
  const SQ_W = 0.59, SQ_H = 0.45;
  const THREE_R = 6.75, CORNER_X = 6.6;
  const KEY_W = 4.9, FT_Z = 5.8, FT_R = 1.8, RESTRICT_R = 1.25;
  const BALL_R = 0.1195;

  // ===== 선수 데이터 =====
  // three_pt / two_pt / dunk / speed 는 0~100
  const PLAYERS = {
    jordan: { name: "마이클 조던",      number: 23, three_pt: 75,  two_pt: 97, dunk: 95, speed: 95,
              power: 80, jump: 98, block: 75, steal: 95,
              uniform: "#c8102e", hair: null,      bald: true,  shoe: "#15161a", shoeAccent: "#e03131" },
    lebron: { name: "르브론 제임스",    number: 23, three_pt: 80,  two_pt: 95, dunk: 97, speed: 90,
              power: 98, jump: 92, block: 85, steal: 80,
              uniform: "#552583", hair: "#1a1a1a", bald: false, shoe: "#552583", shoeAccent: "#fdb927" },
    kobe:   { name: "코비 브라이언트",  number: 24, three_pt: 82,  two_pt: 96, dunk: 90, speed: 88,
              power: 78, jump: 90, block: 60, steal: 88,
              uniform: "#f3c542", hair: "#1a1a1a", bald: false, shoe: "#15161a", shoeAccent: "#8a4fd0" },
    curry:  { name: "스테픈 커리",      number: 30, three_pt: 100, two_pt: 85, dunk: 55, speed: 85,
              power: 55, jump: 65, block: 30, steal: 82,
              uniform: "#1d428a", hair: "#6b4423", bald: false, shoe: "#2b63c9", shoeAccent: "#ffd93d" },
    magic:  { name: "매직 존슨",        number: 32, three_pt: 60,  two_pt: 88, dunk: 70, speed: 80,
              power: 85, jump: 75, block: 55, steal: 85,
              uniform: "#ffd93d", hair: "#1a1a1a", bald: false, shoe: "#f2f4f8", shoeAccent: "#8a4fd0" },
    bird:   { name: "래리 버드",        number: 33, three_pt: 92,  two_pt: 94, dunk: 50, speed: 65,
              power: 80, jump: 60, block: 60, steal: 85,
              uniform: "#007a33", hair: "#d9b45b", bald: false, shoe: "#f2f4f8", shoeAccent: "#2aa84a" },
    kareem: { name: "카림 압둘-자바",   number: 33, three_pt: 20,  two_pt: 98, dunk: 88, speed: 55,
              power: 92, jump: 85, block: 98, steal: 45,
              uniform: "#552583", hair: null,      bald: true,  shoe: "#f2f4f8", shoeAccent: "#15161a" }
  };
  const PLAYER_KEYS = ["jordan", "lebron", "kobe", "curry", "magic", "bird", "kareem"];

  let scene = "mode";                   // "mode" → "select" → "play"
  let myKey = "jordan", rivalKey = "lebron";
  let pick = 0;                         // 선수 선택 커서
  let rivalScore = 0;
  const me = () => PLAYERS[myKey];
  const foe = () => PLAYERS[rivalKey];

  // ===== 대결 모드 =====
  let vsMode = false;                   // false = 혼자 10구 연습
  let modePick = 0;                     // 0 연습 / 1 대결
  let diffPick = 1;                     // 0 쉬움 / 1 보통 / 2 어려움
  const DIFFS = [
    { name: "쉬움",   aim: 0.62, react: 0.55, aggr: 0.45, spd: 0.80 },
    { name: "보통",   aim: 0.80, react: 0.78, aggr: 0.70, spd: 0.92 },
    { name: "어려움", aim: 0.97, react: 1.00, aggr: 1.00, spd: 1.00 }
  ];
  const diff = () => DIFFS[diffPick];

  const TARGET_SCORE = 21;              // 21점 선취
  let myScore = 0, cpuScore = 0;
  let possession = "me";                // "me" | "cpu"
  let vsOver = false, vsWinner = null;

  // CPU 선수
  const cpu = { x: 0, z: 4.0, lift: 0, hang: 0, dribPhase: 0, dribSide: 1,
                armsUp: 0, state: "idle", timer: 0, targetX: 0, targetZ: 6.5,
                dunking: false, shotWillMake: false };

  // 수비 액션
  const defense = { blockT: 0, stealT: 0, blockLift: 0 };
  let vsMsg = "", vsMsgTimer = 0, vsMsgColor = "#e9ecf1";
  function say(t, c, f) { vsMsg = t; vsMsgColor = c || "#e9ecf1"; vsMsgTimer = f || 90; }

  // ===== 카메라 (하프코트 전체가 들어오는 방송 중계 앵글) =====
  // 베이스라인(z=0)이 화면 y=250·반폭 330px, 코트 앞단(z=10)이 y=600·반폭 580px 이 되도록 역산
  const CAM_Z = 23.2, CAM_Y = 10.5, FOCAL = 1020.8, HORIZON = -212;
  let CX = W / 2;
  const PANEL_Y = 655;

  // 실제로 보이는 영역(주소창·하단바 제외)에 맞춰 캔버스를 맞춘다
  function fitCanvas() {
    const vv = window.visualViewport;
    const vw = Math.round((vv ? vv.width : window.innerWidth) || 0) || W;
    const vh = Math.round((vv ? vv.height : window.innerHeight) || 0) || H;

    W = Math.round(Math.max(1200, Math.min(1900, H * (vw / vh))));
    canvas.width = W;
    canvas.height = H;
    CX = W / 2;

    // 정렬 박스를 "보이는 영역"에 그대로 맞춘다 (툴바 뒤로 밀려나지 않게)
    const wrap = document.getElementById("wrap");
    if (wrap) {
      wrap.style.left = Math.round(vv ? vv.offsetLeft : 0) + "px";
      wrap.style.top = Math.round(vv ? vv.offsetTop : 0) + "px";
      wrap.style.width = vw + "px";
      wrap.style.height = vh + "px";
    }

    // 표시 크기를 직접 계산 — 어느 쪽도 잘리지 않게
    const scale = Math.min(vw / W, vh / H);
    canvas.style.width = Math.floor(W * scale) + "px";
    canvas.style.height = Math.floor(H * scale) + "px";
  }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", () => setTimeout(fitCanvas, 150));
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fitCanvas);
    window.visualViewport.addEventListener("scroll", fitCanvas);
  }

  function proj(x, y, z) {
    const s = FOCAL / (CAM_Z - z);
    return { x: CX + s * x, y: HORIZON + s * (CAM_Y - y), s: s };
  }

  // ===== 선수 =====
  const RELEASE_H = 2.5;                 // 점프슛 릴리스 높이
  const REACH = 2.30;                    // 스탠딩 리치
  const PLAYER_MIN_X = -7, PLAYER_MAX_X = 7;
  const PLAYER_MIN_Z = 0.5, PLAYER_MAX_Z = 9.5;
  const BASE_MOVE_SPEED = 4.2 / 60;      // speed 100 기준 초당 4.2m
  // speed 100 = 기본 속도, 50 = 그 절반
  const moveSpeed = () => BASE_MOVE_SPEED * (me().speed / 100);
  const DUNK_RANGE = 1.7;
  const DUNK_SPOT = { x: 0, z: HOOP_Z + RIM_R };   // 림 앞쪽 가장자리 바로 아래
  const GRAB_H = RIM_H - REACH;          // 림을 잡으려면 필요한 점프 높이

  // ===== 물리 =====
  const FPS = 60, STEP_MS = 1000 / FPS;
  const G = 9.8 / (FPS * FPS);           // m/frame²
  const AIR = 0.999;
  const BOUNCE = 0.55, RIM_BOUNCE = 0.62;
  const SHOT_ANGLE = 54 * Math.PI / 180;
  const TOTAL_SHOTS = 10;
  const SHOT_TIMEOUT = FPS * 7;

  // ===== 게이지 =====
  const CHARGE_RATE = 170 / FPS;         // 초당 170% — 짧게 눌러도 찬다
  const BAND_CENTER = 0.55;              // 성공 구간 중심이 놓일 게이지 위치
  const SPEED_LO = 0.05, SPEED_HI = 0.36; // 탐색 범위 (m/frame)

  // 성공 구간 폭 = 거리(멀수록 좁음) × 능력치(높을수록 넓음)
  // 3점 라인 밖이면 three_pt, 안이면 two_pt 를 쓴다
  function bandFrac(d, three) {
    const base = Math.max(0.17, Math.min(0.34, 0.34 - 0.014 * d));
    const stat = three ? me().three_pt : me().two_pt;
    return Math.max(0.09, Math.min(0.45, base * (0.40 + 0.009 * stat)));
  }

  const RISE_F = 22, DROP_F = 26, HANG_MAX = 150, HANG_AFTER_SCORE = 26;

  // ===== 상태 =====
  const player = { x: 0, z: FT_Z };
  // 공은 "슛 라인 위의 부호 있는 거리 p" + 높이 y 로 움직인다 (방향은 항상 림)
  const ball = { p: 0, y: 0, vp: 0, vy: 0, dx: 0, dz: 1, rot: 0, live: false, scored: false };

  let shots = 0, score = 0, makes = 0;
  let shotValue = 2, shotIsDunk = false;
  let message = "", messageColor = "#ff7a7a", messageTimer = 0;
  let rimFlash = 0, settleTimer = 0, shotTimer = 0;
  let gameOver = false;

  let charging = false, power = 0, powerDir = 1, lastPower = null;
  const keys = { L: false, R: false, U: false, D: false };

  // 드리블 / 팔 자세
  const DRIB_PERIOD = 26;                // 한 번 튀는 데 걸리는 프레임
  const DRIB_HAND_H = 0.95;              // 드리블하는 손 높이
  let armsUp = 0;                        // 0 = 팔 내림, 1 = 슛 자세
  let dribPhase = 0, dribSide = 1, dribbling = false, moving = false;

  const dunk = { active: false, phase: "rise", t: 0, fromX: 0, fromZ: 0,
                 x: 0, z: 0, lift: 0, dropFrom: 0, hang: 0, released: false, afterScore: 0 };

  const hoopDist = (x, z) => Math.hypot(x - 0, z - HOOP_Z);
  const distToRim = () => hoopDist(player.x, player.z);
  const inDunkRange = () => distToRim() < DUNK_RANGE;
  // 코너는 직선(6.6m), 그 위는 아크(6.75m) — 코트에 그려진 선과 같은 판정
  const CORNER_Z = HOOP_Z + THREE_R * Math.cos(Math.asin(CORNER_X / THREE_R));
  const isThreeAt = (x, z) => z <= CORNER_Z
    ? Math.abs(x) >= CORNER_X
    : hoopDist(x, z) >= THREE_R;
  const isThree = () => isThreeAt(player.x, player.z);

  // ===== 물리: 슛 평면 (p, y) 에서 한 스텝 =====
  function advance(o) {
    const prevY = o.y, prevP = o.p;

    o.vy -= G;
    o.vp *= AIR; o.vy *= AIR;
    o.p += o.vp;
    o.y += o.vy;
    o.rot += 0.06;

    // 득점: 림 높이를 위에서 아래로 통과 + 림 안쪽
    if (!o.scored && o.vy < 0 && prevY >= RIM_H && o.y < RIM_H && Math.abs(o.p) < RIM_R) {
      o.scored = true;
    }

    // 림 링과의 충돌 (링까지의 최단거리로 판정)
    const sgn = o.p >= 0 ? 1 : -1;
    const dh = Math.abs(o.p) - RIM_R, dy = o.y - RIM_H;
    const len = Math.hypot(dh, dy), min = BALL_R + TUBE_R;
    if (len > 0 && len < min) {
      const np = sgn * dh / len, ny = dy / len;
      o.p = sgn * RIM_R + np * min;
      o.y = RIM_H + ny * min;
      const dot = o.vp * np + o.vy * ny;
      o.vp = (o.vp - 2 * dot * np) * RIM_BOUNCE;
      o.vy = (o.vy - 2 * dot * ny) * RIM_BOUNCE;
    }

    // 백보드 앞면 (림 중심에서 뒤로 0.375m)
    const boardP = -(HOOP_Z - BOARD_Z);
    if (o.y > BOARD_BOT && o.y < BOARD_TOP &&
        o.p - BALL_R <= boardP && prevP - BALL_R > boardP) {
      o.p = boardP + BALL_R;
      o.vp = Math.abs(o.vp) * BOUNCE;
    }

    // 바닥
    if (o.y - BALL_R < 0) {
      o.y = BALL_R;
      o.vy = -o.vy * BOUNCE;
      o.vp *= 0.82;
      if (Math.abs(o.vy) < 0.02) o.vy = 0;
    }
  }

  // ===== 성공 강도 구간 탐색 =====
  function simulate(speed, D) {
    const o = { p: D, y: RELEASE_H, vp: -Math.cos(SHOT_ANGLE) * speed,
                vy: Math.sin(SHOT_ANGLE) * speed, rot: 0, scored: false };
    for (let f = 0; f < 300; f++) {
      advance(o);
      if (o.scored) return true;
      if (o.y - BALL_R <= 0.001) return false;
    }
    return false;
  }

  function findBand(D) {
    const STEP = 0.0015;
    let best = null, cur = null;
    for (let sp = SPEED_LO; sp <= SPEED_HI; sp += STEP) {
      if (simulate(sp, D)) {
        if (cur) cur.hi = sp; else cur = { lo: sp, hi: sp };
      } else if (cur) {
        if (!best || cur.hi - cur.lo > best.hi - best.lo) best = cur;
        cur = null;
      }
    }
    if (cur && (!best || cur.hi - cur.lo > best.hi - best.lo)) best = cur;
    return best;
  }

  // 게이지는 매 위치마다 성공 구간이 정해진 자리에 오도록 자동 보정된다
  let gauge = { lo: 0.1, hi: 0.3, bandLo: 45, bandHi: 65 };
  let bandDirty = true;

  function refreshBand() {
    bandDirty = false;
    if (inDunkRange()) { gauge = null; return; }
    const D = distToRim();
    const b = findBand(D);
    if (!b) { gauge = null; return; }
    const frac = bandFrac(D, isThree());
    const mid = (b.lo + b.hi) / 2;
    const span = (b.hi - b.lo) / frac;
    const lo = mid - span * BAND_CENTER;
    gauge = {
      lo: lo, hi: lo + span,
      bandLo: (b.lo - lo) / span * 100,
      bandHi: (b.hi - lo) / span * 100
    };
  }

  const speedOf = (p) => gauge.lo + (gauge.hi - gauge.lo) * (p / 100);

  // ===== 입력 =====
  function keyOf(e) {
    const c = e.code, k = (e.key || "").toLowerCase();
    if (c === "ArrowLeft" || k === "a") return "L";
    if (c === "ArrowRight" || k === "d") return "R";
    if (c === "ArrowUp" || k === "w") return "U";
    if (c === "ArrowDown" || k === "s") return "D";
    return null;
  }
  const isSpace = (e) => e.code === "Space" || e.key === " ";
  const busy = () => ball.live || charging || dunk.active;

  // 키보드와 터치가 같은 함수를 쓴다
  function pressShoot() {
    if (gameOver) { scene = "mode"; return; }     // 끝나면 처음 화면으로
    // 대결 모드 수비 중이면 블락 점프 (판정은 CPU 가 슛하는 순간)
    if (vsMode && possession === "cpu" && checkT <= 0) {
      if (defense.blockT <= 0) defense.blockT = 24;
      return;
    }
    if (vsMode && (checkT > 0 || possession !== "me")) return;
    if (busy()) return;
    if (inDunkRange()) { launch(null); return; }   // 덩크는 누르는 즉시
    if (!gauge) return;
    charging = true; power = 0; powerDir = 1;
  }
  // 스틸 시도 (수비 중에만)
  function pressSteal() {
    if (!vsMode || possession !== "cpu" || checkT > 0 || vsOver) return;
    if (defense.stealT > 0) return;               // 연타 방지
    defense.stealT = 26;
  }

  function releaseShoot() {
    if (!charging) return;
    charging = false;
    if (power < 4) return;
    launch(power);
  }

  window.addEventListener("keydown", (e) => {
    // 모드 / 난이도 화면
    if (scene === "mode") {
      const mk = keyOf(e);
      if (mk === "L" || mk === "R") {
        e.preventDefault();
        if (modePick === 1) diffPick = Math.max(0, Math.min(2, diffPick + (mk === "R" ? 1 : -1)));
        return;
      }
      if (mk === "U") { e.preventDefault(); modePick = 0; return; }
      if (mk === "D") { e.preventDefault(); modePick = 1; return; }
      if (isSpace(e) || e.key === "Enter") {
        e.preventDefault(); vsMode = modePick === 1; scene = "select";
      }
      return;
    }
    // 수비 중 스틸
    if (scene === "play" && (e.key === "Shift" || e.code === "ShiftLeft" || e.code === "ShiftRight")) {
      e.preventDefault(); pressSteal(); return;
    }
    // 선수 선택 화면
    if (scene === "select") {
      const mk = keyOf(e);
      if (mk === "L") { e.preventDefault(); pick = (pick + PLAYER_KEYS.length - 1) % PLAYER_KEYS.length; return; }
      if (mk === "R") { e.preventDefault(); pick = (pick + 1) % PLAYER_KEYS.length; return; }
      if (isSpace(e) || e.key === "Enter") { e.preventDefault(); confirmPick(); }
      return;
    }
    const mk = keyOf(e);
    if (mk) { e.preventDefault(); if (!busy() && !gameOver) keys[mk] = true; return; }
    if (!isSpace(e)) return;
    e.preventDefault();
    if (e.repeat) return;
    pressShoot();
  });

  window.addEventListener("keyup", (e) => {
    const mk = keyOf(e);
    if (mk) { keys[mk] = false; return; }
    if (!isSpace(e)) return;
    e.preventDefault();
    releaseShoot();
  });

  // ===== 터치 조작 (왼쪽 조이스틱 / 오른쪽 슛 버튼) =====
  // 터치 기기면 누르기 전부터 조작 UI를 보여준다
  let touchUI = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
  const JOY_MAX = 110;
  const joy = { id: null, ox: 0, oy: 0, x: 0, z: 0, active: false };
  let shootId = null;

  const joyHome = () => ({ x: 185, y: H - 120 });
  const shootHome = () => ({ x: W - 175, y: H - 120 });
  const stealHome = () => ({ x: W - 330, y: H - 150 });

  function canvasPt(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width),
             y: (e.clientY - r.top) * (H / r.height) };
  }

  canvas.addEventListener("pointerdown", (e) => {
    touchUI = true;            // 한 번이라도 화면을 누르면 조작 UI를 띄운다
    e.preventDefault();
    const p = canvasPt(e);

    // 모드 화면
    if (scene === "mode") {
      for (let i = 0; i < 2; i++) {
        const b = modeBox(i);
        if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
          if (modePick === i) { vsMode = i === 1; scene = "select"; } else modePick = i;
          return;
        }
      }
      if (modePick === 1) for (let i = 0; i < 3; i++) {
        const b = diffBox(i);
        if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { diffPick = i; return; }
      }
      return;
    }

    // 선수 선택 화면: 카드를 누르면 선택, 고른 카드를 한 번 더 누르면 시작
    if (scene === "select") {
      for (let i = 0; i < PLAYER_KEYS.length; i++) {
        const b = cardBox(i);
        if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
          if (pick === i) confirmPick(); else pick = i;
          return;
        }
      }
      return;
    }

    if (gameOver) { scene = "mode"; return; }

    // 수비 중에는 오른쪽 아래 작은 버튼이 스틸
    if (vsMode && possession === "cpu" && !vsOver) {
      const sb = stealHome();
      if (Math.hypot(p.x - sb.x, p.y - sb.y) < 74) { pressSteal(); return; }
    }

    if (p.x > W / 2) {                       // 오른쪽 절반 = 슛 / 블락
      if (shootId === null) { shootId = e.pointerId; pressShoot(); }
    } else if (joy.id === null) {            // 왼쪽 절반 = 이동
      joy.id = e.pointerId; joy.ox = p.x; joy.oy = p.y;
      joy.x = 0; joy.z = 0; joy.active = true;
    }
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
  });

  canvas.addEventListener("pointermove", (e) => {
    if (e.pointerId !== joy.id) return;
    const p = canvasPt(e);
    let dx = p.x - joy.ox, dy = p.y - joy.oy;
    const len = Math.hypot(dx, dy);
    if (len > JOY_MAX) { dx = dx / len * JOY_MAX; dy = dy / len * JOY_MAX; }
    if (len < 16) { dx = 0; dy = 0; }
    joy.x = dx / JOY_MAX;                    // 화면 오른쪽 = +x
    joy.z = dy / JOY_MAX;                    // 화면 아래 = z 증가(림에서 멀어짐)
  });

  function endPointer(e) {
    if (e.pointerId === joy.id) { joy.id = null; joy.active = false; joy.x = 0; joy.z = 0; }
    if (e.pointerId === shootId) { shootId = null; releaseShoot(); }
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  // ===== 발사 =====
  function launch(p) {
    shots++;
    shooter = "me";                        // 대결 모드에서 득점 주체
    shotIsDunk = inDunkRange();
    if (!shotIsDunk) lastPower = p;
    shotValue = shotIsDunk ? 2 : (isThree() ? 3 : 2);

    if (shotIsDunk) {
      dunk.active = true; dunk.phase = "rise"; dunk.t = 0;
      dunk.fromX = player.x; dunk.fromZ = player.z;
      dunk.x = player.x; dunk.z = player.z;
      dunk.lift = 0; dunk.hang = 0; dunk.released = false; dunk.afterScore = 0;
      dunk.success = Math.random() * 100 < me().dunk;   // 덩크 능력치 = 성공 확률
      player.x = DUNK_SPOT.x; player.z = DUNK_SPOT.z;
      bandDirty = true;
      ball.live = false; ball.scored = false;
      settleTimer = 0; shotTimer = 0;
      return;
    }

    // 방향은 항상 림을 향한다 — 플레이어는 강도만 맞추면 된다
    const D = distToRim();
    ball.dx = (player.x - 0) / D;
    ball.dz = (player.z - HOOP_Z) / D;
    ball.p = D;
    ball.y = RELEASE_H;
    const speed = speedOf(p);
    ball.vp = -Math.cos(SHOT_ANGLE) * speed;
    ball.vy = Math.sin(SHOT_ANGLE) * speed;
    ball.rot = 0;
    ball.live = true; ball.scored = false;
    settleTimer = 0; shotTimer = 0;
  }

  // 덩크 점프 정점 — 점프 스탯이 높을수록 림 위로 더 뜬다.
  // 실패한 덩크는 림에 손이 닿지 않는 높이까지만 뛴다.
  function dunkApex(p, success) {
    if (!success) return GRAB_H * (0.50 + 0.40 * (p.jump / 100));
    return GRAB_H + 0.05 + 0.28 * (p.jump / 100);
  }

  function dunkHand() {       // drawPlayer 의 오른손 위치와 같은 값
    return { x: dunk.x + 0.14, y: REACH + dunk.lift, z: dunk.z };
  }

  function slam() {
    dunk.released = true;
    ball.dx = 0; ball.dz = 1;
    ball.rot = 0; ball.live = true; ball.scored = false;
    settleTimer = 0; shotTimer = 0;

    if (dunk.success) {
      ball.p = 0.06; ball.y = RIM_H + BALL_R + 0.06;
      ball.vp = -0.012; ball.vy = -0.08;
      message = "DUNK!"; messageColor = "#4ade80"; messageTimer = 110;
    } else {
      // 림에 튕겨 나온다
      ball.p = RIM_R + BALL_R * 0.5; ball.y = RIM_H + BALL_R * 1.2;
      ball.vp = 0.028; ball.vy = -0.03;
    }
  }

  function reset() {
    shots = 0; score = 0; makes = 0; gameOver = false;
    message = ""; messageTimer = 0; rimFlash = 0; lastPower = null;
    rivalScore = simulateRival();
    player.x = 0; player.z = FT_Z;
    dunk.active = false; dunk.lift = 0; dunk.hang = 0;
    bandDirty = true;
    newBall();
  }

  function newBall() {
    ball.live = false; ball.scored = false;
    ball.p = 0; ball.y = RELEASE_H; ball.vp = 0; ball.vy = 0; ball.rot = 0;
    settleTimer = 0; shotTimer = 0;
  }

  function endShot() {
    if (vsMode) { vsEndShot(); return; }
    if (ball.scored) {
      makes++; score += shotValue;
    } else if (shotIsDunk) {
      message = "덩크 실패!"; messageColor = "#ff9a5c"; messageTimer = 75;
    } else if (gauge) {
      const mid = (gauge.bandLo + gauge.bandHi) / 2;
      const diff = lastPower - mid;
      message = (Math.abs(diff) < 14 ? "아깝다! 조금 " : "너무 ") + (diff < 0 ? "약해요" : "강해요");
      messageColor = "#ff9a5c"; messageTimer = 75;
    } else {
      message = "MISS"; messageColor = "#ff7a7a"; messageTimer = 70;
    }

    if (shots >= TOTAL_SHOTS) { gameOver = true; ball.live = false; }
    else newBall();
  }

  function stepDunk() {
    dunk.t++;
    if (dunk.phase === "rise") {
      const p = Math.min(1, dunk.t / RISE_F);
      const ease = 1 - Math.pow(1 - p, 2);
      dunk.x = dunk.fromX + (DUNK_SPOT.x - dunk.fromX) * ease;
      dunk.z = dunk.fromZ + (DUNK_SPOT.z - dunk.fromZ) * ease;
      // 점프 스탯이 높을수록 더 높이 뜬다. 실패하면 림에 손이 못 닿는다
      dunk.lift = dunkApex(me(), dunk.success) * Math.sin(p * Math.PI / 2);
      if (dunk.t >= RISE_F) {
        slam();
        dunk.phase = dunk.success ? "hang" : "drop";   // 실패하면 매달리지 않는다
        dunk.dropFrom = dunk.lift; dunk.t = 0;
      }
      return;
    }
    if (dunk.phase === "hang") {
      dunk.x = DUNK_SPOT.x; dunk.z = DUNK_SPOT.z;
      dunk.lift += (GRAB_H - dunk.lift) * 0.25;
      dunk.hang += (1 - dunk.hang) * 0.12;
      if (ball.scored) dunk.afterScore++;
      if (dunk.afterScore > HANG_AFTER_SCORE || dunk.t > HANG_MAX) {
        dunk.phase = "drop"; dunk.dropFrom = dunk.lift; dunk.t = 0;
      }
      return;
    }
    const p = Math.min(1, dunk.t / DROP_F);
    dunk.lift = dunk.dropFrom * (1 - p * p);
    dunk.hang += (0 - dunk.hang) * 0.2;
    if (dunk.t >= DROP_F) { dunk.active = false; dunk.lift = 0; dunk.hang = 0; }
  }

  function step() {
    moving = false;
    if (vsMode) vsStep();
    if (!busy() && !gameOver) {
      // 조이스틱이 잡혀 있으면 그쪽이 우선 (기울인 만큼 속도도 비례)
      let mx = joy.active ? joy.x : (keys.R ? 1 : 0) - (keys.L ? 1 : 0);
      let mz = joy.active ? joy.z : (keys.D ? 1 : 0) - (keys.U ? 1 : 0);
      const mag = Math.hypot(mx, mz);
      if (mag > 0.02) {
        const sp = moveSpeed() * Math.min(1, mag);
        const ux = mx / mag, uz = mz / mag;
        player.x = Math.max(PLAYER_MIN_X, Math.min(PLAYER_MAX_X, player.x + ux * sp));
        player.z = Math.max(PLAYER_MIN_Z, Math.min(PLAYER_MAX_Z, player.z + uz * sp));
        bandDirty = true;
        moving = true;
        if (Math.abs(ux) > 0.25) dribSide = ux > 0 ? 1 : -1;   // 오른쪽=오른손, 왼쪽=왼손
      }
    }
    if (bandDirty && !keys.L && !keys.R && !keys.U && !keys.D && !dunk.active) refreshBand();

    if (dunk.active) stepDunk();
    if (!ball.live) return;

    const was = ball.scored;
    advance(ball);
    shotTimer++;

    if (ball.scored && !was) {
      if (!shotIsDunk) {
        message = shotValue === 3 ? "3 POINTS!" : "GOAL!";
        messageColor = shotValue === 3 ? "#60a5fa" : "#4ade80";
        messageTimer = 75;
      }
      rimFlash = 45;
    }

    const resting = ball.y - BALL_R <= 0.01 && Math.abs(ball.vy) < 0.025 && Math.abs(ball.vp) < 0.015;
    settleTimer = resting ? settleTimer + 1 : 0;
    if (settleTimer > 25 || shotTimer > SHOT_TIMEOUT) { ball.live = false; endShot(); }
  }

  // 공의 3D 위치 (그리기용)
  function ballPos() {
    return { x: ball.dx * ball.p, y: ball.y, z: HOOP_Z + ball.dz * ball.p };
  }

  // ===== 그리기 =====
  const RIM_ORANGE = [255, 107, 44], RIM_GREEN = [52, 230, 120];
  const SKIN = "#d9a273", SKIN_DK = "#b8835a";
  const JERSEY = "#f3c542", JERSEY_DK = "#c99c22", TRIM = "#5b2d8e";
  const mix = (a, b, t) => "rgb(" + Math.round(a[0] + (b[0] - a[0]) * t) + "," +
    Math.round(a[1] + (b[1] - a[1]) * t) + "," + Math.round(a[2] + (b[2] - a[2]) * t) + ")";
  const lerpPt = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });

  // "#rrggbb" 를 밝기 k 배로
  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.min(255, Math.round((n >> 16 & 255) * k));
    const g = Math.min(255, Math.round((n >> 8 & 255) * k));
    const b = Math.min(255, Math.round((n & 255) * k));
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  function pathPts(pts, close) {
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const q = proj(pts[i][0], pts[i][2] || 0, pts[i][1]);
      if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
    }
    if (close) ctx.closePath();
  }
  function arcPts(cx, cz, r, a0, a1, n) {
    const out = [];
    for (let i = 0; i <= n; i++) {
      const t = a0 + (a1 - a0) * i / n;
      out.push([cx + r * Math.sin(t), cz + r * Math.cos(t)]);
    }
    return out;
  }

  function drawCourt() {
    const g = ctx.createLinearGradient(0, 0, 0, PANEL_Y);
    g.addColorStop(0, "#161a23");
    g.addColorStop(1, "#0f1218");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, PANEL_Y);

    // 마루
    pathPts([[-COURT_W / 2, 0], [COURT_W / 2, 0], [COURT_W / 2, COURT_L], [-COURT_W / 2, COURT_L]], true);
    const fg = ctx.createLinearGradient(0, 250, 0, 610);
    fg.addColorStop(0, "#9a6530");
    fg.addColorStop(1, "#7d4f24");
    ctx.fillStyle = fg;
    ctx.fill();

    ctx.lineJoin = "round";
    const LINE = "rgba(255,255,255,.8)";

    // 페인트존
    pathPts([[-KEY_W / 2, 0], [KEY_W / 2, 0], [KEY_W / 2, FT_Z], [-KEY_W / 2, FT_Z]], true);
    ctx.fillStyle = "rgba(190,110,50,.45)";
    ctx.fill();
    ctx.strokeStyle = LINE; ctx.lineWidth = 2.5; ctx.stroke();

    // 3점 라인 (코너 직선 + 아크)
    const tMax = Math.asin(CORNER_X / THREE_R);
    const cz = HOOP_Z + THREE_R * Math.cos(tMax);
    ctx.strokeStyle = "#dbe6ff"; ctx.lineWidth = 3;
    pathPts([[-CORNER_X, 0], [-CORNER_X, cz]]); ctx.stroke();
    pathPts([[CORNER_X, 0], [CORNER_X, cz]]); ctx.stroke();
    pathPts(arcPts(0, HOOP_Z, THREE_R, -tMax, tMax, 48)); ctx.stroke();

    // 자유투 서클 / 제한구역
    ctx.strokeStyle = LINE; ctx.lineWidth = 2.5;
    pathPts(arcPts(0, FT_Z, FT_R, 0, Math.PI * 2, 40), true); ctx.stroke();
    pathPts(arcPts(0, HOOP_Z, RESTRICT_R, -Math.PI / 2, Math.PI / 2, 24)); ctx.stroke();

    // 외곽선
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3;
    pathPts([[-COURT_W / 2, 0], [COURT_W / 2, 0], [COURT_W / 2, COURT_L], [-COURT_W / 2, COURT_L]], true);
    ctx.stroke();

    // 선수 발밑 표시 (2점/3점/덩크)
    if (!dunk.active) {
      const d = distToRim();
      const col = d < DUNK_RANGE ? "rgba(243,197,66,.9)"
                : (isThree() ? "rgba(96,165,250,.9)" : "rgba(255,255,255,.5)");
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      pathPts(arcPts(player.x, player.z, 0.55, 0, Math.PI * 2, 24), true);
      ctx.stroke();
    }
  }

  function drawHoop() {
    const flash = Math.min(1, rimFlash / 30);
    const sag = dunk.active && dunk.phase === "hang" ? 0.05 * dunk.hang : 0;

    // 지지대
    const base = proj(0, 0, -0.9), top = proj(0, BOARD_TOP + 0.1, -0.9);
    ctx.strokeStyle = "#5a6070"; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(top.x, top.y); ctx.stroke();
    const arm0 = proj(0, (BOARD_BOT + BOARD_TOP) / 2, -0.9);
    const arm1 = proj(0, (BOARD_BOT + BOARD_TOP) / 2, BOARD_Z);
    ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(arm0.x, arm0.y); ctx.lineTo(arm1.x, arm1.y); ctx.stroke();

    // 백보드
    pathPts([[-BOARD_W / 2, BOARD_Z, BOARD_TOP], [BOARD_W / 2, BOARD_Z, BOARD_TOP],
             [BOARD_W / 2, BOARD_Z, BOARD_BOT], [-BOARD_W / 2, BOARD_Z, BOARD_BOT]], true);
    ctx.fillStyle = "rgba(226,234,248,.92)"; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 2; ctx.stroke();

    pathPts([[-SQ_W / 2, BOARD_Z, RIM_H + SQ_H], [SQ_W / 2, BOARD_Z, RIM_H + SQ_H],
             [SQ_W / 2, BOARD_Z, RIM_H], [-SQ_W / 2, BOARD_Z, RIM_H]], true);
    ctx.strokeStyle = flash > 0 ? mix([207, 58, 58], RIM_GREEN, flash) : "#cf3a3a";
    ctx.lineWidth = 3; ctx.stroke();

    // 네트
    ctx.strokeStyle = flash > 0
      ? "rgba(" + Math.round(140 + 90 * flash) + ",255," + Math.round(170 + 50 * flash) + ",.75)"
      : "rgba(255,255,255,.5)";
    ctx.lineWidth = 1.3;
    for (let i = 0; i < 12; i++) {
      const t = i / 12 * Math.PI * 2;
      const a = proj(RIM_R * Math.sin(t), RIM_H - sag, HOOP_Z + RIM_R * Math.cos(t));
      const b = proj(RIM_R * 0.55 * Math.sin(t), RIM_H - 0.4 - sag, HOOP_Z + RIM_R * 0.55 * Math.cos(t));
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    for (let j = 1; j <= 3; j++) {
      const k = 1 - j * 0.15, hh = RIM_H - 0.4 * (j / 3) - sag;
      pathPts(arcPts(0, HOOP_Z, RIM_R * k, 0, Math.PI * 2, 20).map(p => [p[0], p[1], hh]), true);
      ctx.stroke();
    }

    // 림
    if (flash > 0) { ctx.shadowColor = "rgba(52,230,120,.9)"; ctx.shadowBlur = 20; }
    ctx.strokeStyle = flash > 0 ? mix(RIM_ORANGE, RIM_GREEN, flash) : "rgb(255,107,44)";
    ctx.lineWidth = 5;
    pathPts(arcPts(0, HOOP_Z, RIM_R, 0, Math.PI * 2, 28).map(p => [p[0], p[1], RIM_H - sag]), true);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // ---- 선수 (뒷모습) ----
  // 내 선수와 CPU 가 같은 그리기 코드를 쓴다
  function drawPlayer(st) {
    st = st || {
      x: dunk.active ? dunk.x : player.x,
      z: dunk.active ? dunk.z : player.z,
      lift: dunk.active ? dunk.lift : 0,
      hang: dunk.active ? dunk.hang : 0,
      dunkMode: dunk.active,
      armsUp: armsUp, dribbling: dribbling, dribPhase: dribPhase, dribSide: dribSide,
      data: me()
    };
    const px = st.x, pz = st.z, lift = st.lift;
    const s = FOCAL / (CAM_Z - pz);
    const P = (dx, h) => proj(px + dx, h + lift, pz);
    const lw = (m) => Math.max(1.5, s * m);

    function limb(pts, m, color) {
      ctx.strokeStyle = color; ctx.lineWidth = lw(m);
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
    }

    // 그림자
    const sh = proj(px, 0, pz);
    const shr = s * 0.42 * (1 - Math.min(0.55, lift / 1.6));
    ctx.fillStyle = "rgba(0,0,0,.33)";
    ctx.beginPath(); ctx.ellipse(sh.x, sh.y, shr, shr * 0.34, 0, 0, Math.PI * 2); ctx.fill();

    ctx.lineCap = "round"; ctx.lineJoin = "round";

    const hang = st.hang, dunkMode = st.dunkMode;

    // 관절 (m)
    const footY = dunkMode ? (0.30 - 0.26 * hang) : 0.25;
    const hipY = 0.98, shoY = 1.55, headY = 1.76;

    const hipL = P(-0.13, hipY), hipR = P(0.13, hipY);
    const shoL = P(-0.21, shoY), shoR = P(0.21, shoY);
    const hd = P(0, headY), headR = Math.max(3, s * 0.115);

    const kneeL = P(-0.17, hipY - (dunkMode ? 0.42 - 0.04 * hang : 0.36));
    const kneeR = P(0.17, hipY - (dunkMode ? 0.40 - 0.04 * hang : 0.34));
    const footL = P(-0.19, footY), footR = P(0.19, footY);

    // 선수별 색
    const P0 = st.data;
    const UNI = P0.uniform, UNI_DK = shade(UNI, 0.78);

    // 다리
    limb([hipL, kneeL, footL], 0.1, SKIN);
    limb([hipR, kneeR, footR], 0.1, SKIN);

    // 운동화 (기본색 + 포인트)
    [footL, footR].forEach((f) => {
      ctx.strokeStyle = P0.shoe; ctx.lineWidth = lw(0.095);
      ctx.beginPath(); ctx.moveTo(f.x - s * 0.055, f.y); ctx.lineTo(f.x + s * 0.055, f.y); ctx.stroke();
      ctx.strokeStyle = P0.shoeAccent; ctx.lineWidth = Math.max(1, lw(0.035));
      ctx.beginPath(); ctx.moveTo(f.x - s * 0.05, f.y + s * 0.04); ctx.lineTo(f.x + s * 0.05, f.y + s * 0.04); ctx.stroke();
    });

    // 반바지 + 몸통
    limb([hipL, hipR], 0.26, UNI_DK);
    limb([P(-0.1, hipY), P(-0.14, hipY - 0.26)], 0.17, UNI_DK);
    limb([P(0.1, hipY), P(0.14, hipY - 0.26)], 0.17, UNI_DK);
    limb([P(0, hipY), P(0, shoY)], 0.40, UNI);
    limb([shoL, shoR], 0.30, UNI);

    // 유니폼 등번호
    const numP = P(0, hipY + 0.34);
    const fs = Math.max(7, s * 0.26);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold " + fs.toFixed(0) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(P0.number), numP.x, numP.y + fs * 0.35);
    ctx.textAlign = "left";

    // 팔
    if (dunkMode) {
      // 오른팔로 림을 잡는다 (손끝이 림 높이)
      const elbowR = P(0.20, shoY + 0.34);
      const handR = P(0.14, REACH);
      const elbowL = P(-0.26, shoY - 0.18);
      const handL = P(-0.30, shoY - 0.52);
      limb([shoL, elbowL, handL], 0.085, SKIN_DK);
      limb([shoR, elbowR, handR], 0.095, SKIN);
    } else {
      const u = st.armsUp;
      // 드리블하는 손은 공 바로 위에서 같이 오르내린다
      const dribH = st.dribbling
        ? DRIB_HAND_H + 0.12 * Math.abs(Math.cos(Math.PI * st.dribPhase)) - 0.06
        : DRIB_HAND_H;
      const rightDrib = st.dribSide > 0;

      const downEL = P(-0.27, 1.26), downER = P(0.27, 1.26);
      const downHL = P(rightDrib ? -0.26 : -0.34, rightDrib ? 1.0 : dribH);
      const downHR = P(rightDrib ? 0.34 : 0.26, rightDrib ? dribH : 1.0);

      const upEL = P(-0.22, shoY + 0.30), upER = P(0.22, shoY + 0.30);
      const upHL = P(-0.13, 2.18), upHR = P(0.13, 2.18);

      limb([shoL, lerpPt(downEL, upEL, u), lerpPt(downHL, upHL, u)], 0.085, SKIN_DK);
      limb([shoR, lerpPt(downER, upER, u), lerpPt(downHR, upHR, u)], 0.095, SKIN);
    }

    // 목 + 머리 (뒷모습이라 뒤통수). 대머리면 머리카락을 그리지 않는다
    limb([P(0, shoY), P(0, headY - 0.09)], 0.08, SKIN);
    ctx.fillStyle = SKIN;
    ctx.beginPath(); ctx.arc(hd.x, hd.y, headR, 0, Math.PI * 2); ctx.fill();
    if (!P0.bald && P0.hair) {
      ctx.fillStyle = P0.hair;
      ctx.beginPath(); ctx.arc(hd.x, hd.y - headR * 0.12, headR * 0.96, 0, Math.PI * 2); ctx.fill();
    }

    ctx.lineCap = "butt"; ctx.lineJoin = "miter";
  }

  function drawBall() {
    let b;
    if (dunk.active && !dunk.released) {
      const h = dunkHand();
      b = { x: h.x + 0.1, y: h.y + 0.14, z: h.z };
    } else if (!ball.live && !dunk.active) {
      b = heldBallPos();
    } else {
      b = ballPos();
    }

    const q = proj(b.x, b.y, b.z);
    const r = Math.max(3, q.s * BALL_R);

    if (q.y + r < 0) {
      ctx.fillStyle = "rgba(240,154,74,.9)";
      ctx.beginPath(); ctx.moveTo(q.x, 6); ctx.lineTo(q.x - 9, 22); ctx.lineTo(q.x + 9, 22);
      ctx.closePath(); ctx.fill();
      return;
    }

    ctx.save();
    ctx.translate(q.x, q.y);
    ctx.rotate(ball.rot);
    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
    g.addColorStop(0, "#f09a4a"); g.addColorStop(1, "#d2641d");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(40,20,5,.75)"; ctx.lineWidth = Math.max(0.8, r * 0.09);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.5, r, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  function drawGauge() {
    const gw = 230, gh = 24;
    const gx = (W - gw) / 2, gy = PANEL_Y + 34;

    if (inDunkRange() && !ball.live) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#f3c542";
      ctx.font = "bold 20px sans-serif";
      ctx.fillText(touchUI ? "왼쪽 끌어 이동   ·   오른쪽 버튼 누르면 바로 덩크!"
                           : "방향키 이동   ·   SPACE 누르면 바로 덩크!", W / 2, gy + 18);
      ctx.textAlign = "left";
      return;
    }

    ctx.fillStyle = "rgba(255,255,255,.12)";
    ctx.fillRect(gx, gy, gw, gh);

    if (gauge) {
      const x0 = gx + gw * gauge.bandLo / 100, x1 = gx + gw * gauge.bandHi / 100;
      ctx.fillStyle = "rgba(74,222,128,.38)";
      ctx.fillRect(x0, gy, x1 - x0, gh);
    }
    if (lastPower !== null) {
      ctx.fillStyle = "rgba(255,255,255,.75)";
      ctx.fillRect(gx + gw * lastPower / 100 - 1, gy - 3, 2, gh + 6);
    }
    if (charging && power > 0) {
      ctx.fillStyle = power > 94 ? "#ff5252" : "#e9ecf1";
      ctx.fillRect(gx, gy, gw * power / 100, gh);
    }
    ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 1;
    ctx.strokeRect(gx + .5, gy + .5, gw - 1, gh - 1);

    ctx.textAlign = "center";
    if (charging) {
      ctx.fillStyle = "#e9ecf1"; ctx.font = "bold 22px sans-serif";
      ctx.fillText(Math.round(power) + "%", W / 2, gy - 12);
    } else {
      ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.font = "15px sans-serif";
      ctx.fillText(gameOver ? (touchUI ? "화면을 누르면 다시 시작" : "SPACE 로 다시 시작")
        : (touchUI ? "왼쪽 끌어 이동   ·   오른쪽 버튼을 초록 구간에서 떼기 (조준은 자동)"
                   : "방향키 이동   ·   SPACE 눌렀다 초록 구간에서 놓기 (조준은 자동)"), W / 2, gy - 12);
    }
    ctx.textAlign = "left";
  }

  function drawHUD() {
    if (vsMode) { drawVsHUD(); return; }
    ctx.fillStyle = "#e9ecf1"; ctx.font = "bold 30px sans-serif"; ctx.textAlign = "left";
    ctx.fillText("SCORE  " + score, 28, 46);

    // 내 선수 / 상대 선수
    const mp = me(), rp = PLAYERS[rivalKey];

    ctx.font = "bold 17px sans-serif"; ctx.fillStyle = mp.uniform;

    ctx.fillText("VS  #" + rp.number + " " + rp.name, W - 28, 64);
    ctx.textAlign = "left";

    ctx.font = "17px sans-serif"; ctx.fillStyle = "#9aa3b2";
    ctx.fillText("남은 슛  " + Math.max(0, TOTAL_SHOTS - shots) + " / " + TOTAL_SHOTS +
                 "   ·   성공  " + makes, 28, 74);

    const d = distToRim();
    const dunkMode = d < DUNK_RANGE;

    ctx.font = "bold 17px sans-serif"; ctx.fillStyle = col;

    if (messageTimer > 0 && !gameOver) {
      ctx.textAlign = "center";
      ctx.globalAlpha = Math.min(1, messageTimer / 25);
      ctx.fillStyle = messageColor;
      const big = message === "DUNK!" || message === "3 POINTS!" || message === "GOAL!";
      ctx.font = (big ? "bold 54px" : "bold 32px") + " sans-serif";
      ctx.fillText(message, W / 2, 86);
      ctx.globalAlpha = 1; ctx.textAlign = "left";

  }

  function drawVsHUD() {
    const m = me(), f = foe();
    const onOff = possession === "me";

    // 양쪽 점수판
    ctx.textAlign = "left";
    ctx.fillStyle = m.uniform; ctx.font = "bold 17px sans-serif";
    ctx.fillText("#" + m.number + " " + m.name, 28, 36);

    ctx.fillText(String(myScore), 28, 84);

    ctx.textAlign = "right";
    ctx.fillStyle = f.uniform; ctx.font = "bold 17px sans-serif";
    ctx.fillText(f.name + " #" + f.number, W - 28, 36);
    ctx.fillStyle = "#e9ecf1"; ctx.font = "bold 46px sans-serif";
    ctx.fillText(String(cpuScore), W - 28, 84);

    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.font = "14px sans-serif";
    ctx.fillText(TARGET_SCORE + "점 선취  ·  " + diff().name, W / 2, 34);

    // 공격 / 수비 표시

    ctx.fillStyle = onOff ? "#4ade80" : "#60a5fa";
    ctx.fillText(onOff ? "내 공격" : "수비!", W / 2, 64);

    if (!onOff && checkT <= 0 && !vsOver) {
      ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.font = "14px sans-serif";
      ctx.fillText(touchUI ? "블락 = 오른쪽 큰 버튼 · 스틸 = 파란 버튼"
                           : "블락 = SPACE · 스틸 = Shift", W / 2, 88);
    }

    if (vsMsgTimer > 0) {
      ctx.globalAlpha = Math.min(1, vsMsgTimer / 20);
      ctx.fillStyle = vsMsgColor; ctx.font = "bold 50px sans-serif";
      ctx.fillText(vsMsg, W / 2, 150);
      ctx.globalAlpha = 1;
    }

    // 지금 자리 배점
    if (onOff && !vsOver) {
      const d = distToRim();
      const lbl = d < DUNK_RANGE ? "덩크 존 · 2점" : (isThree() ? "3점" : "2점");
      ctx.fillStyle = d < DUNK_RANGE ? "#f3c542" : (isThree() ? "#60a5fa" : "rgba(255,255,255,.5)");
      ctx.font = "bold 16px sans-serif";
      ctx.fillText(lbl + "  ·  " + d.toFixed(2) + "m", W / 2, 118);
    }
    ctx.textAlign = "left";
  }

  function drawVsOver() {
    ctx.fillStyle = "rgba(10,12,16,.86)"; ctx.fillRect(0, 0, W, H);
    const win = vsWinner === "me";
    ctx.textAlign = "center";
    ctx.fillStyle = win ? "#4ade80" : "#ff7a7a";
    ctx.font = "bold 72px sans-serif";
    ctx.fillText(win ? "WIN 🏆" : "LOSE", W / 2, H / 2 - 60);
    ctx.fillStyle = "#e9ecf1"; ctx.font = "bold 44px sans-serif";
    ctx.fillText(myScore + "  :  " + cpuScore, W / 2, H / 2 + 10);
    ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.font = "18px sans-serif";
    ctx.fillText(me().name + "   vs   " + foe().name + "  (" + diff().name + ")", W / 2, H / 2 + 52);
    ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.font = "17px sans-serif";
    ctx.fillText(touchUI ? "화면을 누르면 처음으로" : "SPACE 를 누르면 처음으로", W / 2, H / 2 + 110);
    ctx.textAlign = "left";
  }

  function drawGameOver() {
    if (vsMode) { drawVsOver(); return; }
    ctx.fillStyle = "rgba(10,12,16,.84)"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#9aa3b2"; ctx.font = "20px sans-serif";
    ctx.fillText("GAME OVER", W / 2, H / 2 - 100);
    ctx.fillStyle = "#e9ecf1"; ctx.font = "bold 64px sans-serif";
    ctx.fillText(score + " 점", W / 2, H / 2 - 30);
    ctx.fillStyle = "#9aa3b2"; ctx.font = "19px sans-serif";
    ctx.fillText(TOTAL_SHOTS + "번 중 " + makes + "번 성공 (" +
                 Math.round(makes / TOTAL_SHOTS * 100) + "%)", W / 2, H / 2 + 10);
    // 상대 선수와 비교
    const rp = PLAYERS[rivalKey];
    const win = score > rivalScore, tie = score === rivalScore;
    ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.font = "17px sans-serif";
    ctx.fillText("상대  #" + rp.number + " " + rp.name + "  —  " + rivalScore + " 점",
                 W / 2, H / 2 + 48);
    ctx.font = "bold 32px sans-serif";
    ctx.fillStyle = win ? "#4ade80" : (tie ? "#f3c542" : "#ff7a7a");
    ctx.fillText(win ? "WIN 🏆" : (tie ? "DRAW" : "LOSE"), W / 2, H / 2 + 92);

    ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.font = "17px sans-serif";
    ctx.fillText(touchUI ? "화면을 누르면 선수 선택으로"
                         : "SPACE 를 누르면 선수 선택으로", W / 2, H / 2 + 134);
    ctx.textAlign = "left";
  }

  // ===== 대결 모드 엔진 =====
  let shooter = "me";                 // 지금 공을 던진 쪽
  let checkT = 0;                     // 공격권 리셋 대기
  const CHECK_F = 50;

  const cpuState = () => ({
    x: cpu.x, z: cpu.z, lift: cpu.lift, hang: cpu.hang, dunkMode: cpu.dunking,
    armsUp: cpu.armsUp, dribbling: possession === "cpu" && cpu.state === "drive",
    dribPhase: cpu.dribPhase, dribSide: cpu.dribSide, data: foe()
  });

  function fireShot(sx, sz, speed) {
    const D = Math.max(0.4, Math.hypot(sx, sz - HOOP_Z));
    ball.dx = sx / D; ball.dz = (sz - HOOP_Z) / D;
    ball.p = D; ball.y = RELEASE_H;
    ball.vp = -Math.cos(SHOT_ANGLE) * speed;
    ball.vy = Math.sin(SHOT_ANGLE) * speed;
    ball.rot = 0; ball.live = true; ball.scored = false;
    settleTimer = 0; shotTimer = 0;
  }

  function vsReset(full) {
    if (full) {
      myScore = 0; cpuScore = 0; vsOver = false; vsWinner = null;
      possession = "me"; gameOver = false;
    }
    doCheck();
  }

  // 공격권 세팅 (탑에서 시작)
  function doCheck() {
    const off = possession === "me" ? player : cpu;
    const def = possession === "me" ? cpu : player;
    off.x = 0; off.z = 7.0;
    def.x = 0; def.z = 5.3;
    cpu.lift = 0; cpu.hang = 0; cpu.dunking = false; cpu.armsUp = 0;
    cpu.state = possession === "cpu" ? "drive" : "guard";
    cpu.timer = 40 + Math.round(Math.random() * 40);
    pickCpuSpot();
    dunk.active = false; dunk.lift = 0;
    defense.blockT = 0; defense.stealT = 0; defense.blockLift = 0;
    charging = false; power = 0;
    newBall(); bandDirty = true;
    checkT = CHECK_F;
    // 방금 뜬 메시지(BLOCK!·리바운드·득점)를 덮지 않는다
    if (vsMsgTimer < 12) say("CHECK", "#9aa3b2", CHECK_F);
  }

  // CPU 가 노릴 슛 지점 — 능력치에 따라 3점/골밑 취향이 갈린다
  function pickCpuSpot() {
    const f = foe();
    const wantThree = Math.random() * 100 < f.three_pt * 0.7;
    const wantDunk = !wantThree && Math.random() * 100 < f.dunk * 0.45;
    const ang = (Math.random() - 0.5) * 1.5;
    if (wantDunk) { cpu.targetX = Math.sin(ang) * 0.6; cpu.targetZ = HOOP_Z + 1.0; }
    else if (wantThree) {
      const r = THREE_R + 0.35 + Math.random() * 0.6;
      cpu.targetX = Math.sin(ang) * r * 0.9; cpu.targetZ = HOOP_Z + Math.cos(ang) * r;
    } else {
      const r = 3.0 + Math.random() * 2.8;
      cpu.targetX = Math.sin(ang) * r * 0.9; cpu.targetZ = HOOP_Z + Math.cos(ang) * r;
    }
    cpu.targetX = Math.max(PLAYER_MIN_X, Math.min(PLAYER_MAX_X, cpu.targetX));
    cpu.targetZ = Math.max(PLAYER_MIN_Z, Math.min(PLAYER_MAX_Z, cpu.targetZ));
  }

  const cpuSpeed = () => BASE_MOVE_SPEED * (foe().speed / 100) * diff().spd;

  // 몸싸움: 겹치면 파워가 높은 쪽이 밀어내고 낮은 쪽이 더 많이 밀려난다
  const BODY_R = 0.62;
  function bodyCollide() {
    const dx = player.x - cpu.x, dz = player.z - cpu.z;
    let d = Math.hypot(dx, dz);
    if (d >= BODY_R) return;
    if (d < 1e-4) { d = 1e-4; }
    const ux = dx / d, uz = dz / d;
    const push = BODY_R - d;
    const pm = me().power, pc = foe().power;
    const shareMe = pc / (pm + pc);      // 상대 파워가 셀수록 내가 많이 밀린다
    const shareCpu = pm / (pm + pc);
    player.x = Math.max(PLAYER_MIN_X, Math.min(PLAYER_MAX_X, player.x + ux * push * shareMe));
    player.z = Math.max(PLAYER_MIN_Z, Math.min(PLAYER_MAX_Z, player.z + uz * push * shareMe));
    cpu.x = Math.max(PLAYER_MIN_X, Math.min(PLAYER_MAX_X, cpu.x - ux * push * shareCpu));
    cpu.z = Math.max(PLAYER_MIN_Z, Math.min(PLAYER_MAX_Z, cpu.z - uz * push * shareCpu));
    bandDirty = true;
  }

  function moveToward(e, tx, tz, sp) {
    const dx = tx - e.x, dz = tz - e.z;
    const d = Math.hypot(dx, dz);
    if (d < sp) { e.x = tx; e.z = tz; return true; }
    e.x += dx / d * sp; e.z += dz / d * sp;
    e.x = Math.max(PLAYER_MIN_X, Math.min(PLAYER_MAX_X, e.x));
    e.z = Math.max(PLAYER_MIN_Z, Math.min(PLAYER_MAX_Z, e.z));
    return false;
  }

  function cpuShoot() {
    // 내가 타이밍 맞춰 뛰어 있으면 블락 판정
    if (tryBlockNow()) { turnover("me", "BLOCK!", "#4ade80"); return; }

    const d = hoopDist(cpu.x, cpu.z);
    const three = isThreeAt(cpu.x, cpu.z);
    const f = foe();

    // 내가 가까이 붙어 있으면 성공률이 떨어진다
    const guard = Math.hypot(player.x - cpu.x, player.z - cpu.z);
    const contest = guard < 1.8 ? 1 - 0.40 * (1 - guard / 1.8) : 1;

    if (d < DUNK_RANGE + 0.5) {                       // 덩크
      cpu.dunking = true; cpu.timer = RISE_F;
      cpu.shotWillMake = Math.random() * 100 < f.dunk * diff().aim * contest;
      cpu.state = "dunk";
      return;
    }
    const stat = three ? f.three_pt : f.two_pt;
    const p = (stat / 100) * diff().aim * contest * (1 - Math.min(0.25, d * 0.02));
    const make = Math.random() < p;
    const b = findBand(d);
    let speed;
    if (b) speed = make ? (b.lo + b.hi) / 2 : b.hi + (b.hi - b.lo) * (0.8 + Math.random() * 0.6);
    else speed = 0.17;
    cpu.shotWillMake = make;
    shooter = "cpu"; shotIsDunk = false;
    shotValue = three ? 3 : 2;
    cpu.armsUp = 1;
    fireShot(cpu.x, cpu.z, speed);
    cpu.state = "watch";
  }

  // 내가 블락 시도 — 점프 중 CPU 가 쏘면 판정
  function tryBlockNow() {
    if (defense.blockT < 6 || defense.blockT > 20) return false;
    const d = Math.hypot(player.x - cpu.x, player.z - cpu.z);
    if (d > 1.9) return false;
    const m = me();
    const reach = (m.block * 0.7 + m.jump * 0.3) / 100;
    const p = reach * (1 - d / 1.9) * 1.15;
    return Math.random() < p;
  }

  function trySteal(byMe) {
    const a = byMe ? me() : foe();
    const b = byMe ? foe() : me();
    const d = Math.hypot(player.x - cpu.x, player.z - cpu.z);
    const range = 1.4;
    if (d > range) return false;
    const p = (a.steal / 100) * (1 - b.power / 230) * (1 - d / range) * 0.95;
    return Math.random() < p;
  }

  function turnover(to, msg, col) {
    ball.live = false; dunk.active = false; cpu.dunking = false;
    possession = to;
    say(msg, col || "#60a5fa", 90);
    doCheck();
  }

  // 리바운드: (점프 + 파워) 합 × 골대와의 거리로 겨룬다.
  // 합을 그대로 쓰면 177 대 120 도 57% 밖에 안 벌어져서, 지수를 올려 차이를 키운다.
  const REB_EXP = 2.2;
  function rebound() {
    const wMe = Math.pow(me().jump + me().power, REB_EXP)
                * (1.6 - Math.min(1.2, distToRim() / 7));
    const wCpu = Math.pow(foe().jump + foe().power, REB_EXP)
                 * (1.6 - Math.min(1.2, hoopDist(cpu.x, cpu.z) / 7))
                 * (0.8 + 0.4 * diff().aggr);
    possession = Math.random() * (wMe + wCpu) < wMe ? "me" : "cpu";
    say(possession === "me" ? "리바운드!" : "상대 리바운드", possession === "me" ? "#4ade80" : "#ff9a5c", 70);
    doCheck();
  }

  function addScore(who, val) {
    if (who === "me") myScore += val; else cpuScore += val;
    if (myScore >= TARGET_SCORE || cpuScore >= TARGET_SCORE) {
      vsOver = true; gameOver = true;
      vsWinner = myScore >= TARGET_SCORE ? "me" : "cpu";
      ball.live = false; dunk.active = false; cpu.dunking = false;
      return true;
    }
    return false;
  }

  function vsStep() {
    if (vsMsgTimer > 0) vsMsgTimer--;
    if (vsOver) return;
    if (checkT > 0) { checkT--; return; }
    if (!dunk.active && !cpu.dunking) bodyCollide();   // 공중에 뜬 동안은 제외

    // --- CPU 공격 ---
    if (possession === "cpu") {
      if (cpu.state === "drive") {
        const reached = moveToward(cpu, cpu.targetX, cpu.targetZ, cpuSpeed());
        cpu.dribPhase = (cpu.dribPhase + 1 / DRIB_PERIOD) % 1;
        if (Math.abs(cpu.targetX - cpu.x) > 0.05) cpu.dribSide = cpu.targetX > cpu.x ? 1 : -1;
        cpu.timer--;
        if (reached && cpu.timer <= 0) cpuShoot();
        else if (cpu.timer < -90) cpuShoot();        // 너무 끌면 그냥 쏜다
      } else if (cpu.state === "dunk") {
        cpu.timer--;
        const p = 1 - Math.max(0, cpu.timer) / RISE_F;
        cpu.lift = dunkApex(foe(), cpu.shotWillMake) * Math.sin(p * Math.PI / 2);
        if (cpu.timer <= 0) {
          shooter = "cpu"; shotIsDunk = true; shotValue = 2;
          if (cpu.shotWillMake) { ball.dx = 0; ball.dz = 1; ball.p = 0.06; ball.y = RIM_H + BALL_R + 0.06;
            ball.vp = -0.012; ball.vy = -0.08; }
          else { ball.dx = 0; ball.dz = 1; ball.p = RIM_R + BALL_R * 0.5; ball.y = RIM_H + BALL_R * 1.2;
            ball.vp = 0.028; ball.vy = -0.03; }
          ball.rot = 0; ball.live = true; ball.scored = false;
          settleTimer = 0; shotTimer = 0;
          cpu.state = "watch";
        }
      } else if (cpu.state === "watch") {
        cpu.lift *= 0.86; cpu.armsUp *= 0.92;
      }

      // 내 수비 액션
      if (defense.stealT > 0) {
        defense.stealT--;
        if (defense.stealT === 10 && cpu.state === "drive") {
          if (trySteal(true)) { turnover("me", "STEAL!", "#4ade80"); return; }
        }
      }
      if (defense.blockT > 0) {
        defense.blockT--;
        defense.blockLift = 0.9 * Math.sin((1 - defense.blockT / 24) * Math.PI) * (me().jump / 100);
      } else defense.blockLift = 0;

    // --- 내 공격 ---
    } else {
      cpu.armsUp = 0; cpu.lift *= 0.86;
      if (!ball.live && !dunk.active) {
        // 수비 위치: 나와 골대 사이
        const tx = player.x * 0.72, tz = HOOP_Z + (player.z - HOOP_Z) * 0.72;
        moveToward(cpu, tx, tz, cpuSpeed() * 0.95);
        cpu.state = "guard";
        // CPU 스틸 시도
        cpu.timer--;
        if (cpu.timer <= 0) {
          cpu.timer = Math.round(70 + Math.random() * 90 / Math.max(0.3, diff().aggr));
          if (moving && trySteal(false)) { turnover("cpu", "스틸 당했다!", "#ff7a7a"); return; }
        }
      }
    }
  }

  // 대결 모드에서 슛이 끝났을 때
  function vsEndShot() {
    const who = shooter;
    if (ball.scored) {
      say(shotIsDunk ? "DUNK! +2" : (shotValue === 3 ? "3점!" : "+2"),
          who === "me" ? "#4ade80" : "#ff9a5c", 80);
      if (addScore(who, shotIsDunk ? 2 : shotValue)) return;
      possession = who;                 // 넣은 쪽이 계속 공격
      doCheck();
    } else {
      rebound();
    }
  }

  // ===== 캐릭터 선택 화면 =====
  function cardBox(i) {
    const margin = 46, gap = 14;
    const cw = (W - margin * 2 - gap * 6) / 7;
    return { x: margin + i * (cw + gap), y: 176, w: cw, h: 428 };
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSelect() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#1a1f2b"); g.addColorStop(1, "#0e1116");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.fillStyle = "#e9ecf1"; ctx.font = "bold 42px sans-serif";
    ctx.fillText("선수를 고르세요", W / 2, 96);
    ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.font = "17px sans-serif";
    ctx.fillText(touchUI ? "카드를 누르면 선택 · 한 번 더 누르면 시작"
                         : "← → 로 고르고  Enter 로 시작", W / 2, 132);

    const STATS = [["3점", "three_pt"], ["2점", "two_pt"], ["덩크", "dunk"], ["속도", "speed"],
                   ["파워", "power"], ["점프", "jump"], ["블락", "block"], ["스틸", "steal"]];

    for (let i = 0; i < PLAYER_KEYS.length; i++) {
      const p = PLAYERS[PLAYER_KEYS[i]];
      const b = cardBox(i);
      const on = i === pick;

      ctx.fillStyle = on ? "rgba(255,255,255,.10)" : "rgba(255,255,255,.045)";
      roundRect(b.x, b.y, b.w, b.h, 14); ctx.fill();
      ctx.strokeStyle = on ? p.uniform : "rgba(255,255,255,.12)";
      ctx.lineWidth = on ? 4 : 1.5;
      roundRect(b.x, b.y, b.w, b.h, 14); ctx.stroke();

      // 유니폼 + 등번호
      const bw = b.w * 0.56, bh = 74;
      const bx = b.x + (b.w - bw) / 2, by = b.y + 46;
      ctx.fillStyle = p.uniform;
      roundRect(bx, by, bw, bh, 8); ctx.fill();
      ctx.fillStyle = "#ffffff"; ctx.font = "bold 34px sans-serif";
      ctx.fillText(String(p.number), b.x + b.w / 2, by + bh / 2 + 12);

      // 머리 (대머리면 피부색만)
      ctx.fillStyle = SKIN;
      ctx.beginPath(); ctx.arc(b.x + b.w / 2, by - 16, 19, 0, Math.PI * 2); ctx.fill();
      if (!p.bald && p.hair) {
        ctx.fillStyle = p.hair;
        ctx.beginPath(); ctx.arc(b.x + b.w / 2, by - 19, 18, 0, Math.PI * 2); ctx.fill();
      }
      // 운동화
      ctx.fillStyle = p.shoe;
      roundRect(b.x + b.w / 2 - 26, by + bh + 8, 22, 9, 4); ctx.fill();
      roundRect(b.x + b.w / 2 + 4, by + bh + 8, 22, 9, 4); ctx.fill();
      ctx.fillStyle = p.shoeAccent;
      ctx.fillRect(b.x + b.w / 2 - 26, by + bh + 15, 22, 3);
      ctx.fillRect(b.x + b.w / 2 + 4, by + bh + 15, 22, 3);

      // 이름
      ctx.fillStyle = on ? "#ffffff" : "rgba(255,255,255,.75)";
      ctx.font = "bold 14px sans-serif";
      ctx.fillText(p.name, b.x + b.w / 2, b.y + 166);

      // 능력치 8개 (공격 4 + 수비·신체 4)
      const barW = b.w - 30;
      for (let k = 0; k < STATS.length; k++) {
        const v = p[STATS[k][1]];
        const yy = b.y + 190 + k * 29;
        if (k === 4) {                       // 공격 / 수비 구분선
          ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(b.x + 15, yy - 15); ctx.lineTo(b.x + b.w - 15, yy - 15); ctx.stroke();
        }
        ctx.textAlign = "left";
        ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.font = "11px sans-serif";
        ctx.fillText(STATS[k][0], b.x + 15, yy - 3);
        ctx.textAlign = "right";
        ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.font = "bold 11px sans-serif";
        ctx.fillText(String(v), b.x + b.w - 15, yy - 3);
        ctx.fillStyle = "rgba(255,255,255,.12)";
        ctx.fillRect(b.x + 15, yy, barW, 6);
        ctx.fillStyle = v >= 90 ? "#4ade80" : (v >= 70 ? "#f3c542" : "#e06c5a");
        ctx.fillRect(b.x + 15, yy, barW * v / 100, 6);
        ctx.textAlign = "center";
      }
    }

    // 상대 선수 안내
    ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.font = "16px sans-serif";
    ctx.fillText("상대 선수는 남은 선수 중에서 자동 배정됩니다", W / 2, H - 52);
    ctx.textAlign = "left";
  }

  function confirmPick() {
    myKey = PLAYER_KEYS[pick];
    const rest = PLAYER_KEYS.filter((k) => k !== myKey);
    rivalKey = rest[Math.floor(Math.random() * rest.length)];
    scene = "play";
    if (vsMode) { gameOver = false; vsReset(true); }
    else reset();
  }

  // ===== 모드 / 난이도 선택 화면 =====
  function modeBox(i) {
    const w = Math.min(560, W * 0.45), h = 150;
    return { x: (W - w) / 2, y: 190 + i * 178, w: w, h: h };
  }
  function diffBox(i) {
    const b = modeBox(1), w = (b.w - 24) / 3;
    return { x: b.x + i * (w + 12), y: b.y + b.h + 16, w: w, h: 52 };
  }

  function drawMode() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#1a1f2b"); g.addColorStop(1, "#0e1116");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.fillStyle = "#e9ecf1"; ctx.font = "bold 46px sans-serif";
    ctx.fillText("🏀  모드를 고르세요", W / 2, 110);
    ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.font = "16px sans-serif";
    ctx.fillText(touchUI ? "눌러서 선택 · 한 번 더 누르면 시작" : "↑ ↓ 모드   ← → 난이도   Enter 시작", W / 2, 146);

    const titles = ["혼자 슛 연습", "CPU 대결 (21점 선취)"];
    const descs = ["10구 던져서 점수 내기", "1대1 · 수비 · 블락 · 스틸"];
    for (let i = 0; i < 2; i++) {
      const b = modeBox(i), on = modePick === i;
      ctx.fillStyle = on ? "rgba(255,255,255,.10)" : "rgba(255,255,255,.04)";
      roundRect(b.x, b.y, b.w, b.h, 16); ctx.fill();
      ctx.strokeStyle = on ? "#f3c542" : "rgba(255,255,255,.12)";
      ctx.lineWidth = on ? 4 : 1.5;
      roundRect(b.x, b.y, b.w, b.h, 16); ctx.stroke();
      ctx.fillStyle = on ? "#ffffff" : "rgba(255,255,255,.7)";
      ctx.font = "bold 30px sans-serif";
      ctx.fillText(titles[i], W / 2, b.y + 58);
      ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.font = "17px sans-serif";
      ctx.fillText(descs[i], W / 2, b.y + 94);
    }

    // 난이도 (대결 모드일 때만)
    if (modePick === 1) {
      ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.font = "15px sans-serif";
      const b0 = diffBox(0);
      ctx.textAlign = "left";
      ctx.fillText("난이도", b0.x, b0.y - 10);
      ctx.textAlign = "center";
      for (let i = 0; i < 3; i++) {
        const b = diffBox(i), on = diffPick === i;
        ctx.fillStyle = on ? "rgba(243,197,66,.22)" : "rgba(255,255,255,.05)";
        roundRect(b.x, b.y, b.w, b.h, 10); ctx.fill();
        ctx.strokeStyle = on ? "#f3c542" : "rgba(255,255,255,.12)";
        ctx.lineWidth = on ? 3 : 1.5;
        roundRect(b.x, b.y, b.w, b.h, 10); ctx.stroke();
        ctx.fillStyle = on ? "#ffffff" : "rgba(255,255,255,.6)";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText(DIFFS[i].name, b.x + b.w / 2, b.y + 34);
      }
    }
    ctx.textAlign = "left";
  }

  // 상대 선수의 10구를 능력치로 시뮬레이션 (간단 모델)
  function simulateRival() {
    const p = PLAYERS[rivalKey];
    let pts = 0;
    for (let i = 0; i < TOTAL_SHOTS; i++) {
      const r = Math.random();
      if (r < 0.15) { if (Math.random() * 100 < p.dunk) pts += 2; }
      else if (r < 0.60) { if (Math.random() * 100 < p.two_pt * 0.75) pts += 2; }
      else { if (Math.random() * 100 < p.three_pt * 0.70) pts += 3; }
    }
    return pts;
  }

  function tickTimers() {
    if (messageTimer > 0) messageTimer--;
    if (rimFlash > 0) rimFlash--;
    if (charging) {
      power += powerDir * CHARGE_RATE;
      if (power >= 100) { power = 100; powerDir = -1; }
      if (power <= 0) { power = 0; powerDir = 1; }
    }

    // 슛 준비/릴리스 때만 팔을 든다
    const wantUp = (charging || (ball.live && !shotIsDunk && shotTimer < 25)) ? 1 : 0;
    armsUp += (wantUp - armsUp) * 0.3;

    // 드리블: 움직이기 시작하면 튀고, 멈추면 그 한 번을 마치고 손에 잡힌다
    if (moving) dribbling = true;
    if (dribbling && !charging && !ball.live && !dunk.active) {
      dribPhase += 1 / DRIB_PERIOD;
      if (dribPhase >= 1) { dribPhase = 0; if (!moving) dribbling = false; }
    } else if (!moving) {
      dribbling = false; dribPhase = 0;
    }
  }

  // 손에 들고 있을 때(드리블 포함) 공의 3D 위치
  function heldBallPos() {
    const bx = player.x + 0.34 * dribSide;
    const bz = player.z - 0.05;
    const by = dribbling
      ? BALL_R + (DRIB_HAND_H - BALL_R) * Math.abs(Math.cos(Math.PI * dribPhase))
      : DRIB_HAND_H;
    const u = armsUp;                      // 슛 준비하면 머리 위로 올라간다
    return {
      x: bx + (player.x - bx) * u,
      y: by + (RELEASE_H - by) * u,
      z: bz + ((player.z - 0.15) - bz) * u
    };
  }

  // ---- 터치 조작 UI ----
  function drawTouchUI() {
    if (!touchUI) return;

    // 왼쪽 조이스틱
    const base = joy.active ? { x: joy.ox, y: joy.oy } : joyHome();
    ctx.strokeStyle = "rgba(255,255,255,.22)";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(base.x, base.y, JOY_MAX, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.07)";
    ctx.fill();

    const kx = base.x + joy.x * JOY_MAX, ky = base.y + joy.z * JOY_MAX;
    ctx.fillStyle = joy.active ? "rgba(255,255,255,.55)" : "rgba(255,255,255,.3)";
    ctx.beginPath(); ctx.arc(kx, ky, 44, 0, Math.PI * 2); ctx.fill();

    if (!joy.active) {
      ctx.fillStyle = "rgba(255,255,255,.4)";
      ctx.font = "16px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("이동", base.x, base.y + JOY_MAX + 28);
      ctx.textAlign = "left";
    }

    // 오른쪽 슛 / 덩크 버튼
    const s = shootHome();
    const dunkMode = inDunkRange();
    const held = shootId !== null;
    ctx.fillStyle = dunkMode ? "rgba(243,197,66,.26)" : "rgba(74,222,128,.22)";
    if (held) ctx.fillStyle = dunkMode ? "rgba(243,197,66,.5)" : "rgba(74,222,128,.45)";
    ctx.beginPath(); ctx.arc(s.x, s.y, 92, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = dunkMode ? "rgba(243,197,66,.8)" : "rgba(74,222,128,.7)";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(s.x, s.y, 92, 0, Math.PI * 2); ctx.stroke();

    const defMode = vsMode && possession === "cpu" && !vsOver;
    ctx.fillStyle = "#e9ecf1";
    ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(defMode ? "블락" : (dunkMode ? "덩크" : "슛"), s.x, s.y + 9);

    // 수비 중에만 뜨는 스틸 버튼
    if (defMode) {
      const sb = stealHome();
      const hot = defense.stealT > 0;
      ctx.fillStyle = hot ? "rgba(96,165,250,.5)" : "rgba(96,165,250,.22)";
      ctx.beginPath(); ctx.arc(sb.x, sb.y, 66, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(96,165,250,.8)"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(sb.x, sb.y, 66, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "#e9ecf1"; ctx.font = "bold 21px sans-serif";
      ctx.fillText("스틸", sb.x, sb.y + 8);
    }
    ctx.textAlign = "left";
  }

  function drawRotateNotice() {
    if (!touchUI || window.innerHeight <= window.innerWidth) return;
    ctx.fillStyle = "rgba(8,10,14,.93)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#e9ecf1";
    ctx.font = "bold 44px sans-serif";
    ctx.fillText("📱  가로로 돌려주세요", W / 2, H / 2 - 10);
    ctx.fillStyle = "rgba(255,255,255,.6)";
    ctx.font = "22px sans-serif";
    ctx.fillText("가로 화면에서 플레이할 수 있습니다", W / 2, H / 2 + 40);
    ctx.textAlign = "left";
  }

  function draw() {
    if (scene === "mode") { drawMode(); drawRotateNotice(); return; }
    if (scene === "select") { drawSelect(); drawRotateNotice(); return; }
    drawCourt();

    // 먼 선수부터 그린다 (z 가 작을수록 멀다)
    const myState = {
      x: dunk.active ? dunk.x : player.x, z: dunk.active ? dunk.z : player.z,
      lift: (dunk.active ? dunk.lift : 0) + (vsMode ? defense.blockLift : 0),
      hang: dunk.active ? dunk.hang : 0, dunkMode: dunk.active,
      armsUp: Math.max(armsUp, vsMode && defense.blockT > 0 ? 1 : 0),
      dribbling: dribbling, dribPhase: dribPhase, dribSide: dribSide, data: me()
    };
    const figs = vsMode ? [myState, cpuState()] : [myState];
    figs.sort((a, b) => a.z - b.z);

    let drewHoop = false;
    for (const f of figs) {
      if (!drewHoop && f.z >= HOOP_Z) { drawHoop(); drewHoop = true; }
      drawPlayer(f);
    }
    if (!drewHoop) drawHoop();

    drawBall();
    ctx.fillStyle = "#0f1115";
    ctx.fillRect(0, PANEL_Y, W, H - PANEL_Y);
    drawGauge();
    drawHUD();
    drawTouchUI();
    if (gameOver) drawGameOver();
    drawRotateNotice();
  }

  let acc = 0, last = 0;
  function loop(now) {
    if (!last) last = now;
    acc += Math.min(now - last, 200);
    last = now;
    while (acc >= STEP_MS) { if (scene === "play") { step(); tickTimers(); } acc -= STEP_MS; }
    draw();
    requestAnimationFrame(loop);
  }

  fitCanvas();
  newBall();
  refreshBand();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
